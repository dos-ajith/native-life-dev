manifest_version = 1
dependencies = []
categories = [
  { slug = "business-product", name = "Product", parent = "business", bind = true, include_descendants = true },
  { slug = "business-product-ecommerce", name = "E-commerce", parent = "business-product" },
  { slug = "business-product-ecommerce-fashion", name = "Fashion & Apparel", parent = "business-product-ecommerce" },
  { slug = "business-product-ecommerce-electronics", name = "Electronics", parent = "business-product-ecommerce" },
  { slug = "business-product-ecommerce-home-living", name = "Home & Living", parent = "business-product-ecommerce" },
  { slug = "business-product-ecommerce-grocery", name = "Grocery & Food", parent = "business-product-ecommerce" },
  { slug = "business-product-ecommerce-beauty", name = "Beauty & Personal Care", parent = "business-product-ecommerce" },
]

[plugin]
key = "ecommerce"
name = "E-commerce"
version = "1.2.2"
role_scope = "business-service-provider"
business_type = "product"
description = "Product catalog and inventory for product businesses."

[compatibility]
core_api = ">=1.6,<2.0"

[entrypoint]
module = "backend.plugin"
function = "register"

[api]
prefix = "/plugins/ecommerce"
tag = "1.5 Businesses · E-commerce"

[database]
table_prefix = "plg_ecommerce_"
migrations = true
seeders = true

[permissions."plugin.ecommerce.products.view"]
description = "View e-commerce products and product categories"

[permissions."plugin.ecommerce.products.manage"]
description = "Create and update e-commerce products, images and product categories"

[permissions."plugin.ecommerce.inventory.view"]
description = "View e-commerce stock levels, low-stock items and stock movements"

[permissions."plugin.ecommerce.inventory.manage"]
description = "Adjust e-commerce stock and low-stock thresholds"

[permissions."plugin.ecommerce.settings.view"]
description = "View e-commerce settings"

[permissions."plugin.ecommerce.settings.manage"]
description = "Update e-commerce settings"

[[capabilities]]
key = "products"
title = "Products"
type = "menu"
path = "/businesses/{business_id}/products"
permission = "plugin.ecommerce.products.view"

[[capabilities]]
key = "inventory"
title = "Inventory"
type = "menu"
path = "/businesses/{business_id}/inventory"
permission = "plugin.ecommerce.inventory.view"

[[capabilities]]
key = "settings"
title = "E-commerce settings"
type = "menu"
path = "/businesses/{business_id}/settings"
permission = "plugin.ecommerce.settings.view"
