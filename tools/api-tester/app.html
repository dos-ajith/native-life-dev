function createMenuScreen() {
  const can = permissionChecker(session.me);
  const option = (title, subtitle, permission, onClick) => {
    const allowed = can([permission]);
    return h('button', {
      className: 'option',
      type: 'button',
      disabled: !allowed,
      textContent: allowed ? `${title} — ${subtitle}` : `${title} — needs the ${permission} permission`,
      onclick: onClick,
    });
  };
  screenOf(
    backBar('Create', () => homeScreen(shell.tab)),
    h('div', { className: 'hint', textContent: 'Share with your community' }),
    option('Post', 'Share updates, thoughts, photos or videos', 'post.create', createPostScreen),
    option('Create Deal', 'Start a deal for local products or services', 'deal.create', dealCreateScreen),
    option('Report Lost Property', 'Post about a lost item', 'lost_found.create', () => lostFoundCreateScreen('lost')),
    option('Report Found Property', 'Post about a found item', 'lost_found.create', () => lostFoundCreateScreen('found')),
  );
}

function locationFields(prefix = '') {
  const name = h('input', { type: 'text', placeholder: 'Place name (optional)' });
  const latitude = h('input', { type: 'number', step: 'any', placeholder: 'Latitude' });
  const longitude = h('input', { type: 'number', step: 'any', placeholder: 'Longitude' });
  const message = h('span', { className: 'err' });
  const locate = h('button', {
    type: 'button',
    textContent: 'Use my current location',
    onclick: () => navigator.geolocation.getCurrentPosition((position) => {
      latitude.value = position.coords.latitude.toFixed(6);
      longitude.value = position.coords.longitude.toFixed(6);
      message.textContent = '';
    }, () => { message.textContent = 'Could not read your location. Type the coordinates instead.'; }),
  });
  const el = h('div', {}, h('label', { textContent: `${prefix}Location` }), name, h('div', { className: 'row' }, latitude, longitude), locate, message);
  return { el, name, latitude, longitude };
}

function postComposer(onDone = () => homeScreen('home'), communityId = null) {
  const content = h('textarea', { placeholder: 'Write here…', maxLength: POST_TEXT_LIMIT });
  const counter = h('div', { className: 'meta', textContent: `0/${POST_TEXT_LIMIT}` });
  content.oninput = () => { counter.textContent = `${content.value.length}/${POST_TEXT_LIMIT}`; };
  const images = h('input', { type: 'file', multiple: true, accept: 'image/*' });
  const video = h('input', { type: 'file', accept: 'video/*' });
  const thumbnail = h('input', { type: 'file', accept: 'image/*' });
  const place = locationFields();
  const audience = h('select', {}, [['everyone', 'Everyone'], ['adults_only', 'Adults only (18+)']].map(([value, label]) => h('option', { value, textContent: label })));
  const error = h('div', { className: 'err' });
  const button = h('button', { className: 'primary', type: 'submit', textContent: 'Post' });
  const el = h('form', { className: 'stack' },
    h('label', { textContent: "What's on your mind?" }), content, counter,
    h('label', { textContent: `Add photos (up to ${POST_MAX_IMAGES}) or one video` }), images,
    h('label', { textContent: 'Video (optional, max 100MB)' }), video,
    h('label', { textContent: 'Video cover image (required with a video)' }), thumbnail,
    place.el,
    h('label', { textContent: 'Audience' }), audience,
    button, error);
  el.onsubmit = async (event) => {
    event.preventDefault();
    error.textContent = '';
    if (images.files.length > POST_MAX_IMAGES) {
      error.textContent = `You can add up to ${POST_MAX_IMAGES} photos.`;
      return;
    }
    if (video.files[0] && images.files.length) {
      error.textContent = 'Choose photos or one video, not both.';
      return;
    }
    if (video.files[0] && !thumbnail.files[0]) {
      error.textContent = 'A video needs a cover image.';
      return;
    }
    button.disabled = true;
    const body = formOf({
      content: content.value,
      status: 'published',
      audience: audience.value,
      visibility: communityId ? 'private' : 'public',
      community_id: communityId,
      location_name: place.name.value,
      latitude: place.latitude.value,
      longitude: place.longitude.value,
    });
    [...images.files].forEach((file) => body.append('images', file));
    if (video.files[0]) {
      body.append('videos', video.files[0]);
      body.append('video_thumbnails', thumbnail.files[0]);
    }
    const res = await api('POST', '/posts', { form: body });
    button.disabled = false;
    if (!res.ok) {
      error.textContent = errorText(res);
      return;
    }
    onDone();
  };
  return el;
}

function createPostScreen() {
  screenOf(backBar('Create Post', createMenuScreen), postComposer());
}

const DEAL_DELIVERY_CHOICES = [
  { value: 'instant', label: 'Instant delivery' },
  { value: 'route', label: 'Route delivery' },
  { value: 'self_pickup', label: 'Self pickup' },
];

function deliveryOptionPicker(selected) {
  const choices = DEAL_DELIVERY_CHOICES.map((choice) => ({
    ...choice,
    box: h('input', { type: 'checkbox', checked: selected.includes(choice.value) }),
  }));
  const el = h('div', { className: 'stack' }, choices.map((choice) => h('label', { className: 'row' }, choice.box, h('span', { textContent: choice.label }))));
  const values = () => choices.filter((choice) => choice.box.checked).map((choice) => choice.value);
  return { el, values };
}

function dealItemRow(state, onRemove) {
  const productMode = Boolean(state.businessId);
  const nameInput = h('input', { type: 'text', placeholder: 'Item name' });
  const unitInput = h('input', { type: 'text', placeholder: 'Unit (kg, pack…)' });
  const quantityInput = h('input', { type: 'number', min: '1', placeholder: 'Quantity' });
  const originalInput = h('input', { type: 'number', step: 'any', min: '0', placeholder: 'Original price (optional)' });
  const dealInput = h('input', { type: 'number', step: 'any', min: '0', placeholder: 'Deal price' });
  const discount = h('span', { className: 'meta', textContent: 'Discount 0%' });
  const productSelect = h('select', {}, h('option', { value: '', textContent: 'Loading products…' }));
  if (productMode) {
    const productsPath = state.isMine
      ? `/plugins/ecommerce/businesses/${state.businessId}/products`
      : `/plugins/ecommerce/explore/products?business_id=${state.businessId}`;
    loadAllOptions(productsPath).then((products) => {
      productSelect.replaceChildren(h('option', { value: '', textContent: 'Choose a product' }), ...products.map((p) => h('option', { value: p.id, textContent: `${p.name} (${p.selling_price})` })));
    });
  }
  const updateDiscount = () => {
    const original = Number(originalInput.value);
    const price = Number(dealInput.value);
    discount.textContent = original > 0 && price >= 0 ? `Discount ${Math.max(0, Math.round(((original - price) / original) * PERCENT))}%` : 'Discount 0%';
  };
  originalInput.oninput = updateDiscount;
  dealInput.oninput = updateDiscount;
  const remove = h('button', { type: 'button', textContent: 'Remove item', onclick: onRemove });
  const layout = productMode
    ? [productSelect, h('div', { className: 'row' }, quantityInput, dealInput)]
    : [nameInput, h('div', { className: 'row' }, unitInput, quantityInput), h('div', { className: 'row' }, originalInput, dealInput), discount];
  const el = h('div', { className: 'card stack' }, ...layout, remove);
  const read = () => {
    const item = { quantity: Number(quantityInput.value), deal_price: dealInput.value };
    if (productMode) return { ...item, product_id: productSelect.value };
    const manualItem = { ...item, name: nameInput.value, unit: unitInput.value };
    if (originalInput.value !== '') manualItem.original_price = originalInput.value;
    return manualItem;
  };
  return { el, read };
}

function promotableLabel(business) {
  const owner = business.is_mine ? '' : ' (promoting for another owner)';
  const history = business.deals_created ? ` · ${business.deals_created} earlier deals` : '';
  return `${business.name}${owner}${history}`;
}

function dealCreateScreen() {
  const state = { businessId: '', isMine: true };
  const images = h('input', { type: 'file', multiple: true, accept: 'image/*' });
  const title = h('input', { type: 'text', placeholder: 'eg. fresh vegetable bulk deal' });
  const category = h('select', {}, h('option', { value: '', textContent: 'Loading…' }));
  loadAllOptions(`/categories?parent_slug=${DEAL_CATEGORY_SLUG}`).then(async (children) => {
    const options = children.length
      ? children
      : (await loadAllOptions('/categories')).filter((c) => c.slug === DEAL_CATEGORY_SLUG);
    category.replaceChildren(h('option', { value: '', textContent: 'Select category' }), ...options.map((o) => h('option', { value: o.id, textContent: o.name })));
  });
  const description = h('textarea', { placeholder: "Describe the deal, what's included, quality, brand, etc.", maxLength: POST_TEXT_LIMIT });
  const sellerType = h('select', {},
    h('option', { value: 'individual', textContent: 'Individual — I sell these items myself' }));
  const business = h('select', {}, h('option', { value: '', textContent: 'Choose a business' }));
  const sellAs = h('div', { className: 'stack', hidden: true }, h('label', { textContent: 'Sell as *' }), sellerType);
  const promotable = new Map();
  loadAllOptions('/deals/promotable-businesses').then((activeBusinesses) => {
    if (!activeBusinesses.length) return;
    activeBusinesses.forEach((b) => promotable.set(b.id, b));
    business.append(...activeBusinesses.map((b) => h('option', { value: b.id, textContent: promotableLabel(b) })));
    sellerType.append(h('option', { value: 'business', textContent: 'Business — sell my business products' }));
    sellAs.hidden = false;
  });
  const itemsBox = h('div', {});
  let rows = [];
  const addRow = () => {
    const row = dealItemRow(state, () => {
      rows = rows.filter((r) => r !== row);
      row.el.remove();
    });
    rows.push(row);
    itemsBox.append(row.el);
  };
  const resetItems = () => {
    state.businessId = business.value;
    state.isMine = promotable.get(business.value)?.is_mine ?? true;
    rows = [];
    itemsBox.replaceChildren();
    addRow();
  };
  business.onchange = resetItems;
  const businessBox = h('div', { hidden: true }, h('label', { textContent: 'Business *' }), business);
  sellerType.onchange = () => {
    const isBusiness = sellerType.value === 'business';
    businessBox.hidden = !isBusiness;
    if (!isBusiness) business.value = '';
    resetItems();
  };
  const minJoiners = h('input', { type: 'number', min: '1', placeholder: 'Minimum joiners (optional)' });
  const startsAt = h('input', { type: 'datetime-local' });
  const validUntil = h('input', { type: 'datetime-local' });
  const pickup = h('input', { type: 'text', placeholder: 'Pickup location — address or landmark' });
  const delivery = h('input', { type: 'text', placeholder: 'Delivery details — areas covered' });
  const deliveryPicker = deliveryOptionPicker(['route', 'self_pickup']);
  const error = h('div', { className: 'err' });
  const button = h('button', { className: 'primary', type: 'submit', textContent: 'Publish Deal' });
  const el = h('form', { className: 'stack' },
    h('label', { textContent: `Cover images (up to ${DEAL_MAX_IMAGES}) — the first one is the thumbnail` }), images,
    h('label', { textContent: 'Deal title *' }), title,
    h('label', { textContent: 'Category *' }), category,
    h('label', { textContent: 'Description' }), description,
    sellAs, businessBox,
    h('label', { textContent: 'Items & prices *' }), itemsBox,
    h('button', { type: 'button', textContent: '+ Add item', onclick: addRow }),
    h('label', { textContent: 'Target & progress' }), minJoiners,
    h('label', { textContent: 'Start date & time *' }), startsAt,
    h('label', { textContent: 'End date & time *' }), validUntil,
    h('label', { textContent: 'Delivery options offered * (customers choose from these)' }), deliveryPicker.el,
    h('label', { textContent: 'Pickup / delivery details * (at least one)' }), pickup, delivery,
    button, error);
  addRow();
  el.onsubmit = async (event) => {
    event.preventDefault();
    error.textContent = '';
    if (images.files.length > DEAL_MAX_IMAGES) {
      error.textContent = `You can add up to ${DEAL_MAX_IMAGES} photos.`;
      return;
    }
    if (!startsAt.value || !validUntil.value) {
      error.textContent = 'Choose a start and an end date.';
      return;
    }
    if (sellerType.value === 'business' && !business.value) {
      error.textContent = 'Choose the business that sells these products.';
      return;
    }
    const deliveryOptions = deliveryPicker.values();
    if (!deliveryOptions.length) {
      error.textContent = 'Offer at least one delivery option.';
      return;
    }
    if (deliveryOptions.includes('self_pickup') && !pickup.value.trim()) {
      error.textContent = 'Add a pickup location to offer self pickup.';
      return;
    }
    button.disabled = true;
    const body = formOf({
      name: title.value,
      category_id: category.value,
      description: description.value,
      business_id: business.value,
      min_joiners: minJoiners.value,
      starts_at: new Date(startsAt.value).toISOString(),
      valid_until: new Date(validUntil.value).toISOString(),
      pickup_location: pickup.value,
      delivery_details: delivery.value,
      items: JSON.stringify(rows.map((r) => r.read())),
    });
    [...images.files].forEach((file) => body.append('images', file));
    deliveryOptions.forEach((option) => body.append('delivery_options', option));
    const created = await api('POST', '/deals', { form: body });
    if (!created.ok) {
      button.disabled = false;
      error.textContent = errorText(created);
      return;
    }
    const submitted = await api('POST', `/deals/${created.data.id}/submit`);
    button.disabled = false;
    dealCreatedScreen(created.data, submitted);
  };
  screenOf(backBar('Create Deal', createMenuScreen), el);
}

  const publishedByYou = submitResult.ok && submitResult.data.deal.status === 'published';
  const lines = publishedByYou

    : submitResult.ok
    ? [`Submitted for acceptance. Invited users: ${submitResult.data.invited_count ?? 0}.`, 'The deal goes live once an eligible promoter accepts it.']
    : [`The deal was saved as a draft, but submitting failed: ${errorText(submitResult)}`, 'Open My deals to fix it and submit again.'];
  screenOf(
    h('h2', { textContent: publishedByYou ? 'Deal published' : submitResult.ok ? 'Deal submitted' : 'Deal saved as draft' }),
    h('div', { className: 'card' }, h('strong', { textContent: deal.name }), lines.map((line) => h('div', { className: submitResult.ok ? '' : 'err', textContent: line }))),
    h('button', { className: 'primary', type: 'button', textContent: 'Open My deals', onclick: myDealsScreen }),
    linkButton('Back to Home', () => homeScreen('home')),
  );
}

const APP_DATE_PATTERN = /^(\d{2})-(\d{2})-(\d{4}) (\d{1,2}):(\d{2}) (AM|PM)$/;
const HOURS_ON_CLOCK = 12;

function dateTimeLocalValue(text) {
  if (!text) return '';
  const match = APP_DATE_PATTERN.exec(text);
  if (!match) return '';
  const [, day, month, year, hour, minute, meridiem] = match;
  const hours24 = (Number(hour) % HOURS_ON_CLOCK) + (meridiem === 'PM' ? HOURS_ON_CLOCK : 0);
  return `${year}-${month}-${day}T${String(hours24).padStart(2, '0')}:${minute}`;
}

function dealItemEditor(deal, item, reload) {
  const message = h('div', { className: 'err' });
  const name = h('input', { type: 'text', value: item.name, disabled: Boolean(item.product_id) });
  const unit = h('input', { type: 'text', placeholder: 'Unit', value: item.unit ?? '' });
  const quantity = h('input', { type: 'number', min: '1', placeholder: 'Quantity', value: item.quantity ?? '' });
  const original = h('input', { type: 'number', step: 'any', min: '0', placeholder: 'Original price', value: item.original_price ?? '' });
  const price = h('input', { type: 'number', step: 'any', min: '0', placeholder: 'Deal price', value: item.deal_price ?? '' });
  const run = async (request) => {
    message.textContent = '';
    const res = await request();
    if (res.ok) reload(res.data);
    else message.textContent = errorText(res);
  };
  const save = () => {
    const json = { quantity: Number(quantity.value) || null, deal_price: price.value };
    if (!item.product_id) Object.assign(json, { name: name.value, unit: unit.value || null, original_price: original.value || null });
    return run(() => api('PATCH', `/deals/${deal.id}/items/${item.id}`, { json }));
  };
  return h('div', { className: 'card stack' },
    name,
    item.product_id ? '' : h('div', { className: 'row' }, unit, quantity),
    item.product_id ? quantity : '',
    item.product_id ? '' : h('div', { className: 'row' }, original, price),
    item.product_id ? price : '',
    h('div', { className: 'row wrap' },
      h('button', { type: 'button', textContent: 'Save item', onclick: save }),
      h('button', { type: 'button', textContent: 'Remove item', onclick: () => run(() => api('DELETE', `/deals/${deal.id}/items/${item.id}`)) })),
    message);
}

async function dealEditScreen(dealId) {
  const content = h('div', {});
  screenOf(backBar('Edit deal', myDealsScreen), content);
  const res = await api('GET', `/deals/${dealId}`);
  if (!res.ok) {
    content.append(h('div', { className: 'err', textContent: errorText(res) }));
    return;
  }
  const deal = res.data;
  const title = h('input', { type: 'text', value: deal.name });

  loadAllOptions(`/categories?parent_slug=${DEAL_CATEGORY_SLUG}`).then((children) => {
    if (!children.length) return;
    category.replaceChildren(...children.map((o) => h('option', { value: o.id, textContent: o.name, selected: o.id === deal.category.id })));
  });
  const description = h('textarea', { maxLength: POST_TEXT_LIMIT, value: deal.description ?? '' });
  const minJoiners = h('input', { type: 'number', min: '1', placeholder: 'Minimum joiners (optional)', value: deal.min_joiners ?? '' });
  const startsAt = h('input', { type: 'datetime-local', value: dateTimeLocalValue(deal.starts_at) });
  const validUntil = h('input', { type: 'datetime-local', value: dateTimeLocalValue(deal.valid_until) });
  const pickup = h('input', { type: 'text', placeholder: 'Pickup location', value: deal.pickup_location ?? '' });
  const delivery = h('input', { type: 'text', placeholder: 'Delivery details', value: deal.delivery_details ?? '' });
  const deliveryPicker = deliveryOptionPicker(deal.delivery_options);
  const error = h('div', { className: 'err' });
  const ok = h('div', { className: 'ok' });
  const button = h('button', { className: 'primary', type: 'submit', textContent: 'Save changes' });
  const form = h('form', { className: 'stack' },
    h('label', { textContent: 'Deal title *' }), title,
    h('label', { textContent: 'Category *' }), category,
    h('label', { textContent: 'Description' }), description,
    h('label', { textContent: 'Target & progress' }), minJoiners,
    h('label', { textContent: 'Start date & time' }), startsAt,
    h('label', { textContent: 'End date & time' }), validUntil,
    h('label', { textContent: 'Delivery options offered *' }), deliveryPicker.el,
    h('label', { textContent: 'Pickup / delivery details (at least one)' }), pickup, delivery,
    button, error, ok);
  form.onsubmit = async (event) => {
    event.preventDefault();
    error.textContent = '';
    ok.textContent = '';
    button.disabled = true;
    const result = await api('PATCH', `/deals/${deal.id}`, {
      json: {
        name: title.value,
        category_id: category.value,
        description: description.value || null,
        min_joiners: minJoiners.value ? Number(minJoiners.value) : null,
        starts_at: startsAt.value ? new Date(startsAt.value).toISOString() : null,
        valid_until: validUntil.value ? new Date(validUntil.value).toISOString() : null,
        pickup_location: pickup.value || null,
        delivery_details: delivery.value || null,
        delivery_options: deliveryPicker.values(),
      },
    });
    button.disabled = false;
    if (result.ok) ok.textContent = 'Saved.';
    else error.textContent = errorText(result);
  };
  const itemsBox = h('div', {});
  const drawItems = (current) => {
    itemsBox.replaceChildren(...current.items.map((item) => dealItemEditor(current, item, drawItems)));
    if (!current.items.length) itemsBox.append(h('div', { className: 'hint', textContent: 'No items. A deal needs at least one item to be submitted.' }));
  };
  drawItems(deal);
  const photosBox = h('div', {});
  const photoMessage = h('div', { className: 'err' });
  const addPhoto = h('input', { type: 'file', accept: 'image/*' });
  const changePhotos = async (request) => {
    photoMessage.textContent = '';
    const result = await request();
    if (!result.ok) {
      photoMessage.textContent = errorText(result);
      return;
    }
    drawPhotos(result.data);
  };
  const drawPhotos = (current) => {
    photosBox.replaceChildren(...current.images.map((image) => h('div', { className: 'card stack' },
      privateImage(image.file_url),
      h('div', { className: 'row wrap' },
        image.is_thumbnail

  if (deal.status === 'draft') {
    buttons.push(h('button', { type: 'button', textContent: 'Edit', onclick: () => dealEditScreen(deal.id) }));
    buttons.push(h('button', { type: 'button', textContent: 'Submit for acceptance', onclick: () => run(() => api('POST', `/deals/${deal.id}/submit`)) }));
    buttons.push(h('button', {
      type: 'button',
      textContent: 'Delete draft',
      onclick: () => {
        if (window.confirm(`Delete "${deal.name}"?`)) run(() => api('DELETE', `/deals/${deal.id}`));
      },
    }));
  }
  if (deal.status === 'pending_acceptance') {
    buttons.push(h('button', { type: 'button', textContent: 'Refresh invitations', onclick: () => run(() => api('POST', `/deals/${deal.id}/invitations/refresh`)) }));
  }
  if (deal.status === 'published') {

      type: 'button',
      textContent: 'Close deal',

        if (window.confirm(`Close "${deal.name}"? No one else can join or order; existing orders stay.`)) {

        }
      },
    }));

  if (deal.status === 'blocked') {
    buttons.push(h('button', { type: 'button', textContent: 'Request republish', onclick: () => run(() => api('POST', `/deals/${deal.id}/request-republish`)) }));

function lostFoundCreateScreen(kind = 'lost') {
  const isLost = kind === 'lost';
  const today = new Date().toISOString().slice(0, 10);
  const fields = [
    { name: 'category_id', label: 'Category *', type: 'choice', optionsPath: `/categories?parent_slug=${LOST_FOUND_CATEGORY_SLUG}` },
    { name: 'title', label: 'Title *' },
    { name: 'description', label: 'Description * (max 500)', type: 'textarea' },
    { name: 'location_name', label: isLost ? 'Last seen location *' : 'Found location *' },
    { name: 'latitude', label: 'Latitude *', type: 'number' },
    { name: 'longitude', label: 'Longitude *', type: 'number' },
    { name: 'occurred_on', label: isLost ? 'Date lost *' : 'Date found *', type: 'date' },
    { name: 'contact_info', label: 'Contact information *' },
    { name: 'images', label: 'Add images (up to 4)', type: 'file', multiple: true },
  ];
  const inputs = fields.map((field) => ({ field, ...fieldInput(field, null) }));
  const byName = (name) => inputs.find((i) => i.field.name === name).el.querySelector('input,select,textarea');
  byName('occurred_on').value = today;
  const error = h('div', { className: 'err' });
  const locate = h('button', {
    type: 'button',
    textContent: 'Use my current location',
    onclick: () => navigator.geolocation.getCurrentPosition((position) => {
      byName('latitude').value = position.coords.latitude.toFixed(6);
      byName('longitude').value = position.coords.longitude.toFixed(6);
    }, () => { error.textContent = 'Could not read your location. Type the coordinates instead.'; }),
  });
  const button = h('button', { className: 'primary', type: 'submit', textContent: 'Submit' });
  const el = h('form', {}, inputs.map((i) => i.el), locate, button, error);
  el.onsubmit = async (event) => {
    event.preventDefault();
    error.textContent = '';
    button.disabled = true;
    const body = collectBody({ encoding: 'form' }, inputs);
    body.form.append('kind', kind);
    const res = await api('POST', '/lost-found', body);
    button.disabled = false;
    if (!res.ok) {
      error.textContent = errorText(res);
      return;
    }
    lostFoundScreen(kind);
  };
  screenOf(
    backBar(isLost ? 'Report Lost Property' : 'Report Found Property', createMenuScreen),
    h('div', { className: 'hint', textContent: 'People whose native place is near this spot get a notification.' }),
    el,
  );
}

const DELIVERY_OPTION_LABELS = { instant: 'Instant delivery (today)', route: 'Route delivery (next working day)', self_pickup: 'Self pickup' };
const PAYMENT_METHODS = [
  { id: 'cash_on_delivery', label: 'Cash on delivery', api: 'cash_on_delivery' },
  { id: 'online', label: 'Pay online (Razorpay)', api: 'online' },
];
const DEFAULT_PAYMENT_METHOD = 'cash_on_delivery';

function paymentLabel(id) {
  return (PAYMENT_METHODS.find((method) => method.id === id) || { label: id }).label;
}

function timeLabel(value) {
  const [hours, minutes] = value.split(':').map(Number);
  const meridiem = hours >= 12 ? 'PM' : 'AM';
  return `${hours % 12 || 12}:${String(minutes).padStart(2, '0')} ${meridiem}`;
}

function expectedDeliveryText(order) {
  if (!order.expected_delivery_date) return order.delivery_option === 'self_pickup' ? 'Pick up from the seller' : 'To be confirmed';
  const date = new Date(`${order.expected_delivery_date}T00:00:00`);
  const sameDay = date.toDateString() === new Date().toDateString();
  const day = sameDay ? 'Today' : date.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
  const window = order.expected_delivery_from && order.expected_delivery_to ? `, ${timeLabel(order.expected_delivery_from)} – ${timeLabel(order.expected_delivery_to)}` : '';
  return `${day}${window}`;
}

function pinMap(onPick) {
  const container = h('div', { style: `height:${MAP_HEIGHT_PX}px;margin:8px 0` });
  const map = newMap(container).setView([0, 0], 2);
  let marker = null;
  const place = (lat, lng) => {
    if (marker) marker.setLatLng([lat, lng]);
    else {
      marker = L.marker([lat, lng], { draggable: true }).addTo(map);
      marker.on('dragend', () => { const point = marker.getLatLng(); onPick(point.lat, point.lng); });
    }
    onPick(lat, lng);
  };
  map.on('click', (event) => place(event.latlng.lat, event.latlng.lng));
  const show = async () => {
    map.invalidateSize();
    const res = await api('GET', '/users/me/native-places/boundaries');
    const primary = res.ok ? res.data.find((item) => item.slot === 'primary') || res.data[0] : null;
    if (!primary) {
      map.setView([20.5937, 78.9629], 5, { animate: false });
      return;
    }
    const layer = L.geoJSON(primary.boundary.feature, { style: BOUNDARY_STYLE, interactive: false }).addTo(map);
    map.fitBounds(layer.getBounds(), { animate: false });
  };
  const focus = (lat, lng) => { map.setView([lat, lng], PIN_ZOOM); place(lat, lng); };
  return { el: container, show, focus, map };
}

const ROUTE_COLORS = ['#1565c0', '#2e7d32', '#ef6c00', '#6a1b9a', '#00838f', '#ad1457'];

function drawRoute(layer, route, color) {
  const points = route.path && route.path.length ? route.path : [route.start, route.end];
  const latLngs = points.map((point) => [point.latitude, point.longitude]);
  L.polygon(route.coverage.map((point) => [point.latitude, point.longitude]), { color, weight: 1, fillColor: color, fillOpacity: 0.12, interactive: false }).addTo(layer);
  L.polyline(latLngs, { color, weight: 4, opacity: 0.9 }).bindTooltip(`${route.route_name} · ${route.promoter_name}`).addTo(layer);
  L.circleMarker(latLngs[0], { radius: 6, color, fillColor: '#fff', fillOpacity: 1 }).bindTooltip('Start').addTo(layer);
  L.circleMarker(latLngs[latLngs.length - 1], { radius: 6, color, fillColor: color, fillOpacity: 1 }).bindTooltip('End').addTo(layer);
}

function routeCoverage(map, onResult) {
  const layer = L.layerGroup().addTo(map);
  const status = h('div', { className: 'hint' });
  let latest = 0;
  const refresh = async (lat, lng) => {
    latest += 1;
    const ticket = latest;
    status.className = 'hint';
    status.textContent = 'Checking delivery routes for this spot…';
    const query = (option) => api('GET', withQuery('/delivery/eligible-routes/nearby', { option, latitude: lat, longitude: lng }));
    const [scheduled, instant] = await Promise.all([query('route'), query('instant')]);
    if (ticket !== latest) return;
    layer.clearLayers();
    const routes = scheduled.ok ? scheduled.data : [];
    const instantRoutes = instant.ok ? instant.data : [];
    if (onResult) onResult({ route: routes, instant: instantRoutes });
    const drawn = new Map();
    [...routes, ...instantRoutes].forEach((route) => {
      if (drawn.has(route.route_id)) return;
      drawn.set(route.route_id, ROUTE_COLORS[drawn.size % ROUTE_COLORS.length]);
      drawRoute(layer, route, drawn.get(route.route_id));
    });
    if (!drawn.size) {
      status.className = 'err';
      status.textContent = 'No delivery route covers this spot. Move the pin, or choose self-pickup when ordering.';
      return;
    }
    status.className = 'ok';
    status.replaceChildren(
      h('strong', { textContent: `Delivery is available here (${drawn.size} ${drawn.size === 1 ? 'route' : 'routes'}).` }),
      ...routes.map((route) => h('div', { className: 'meta', style: `border-left:4px solid ${drawn.get(route.route_id)};padding-left:6px;margin-top:4px`, textContent: `${route.route_name} · ${route.promoter_name} · fee ${route.fee} · next delivery ${route.delivery_date}` })),
      instantRoutes.length ? h('div', { className: 'meta', textContent: `Instant delivery also available now (from fee ${Math.min(...instantRoutes.map((route) => Number(route.fee)))}).` }) : '');
  };
  return { status, refresh };
}

function settingInput(field, value) {
  if (field.options) {
    const select = h('select', {}, field.options.map((option) => h('option', { value: option, textContent: option })));
    select.value = value;
    return { el: select, read: () => select.value };
  }
  if (field.text || field.number) {
    const input = h('input', { type: field.number ? 'number' : 'text', value: value ?? '' });
    return { el: input, read: () => (input.value === '' ? undefined : (field.number ? Number(input.value) : input.value)) };
  }
  const box = h('input', { type: 'checkbox', checked: Boolean(value) });
  return { el: box, read: () => box.checked };
}

  const upi = h('input', { type: 'text', placeholder: 'UPI ID (optional, e.g. name@upi)' });
  const current = h('div', { className: 'meta' });

      ? `Saved: ${account.account_holder_name} · ${account.account_number_masked || 'no bank account'} · ${account.ifsc || ''} · ${account.upi_id || 'no UPI'}`
      : 'No bank details yet. Payouts cannot be sent until you add them.';

function duesCard(path) {

      box.replaceChildren(h('div', { className: 'err', textContent: errorText(res) }));
      return;
    }
    const dues = res.data;
    const message = h('div', {});

      h('strong', { textContent: `COD dues owed to the platform: ${dues.total_owed} ${dues.currency}` }),
      h('div', { className: 'hint', textContent: 'Platform fee + commission on cash orders you collected. Unpaid dues are deducted from your next payout.' }),

      pending ? h('a', { href: pending.payment_url, target: '_blank', rel: 'noopener', textContent: `Open pending payment link (${pending.total_amount} ${pending.currency})` }) : '',

function businessEditCard(detail, reload, message) {
  const name = h('input', { type: 'text', value: detail.name, required: true });
  const parentId = detail.category && detail.category.parent ? detail.category.parent.id : '';
  const categoryId = detail.category ? detail.category.id : '';
  const mainCategory = h('select', {}, h('option', { value: '', textContent: 'Loading…' }));
  const category = h('select', { disabled: true }, h('option', { value: '', textContent: 'Loading…' }));
  const loadChildren = async (selected) => {
    category.disabled = true;
    if (!mainCategory.value) {
      fillSelect(category, 'Choose Product or Service first', []);
      return;
    }
    fillSelect(category, 'Loading…', []);
    const children = await loadAllOptions(`/businesses/categories?parent_id=${mainCategory.value}`);
    fillSelect(category, children.length ? 'Select category' : 'No categories yet - enable a plugin', children);
    category.value = selected || '';
    category.disabled = !children.length;
  };
  loadAllOptions('/businesses/categories').then((roots) => {
    fillSelect(mainCategory, 'Select Product or Service', roots);
    mainCategory.value = parentId;
    loadChildren(categoryId);
  });
  mainCategory.onchange = () => loadChildren('');
  const description = h('textarea', { value: detail.description || '' });
  const status = h('select', {}, ['active', 'inactive'].map((value) => h('option', { value, textContent: value, selected: value === detail.status })));
  const latitude = h('input', { type: 'number', step: 'any', placeholder: 'Latitude', value: detail.latitude ?? '' });
  const longitude = h('input', { type: 'number', step: 'any', placeholder: 'Longitude', value: detail.longitude ?? '' });
  const pin = pinMap((lat, lng) => {
    latitude.value = lat.toFixed(COORDINATE_DECIMALS);
    longitude.value = lng.toFixed(COORDINATE_DECIMALS);
  });
  const addressLine = h('input', { type: 'text', placeholder: 'Building, street, area', value: detail.address_line || '' });
  const landmark = h('input', { type: 'text', placeholder: 'Landmark (optional)', value: detail.landmark || '' });
  const pincode = h('input', { type: 'text', placeholder: '6-digit pincode', maxLength: 6, value: detail.pincode || '' });
  const error = h('div', { className: 'err' });
  const save = h('button', { className: 'primary', type: 'submit', textContent: 'Save changes' });
  const cancel = h('button', { type: 'button', textContent: 'Cancel', onclick: () => reload(false) });
  const changes = () => {
    const json = {};
    if (name.value.trim() !== detail.name) json.name = name.value.trim();
    if (category.value && category.value !== categoryId) json.category_id = category.value;
    if (description.value !== (detail.description || '')) json.description = description.value;
    if (status.value !== detail.status) json.status = status.value;
    if (addressLine.value.trim() && addressLine.value.trim() !== (detail.address_line || '')) json.address_line = addressLine.value.trim();
    if (landmark.value.trim() !== (detail.landmark || '')) json.landmark = landmark.value.trim() || null;
    if (pincode.value.trim() && pincode.value.trim() !== (detail.pincode || '')) json.pincode = pincode.value.trim();
    const lat = latitude.value === '' ? null : Number(latitude.value);
    const lng = longitude.value === '' ? null : Number(longitude.value);
    if (lat !== null && lng !== null && (lat !== detail.latitude || lng !== detail.longitude)) {
      json.latitude = lat;
      json.longitude = lng;
    }
    return json;
  };
  const el = h('form', { className: 'card stack' },
    h('strong', { textContent: 'Edit business' }),
    h('label', { textContent: 'Name *' }), name,
    h('label', { textContent: 'Type' }), mainCategory,
    h('label', { textContent: 'Category' }), category,
    h('label', { textContent: 'Description' }), description,
    h('label', { textContent: 'Status' }), status,
    h('label', { textContent: 'Location (click or drag the pin)' }), pin.el,
    h('div', { className: 'row' }, latitude, longitude),
    h('label', { textContent: 'Address' }), addressLine,
    h('label', { textContent: 'Landmark' }), landmark,
    h('label', { textContent: 'Pincode' }), pincode,
    h('div', { className: 'row' }, save, cancel),
    error,
    businessImagesEditor(detail, () => reload(true)));
  el.onsubmit = async (event) => {
    event.preventDefault();
    error.textContent = '';
    const json = changes();
    if (!Object.keys(json).length) {
      error.textContent = 'Nothing changed.';
      return;
    }
    save.disabled = true;
    const res = await api('PATCH', `/businesses/${detail.id}`, { json });
    save.disabled = false;
    if (!res.ok) {
      error.textContent = errorText(res);
      return;
    }
    message.className = 'ok';
    message.textContent = `Saved: ${Object.keys(json).join(', ')}`;
    reload(false);
  };
  setTimeout(async () => {
    await pin.show();
    if (detail.latitude != null && detail.longitude != null) pin.focus(detail.latitude, detail.longitude);
  });
  return el;
}

function businessImagesEditor(detail, reload) {
  const error = h('div', { className: 'err' });
  const file = h('input', { type: 'file', accept: 'image/*', multiple: true });
  const upload = h('button', {
    type: 'button',
    textContent: 'Upload images',
    onclick: async () => {
      error.textContent = '';
      if (!file.files.length) {
        error.textContent = 'Choose at least one image.';
        return;
      }
      upload.disabled = true;
      for (const chosen of [...file.files]) {
        const body = new FormData();
        body.append('file', chosen);
        const res = await api('POST', `/businesses/${detail.id}/images`, { form: body });
        if (!res.ok) {
          error.textContent = errorText(res);
          upload.disabled = false;
          return;
        }
      }
      reload();
    },
  });
  const thumbs = (detail.images || []).map((image) => h('div', { className: 'stack', style: 'display:inline-block;margin:4px' },
    h('img', { className: 'thumb', src: mediaUrl(image.image_url), alt: '' }),
    h('button', {
      type: 'button',
      textContent: 'Remove',
      onclick: async () => {
        error.textContent = '';
        const res = await api('DELETE', `/businesses/${detail.id}/images/${image.id}`);
        if (res.ok) reload();
        else error.textContent = errorText(res);
      },
    })));
  return h('div', { className: 'card' },
    h('strong', { textContent: `Images (${thumbs.length})` }),
    h('div', {}, thumbs.length ? thumbs : h('div', { className: 'meta', textContent: 'No images yet.' })),
    file, upload, error);
}

function businessViewCard(detail, reload, message) {

const PRODUCTS_PLUGIN_KEY = 'ecommerce';

async function businessPluginsScreen(business) {
  const content = h('div', {});
  const message = h('div', { className: 'err' });
  screenOf(backBar(`${business.name} · Plugins`, myBusinessesScreen), content, message);
  const load = async () => {
    const res = await api('GET', `/me/businesses/${business.id}/capabilities`);
    if (!res.ok) {
      content.replaceChildren(h('div', { className: 'err', textContent: errorText(res) }));
      return;
    }
    const { enabled_plugins: enabled, available_plugins: available, categories } = res.data;
    const packagesEnabled = enabled.some((plugin) => plugin.key === PACKAGES_PLUGIN_KEY);
    const packageConfigRes = packagesEnabled ? await api('GET', `${PACKAGES_BASE(business.id)}/package-category`) : null;
    const packageConfig = packageConfigRes && packageConfigRes.ok ? packageConfigRes.data : null;
    const change = async (method, key) => {
      message.textContent = '';
      const result = await api(method, `/me/businesses/${business.id}/plugins/${key}`);
      if (result.ok) load();
      else message.textContent = errorText(result);
    };
    const packageCategoryCard = () => {
      const chosen = packageConfig.category;
      const select = h('select', {}, h('option', { value: '', textContent: 'Choose a category' }),
        packageConfig.options.map((option) => h('option', { value: option.id, selected: option.id === chosen, textContent: option.label })));
      const hint = h('div', { className: 'hint' });
      const showHint = () => {
        const option = packageConfig.options.find((item) => item.id === select.value);
        hint.textContent = option ? option.description : 'Packages are available for Travel and Resorts businesses.';
      };
      select.onchange = showHint;
      showHint();
      const save = async () => {
        message.textContent = '';
        if (!select.value) { message.textContent = 'Choose Travel or Resorts first.'; return; }
        const result = await api('PUT', `${PACKAGES_BASE(business.id)}/package-category`, { json: { category: select.value } });
        if (result.ok) load();
        else message.textContent = packageErrorText(result);
      };
      const fixed = packageConfig.source === 'business_category';
      return h('div', { className: 'stack' },
        h('div', { className: 'meta', textContent: chosen ? `Packages category: ${packageCategoryLabel(chosen)}${fixed ? ' (from the business category)' : ''}` : 'Choose the Packages category for this business to start creating packages.' }),
        fixed ? '' : h('div', { className: 'stack' }, select, hint,
          h('button', { type: 'button', textContent: chosen ? 'Change category' : 'Save category', disabled: packageConfig.locked && Boolean(chosen), onclick: save }),
          packageConfig.locked && chosen ? h('div', { className: 'hint', textContent: 'The category cannot change while the business has packages.' }) : ''));
    };
    const enabledCard = (plugin) => h('div', { className: 'card stack' },
      h('strong', { textContent: `${plugin.name} · v${plugin.version}` }),
      plugin.key === PACKAGES_PLUGIN_KEY && packageConfig ? packageCategoryCard() : '',
      plugin.key === PRODUCTS_PLUGIN_KEY ? h('button', { className: 'primary', type: 'button', textContent: 'Manage products', onclick: () => businessProductsScreen(business) }) : '',
      plugin.key === PRODUCTS_PLUGIN_KEY ? h('button', { type: 'button', textContent: 'Tax settings', onclick: () => taxSettingsScreen(business) }) : '',
      plugin.key === PACKAGES_PLUGIN_KEY && packageConfig && packageConfig.category ? h('button', { className: 'primary', type: 'button', textContent: 'Manage packages', onclick: () => businessPackagesScreen({ ...business, packageCategory: packageConfig.category }) }) : '',
      plugin.key === PACKAGES_PLUGIN_KEY && packageConfig && packageConfig.category ? h('button', { className: 'primary', type: 'button', textContent: 'Bookings', onclick: () => businessBookingsScreen(business) }) : '',
      plugin.key === PACKAGES_PLUGIN_KEY && packageConfig && packageConfig.category ? h('button', { type: 'button', textContent: 'Booking history', onclick: () => businessBookingsScreen(business, null, BOOKING_HISTORY) }) : '',
      plugin.capabilities.filter((capability) => ![PRODUCTS_PLUGIN_KEY, PACKAGES_PLUGIN_KEY].includes(plugin.key)).map((capability) => h('div', { className: 'meta', textContent: `${capability.title} — ${capability.path}` })),
      h('button', { type: 'button', textContent: 'Disable', onclick: () => change('DELETE', plugin.key) }));
    const availableCard = (plugin) => h('div', { className: 'card stack' },
      h('strong', { textContent: `${plugin.name} · v${plugin.version}` }),
      plugin.description ? h('div', { className: 'meta', textContent: plugin.description }) : '',
      h('button', { className: 'primary', type: 'button', textContent: 'Enable', onclick: () => change('POST', plugin.key) }));
    content.replaceChildren(
      h('div', { className: 'meta', textContent: `Categories: ${categories.map((c) => c.name).join(', ') || '—'}` }),
      h('h3', { textContent: 'Enabled', style: 'margin:12px 0 0' }),
      ...(enabled.length ? enabled.map(enabledCard) : [h('div', { className: 'meta', textContent: 'Nothing enabled yet.' })]),
      h('h3', { textContent: 'Available for this business', style: 'margin:12px 0 0' }),
      ...(available.length ? available.map(availableCard) : [h('div', { className: 'meta', textContent: 'No more plugins available for this business category.' })]));
  };
  load();
}

    let categoryId = category.value;

      const created = await api('POST', `${PRODUCT_BASE(business.id)}/product-categories`, { json: { name: newCategory.value.trim() } });
      if (!created.ok) {
        button.disabled = false;
        error.textContent = errorText(created);
        return;
      }
      categoryId = created.data.id;
    }
    if (!categoryId) {
      button.disabled = false;
      error.textContent = 'Choose or add a category.';
      return;
    }
    const body = formOf({
      name: name.value,
      sku: sku.value,
      category_id: categoryId,
      tax_rate_id: taxRate.value,
      description: description.value,
      selling_price: sellingPrice.value,
      original_price: originalPrice.value,
      quantity: quantity.value,
      is_bulk_promotable: bulk.checked,
      is_individually_promotable: individual.checked,
    });
    [...images.files].forEach((file) => body.append('images', file));
    const res = await api('POST', `${PRODUCT_BASE(business.id)}/products`, { form: body });
    button.disabled = false;
    if (res.ok) onSaved();
    else error.textContent = errorText(res);
  };
  return el;
}

async function checkoutScreen(group) {
  await refreshMe();
  const me = session.me;
  const content = h('div', {});
  const isProductOrder = !group.deal_id;
  screenOf(backBar('Place order', group.onBack || cartScreen), content);
  const name = h('input', { type: 'text', value: `${me.first_name} ${me.last_name}` });
  const phone = h('input', { type: 'text', value: verifiedPhone(me) || me.phone || '', placeholder: 'Contact number' });
  const notes = h('textarea', { placeholder: 'Notes for the seller or delivery (optional)', maxLength: 500 });
  const addressSelect = h('select', {});
  const addressBox = h('div', {});
  const optionsBox = h('div', {});
  const routeSelect = h('select', {}, h('option', { value: '', textContent: 'Any available promoter' }));
  const routeCaption = h('div', { className: 'meta' });
  const routeBox = h('div', { hidden: true }, h('label', { textContent: 'Delivery route' }), routeSelect, routeCaption);
  let paymentChoice = PAYMENT_METHODS.find((method) => method.id === DEFAULT_PAYMENT_METHOD);
  const paymentHint = h('div', { className: 'hint', textContent: 'You pay right after placing the order; the order is created once the payment succeeds.', hidden: true });
  const paymentBox = h('div', {}, ...PAYMENT_METHODS.map((method) => h('label', { style: 'display:block;margin:4px 0' },
    h('input', {
      type: 'radio',
      name: 'payment-method',
      checked: method.id === DEFAULT_PAYMENT_METHOD,
      onchange: () => {
        paymentChoice = method;
        paymentHint.hidden = method.api !== 'online';
        drawSummary();
      },
    }),
    ` ${method.label}`)), paymentHint);
  const summary = h('div', { className: 'card stack' });
  const error = h('div', { className: 'err' });
  const noPreview = () => ({ route: [], instant: [] });
  const state = { addresses: [], options: [], option: null, routes: [], nearMisses: [], previewRoutes: noPreview() };
  const subtotal = Number(group.subtotal);
  const taxTotal = Number(group.tax_total || 0);
  const orderCount = group.order_count || 1;

  const deliveryFee = () => {
    if (!state.option || state.option === 'self_pickup') return 0;
    if (!isProductOrder) {
      const chosen = state.options.find((option) => option.option === state.option);
      return chosen ? Number(chosen.fee) : 0;
    }
    const picked = state.routes.find((route) => route.route_id === routeSelect.value);
    const pool = picked ? [picked] : state.routes;
    return pool.length ? Math.min(...pool.map((route) => Number(route.fee))) : 0;
  };

  const drawSummary = () => {
    const fee = deliveryFee() * orderCount;
    summary.replaceChildren(
      h('div', { className: 'row' }, h('span', { textContent: 'Items' }), h('span', { textContent: subtotal.toFixed(2) })),
      h('div', { className: 'row' }, h('span', { textContent: 'Tax' }), h('span', { textContent: taxTotal.toFixed(2) })),
      h('div', { className: 'row' }, h('span', { textContent: orderCount > 1 ? `Delivery (${orderCount} orders)` : 'Delivery' }), h('span', { textContent: fee.toFixed(2) })),
      h('div', { className: 'row', style: 'font-weight:700' }, h('span', { textContent: 'Total' }), h('span', { textContent: (subtotal + taxTotal + fee).toFixed(2) })),
      h('div', { className: 'meta', textContent: `Payment: ${paymentChoice.label}` }));
  };

  const routeLabel = (route) => `${route.route_name} · ${route.promoter_name} · fee ${route.fee} · ${route.delivery_date}`;

  const drawRouteOptions = () => {
    const needsRoute = state.option === 'route' || state.option === 'instant';
    const chosen = routeSelect.value;
    const preview = (state.previewRoutes[state.option] || []).filter((route) => !state.routes.some((entry) => entry.route_id === route.route_id));
    routeBox.hidden = !needsRoute || (!addressSelect.value && !preview.length);
    routeSelect.replaceChildren(
      h('option', { value: '', textContent: state.option === 'route' ? 'Choose a route' : 'Any available promoter' }),
      ...state.routes.map((route) => h('option', { value: route.route_id, textContent: routeLabel(route) })),
      ...state.nearMisses.map((route) => h('option', { value: '', disabled: true, textContent: `${route.route_name} · ${route.promoter_name} — ${route.meters_outside} m outside its delivery area` })),
      ...preview.map((route) => h('option', { value: '', disabled: true, textContent: `${routeLabel(route)} — save the address to choose` })));
    routeSelect.value = state.routes.some((route) => route.route_id === chosen) ? chosen : '';
    const selected = addressSelect.selectedOptions[0];
    routeCaption.textContent = selected && addressSelect.value ? `Routes that can deliver to: ${selected.textContent}` : '';
  };

  const loadRoutes = async () => {
    const needsRoute = state.option === 'route' || state.option === 'instant';
    state.routes = [];
    state.nearMisses = [];
    if (!needsRoute || !addressSelect.value) { drawRouteOptions(); drawSummary(); return; }
    const [res, misses] = await Promise.all([
      api('GET', withQuery('/delivery/eligible-routes', { option: state.option, address_id: addressSelect.value, deal_id: group.deal_id })),
      api('GET', withQuery('/delivery/eligible-routes/near-misses', { option: state.option, address_id: addressSelect.value })),
    ]);
    state.routes = res.ok ? res.data : [];
    state.nearMisses = misses.ok ? misses.data.filter((miss) => !state.routes.some((route) => route.route_id === miss.route_id)) : [];
    drawRouteOptions();
    drawSummary();
  };

  routeSelect.onchange = drawSummary;

  const drawOptions = () => {
    const hasPromoterDelivery = isProductOrder || state.options.some((option) => option.option !== 'self_pickup');
    optionsBox.replaceChildren(...(hasPromoterDelivery ? [] : [h('div', { className: 'hint', textContent: "Delivery by a promoter is not offered for this deal yet. The deal's promoter needs to save delivery settings (fees and working days)." })]), ...state.options.map((option) => h('label', { style: 'display:block;margin:4px 0' },
      h('input', {
        type: 'radio',
        name: 'delivery-option',
        disabled: !option.available,
        checked: option.option === state.option,
        onchange: () => { state.option = option.option; drawSummary(); loadRoutes(); },
      }),
      ` ${DELIVERY_OPTION_LABELS[option.option] || option.option} — ${option.option === 'self_pickup' ? 'free' : option.fee ?? 'fee depends on the route'}${option.available ? '' : ' (not available now)'}`)));
  };

  const loadAddresses = async (selectId) => {
    const res = await api('GET', '/users/me/addresses');
    state.addresses = res.ok ? res.data : [];
    addressSelect.replaceChildren(...state.addresses.map((address) => h('option', { value: address.id, textContent: `${address.label} — ${address.address_line}, ${address.place.village_name}` })));
    const preferred = selectId || (state.addresses.find((address) => address.is_default) || state.addresses[0] || {}).id;
    if (preferred) addressSelect.value = preferred;
    loadRoutes();
  };

  const newAddress = h('button', {
    type: 'button',
    textContent: '+ Add new address',
    onclick: () => {
      const form = addressForm(
        (saved) => { state.previewRoutes = noPreview(); addressBox.replaceChildren(); loadAddresses(saved.id); },
        (found) => { state.previewRoutes = found; drawRouteOptions(); },
      );
      addressBox.replaceChildren(form.el);
      form.show();
    },
  });
  addressSelect.onchange = loadRoutes;

  const place = h('button', { className: 'primary', type: 'button', textContent: group.bulk ? 'Confirm order' : 'Place order' });
  place.onclick = async () => {
    error.textContent = '';
    if (!state.option) {
      error.textContent = 'Choose a delivery option.';
      return;
    }
    place.disabled = true;
    const orderPath = group.bulk ? '/me/cart/products/checkout' : '/me/cart/checkout';
    const orderLines = group.bulk ? {} : { deal_id: group.deal_id };
    const res = await api('POST', orderPath, {
      json: {
        ...orderLines,
        customer_name: name.value,
        customer_phone: phone.value || null,
        delivery_option: state.option,
        payment_method: paymentChoice.api,
        address_id: state.option === 'self_pickup' ? null : addressSelect.value || null,
        route_id: routeSelect.value || null,
        notes: notes.value || null,
      },
    });
    place.disabled = false;
    if (res.ok) {
      if (group.bulk) bulkOrdersPlacedScreen(res.data, group.businesses);
      else orderPlacedScreen(res.data, group);
    } else error.textContent = errorText(res);
  };

  content.append(
    ...(group.bulk ? group.businesses.map(orderBusinessCard) : [h('div', { className: 'card' }, h('strong', { textContent: group.deal_name }),
      group.items.map((item) => h('div', { className: 'meta', textContent: `${item.name} × ${item.quantity} = ${item.line_total}` })))]),
    h('label', { textContent: 'Your name' }), name,
    h('label', { textContent: 'Contact number' }), phone,
    h('label', { textContent: 'Delivery address' }), addressSelect, newAddress, addressBox,
    h('label', { textContent: 'Delivery option' }), optionsBox, routeBox,
    h('label', { textContent: 'Payment method' }), paymentBox,
    h('label', { textContent: 'Delivery instructions (optional)' }), notes,
    summary, place, error);
  drawSummary();
  if (isProductOrder) {
    state.options = [
      { option: 'instant', fee: null, available: true },
      { option: 'route', fee: null, available: true },
      { option: 'self_pickup', fee: 0, available: true },
    ];
  } else {
    const options = await api('GET', `/deals/${group.deal_id}/delivery-options`);
    state.options = options.ok ? options.data : [];
  }
  state.option = (state.options.find((option) => option.available) || {}).option || null;
  drawOptions();
  drawSummary();
  await loadAddresses();
}

function placedPaymentBlock(order, redraw) {
  if (order.payment_method !== 'online') return '';
  const message = h('div', { className: 'err' });
  const reload = async () => {
    const res = await api('GET', `/me/orders/${order.id}`);
    if (!res.ok) {
      message.textContent = errorText(res);
      return;
    }
    Object.assign(order, res.data);
    redraw();
  };
  return h('div', { className: 'stack' },
    awaitingOnlinePayment(order)
      ? h('div', { className: 'hint', textContent: 'Your order is created once the payment succeeds. Pay within 30 minutes; your cart keeps the items until then.' })
      : '',
    onlinePaymentFailed(order)
      ? h('div', { className: 'stack' },
        h('div', { className: 'err', textContent: 'Payment not completed — the order was not created. Your items are still in the cart.' }),
        h('button', { type: 'button', textContent: 'Back to cart', onclick: cartScreen }))
      : orderPaymentBlock(order, { customer: true, reload, message }),
    message);
}

function placedHeader(orders, successTitle, successText) {
  const awaiting = orders.some(awaitingOnlinePayment);
  const failed = !awaiting && orders.some(onlinePaymentFailed);
  const title = awaiting ? 'Complete your payment' : failed ? 'Payment not completed' : successTitle;
  const text = awaiting
    ? 'Your order is created once the payment succeeds. Pay within 30 minutes; your cart keeps the items until then.'
    : failed ? 'The order was not created. Your items are still in the cart.' : successText;
  return h('div', { className: 'card stack', style: 'text-align:center' },
    h('div', { style: 'font-size:40px', textContent: awaiting ? '💳' : failed ? '⚠️' : '✅' }),
    h('h2', { textContent: title, style: 'margin:0' }),
    h('div', { className: 'meta', textContent: text }));
}

async function orderDeliveryScreen(order, onBack = () => homeScreen('activity')) {
  const info = h('div', { className: 'card stack' });
  const container = h('div', { style: `height:${MAP_HEIGHT_PX}px;margin:8px 0` });
  screenOf(backBar(`Delivery · ${order.order_number}`, () => onBack()), info, container);
  const res = await api('GET', `/me/orders/${order.id}/delivery`);
  if (!res.ok) {
    info.append(h('div', { className: 'err', textContent: errorText(res) }));
    return;
  }
  const delivery = res.data;
  info.append(
    h('strong', { textContent: `Status: ${delivery.status}` }),
    h('div', { className: 'meta', textContent: `${DELIVERY_OPTION_LABELS[delivery.option] || delivery.option} · ${delivery.delivery_date} · fee ${delivery.fee}` }),
    delivery.promoter_name ? h('div', { className: 'meta', textContent: `Promoter: ${delivery.promoter_name}${delivery.route_name ? ` · ${delivery.route_name}` : ''}` }) : h('div', { className: 'meta', textContent: delivery.open_for_claim ? `Offered to the other promoters in your area. Any of them can accept until ${formatDate(delivery.expires_at)}` : `Waiting for your deal's promoter. They can answer until ${formatDate(delivery.expires_at)}` }),
    delivery.shipping_address ? h('div', { className: 'meta', textContent: delivery.shipping_address }) : '');
  if (delivery.handover_otp) {
    info.append(h('div', { className: 'card' },
      h('strong', { textContent: `Handover OTP: ${delivery.handover_otp}` }),
      h('div', { className: 'hint', textContent: `Your order is out for delivery. Read this code to the delivery person only when you have your parcel. Valid until ${formatDate(delivery.handover_otp_expires_at)}.` })));
  }
  if (delivery.status === 'delivered') {
    info.append(h('div', { className: 'card' },
      h('strong', { textContent: `Delivered ${formatDate(delivery.delivered_at)}` }),
      delivery.proof_available ? privateImage(`/me/orders/${order.id}/delivery/proof`) : ''));
  }
  if (!delivery.destination) return;
  const toLatLng = (point) => [point.latitude, point.longitude];
  const map = newMap(container);
  const bounds = [toLatLng(delivery.destination)];
  L.marker(toLatLng(delivery.destination)).addTo(map).bindTooltip('Your location', { permanent: true });
  if (delivery.route_start && delivery.route_end) {
    L.circleMarker(toLatLng(delivery.route_start), ROUTE_END_STYLE).addTo(map).bindTooltip('Route start', { permanent: true, direction: 'top' });
    L.circleMarker(toLatLng(delivery.route_end), ROUTE_END_STYLE).addTo(map).bindTooltip('Route end', { permanent: true, direction: 'top' });
    bounds.push(toLatLng(delivery.route_start), toLatLng(delivery.route_end));
  }
  const riderStatus = h('div', { className: 'meta' });
  info.append(riderStatus);
  let riderMarker = null;
  const placeRider = (point, updatedAt) => {
    const latLng = toLatLng(point);
    if (riderMarker) riderMarker.setLatLng(latLng);
    else riderMarker = L.marker(latLng, { icon: RIDER_ICON, zIndexOffset: RIDER_Z_INDEX }).addTo(map).bindTooltip('Delivery team', { permanent: true, direction: 'bottom' });
    riderStatus.textContent = `Delivery team location updated ${formatDate(updatedAt)}`;
  };
  if (delivery.rider_location) {
    placeRider(delivery.rider_location.location, delivery.rider_location.updated_at);
    bounds.push(toLatLng(delivery.rider_location.location));
  } else {
    riderStatus.textContent = delivery.status === 'accepted' ? 'Waiting for the delivery team to start sharing their location.' : '';
  }
  if (bounds.length > 1) map.fitBounds(bounds, { padding: [40, 40], maxZoom: PIN_ZOOM });
  else map.setView(bounds[0], PIN_ZOOM);
  realtime.onEvent = (event) => {
    if (event.type !== DELIVERY_LOCATION_EVENT || event.data.order_id !== order.id) return;
    placeRider({ latitude: event.data.latitude, longitude: event.data.longitude }, event.data.updated_at);
  };
}

const DEFAULT_COVERAGE_RADIUS_M = 3000;

const COORDINATE_DECIMALS = 6;
const MAP_HEIGHT_PX = 340;
const MAP_DEFAULT_ZOOM = 14;
const MAP_MAX_ZOOM = 19;
const OSM_TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const OSM_ATTRIBUTION = '&copy; OpenStreetMap contributors';
const BOUNDARY_STYLE = { color: '#d32f2f', weight: 3, fillOpacity: 0 };
const ROUTE_SELECTED_STYLE = { color: '#1565c0', weight: 7, opacity: 0.9 };
const ROUTE_OTHER_STYLE = { color: '#1565c0', weight: 4, opacity: 0.35 };
const OSRM_URL = 'https://router.project-osrm.org';
const MAX_ROUTE_OPTIONS = 3;
const MAX_SAVED_PATH_POINTS = 1500;
const ROUTE_LOOKUP_DELAY_MS = 500;

function coordinatePair(label, onChange) {
  const latitude = h('input', { type: 'number', step: 'any', placeholder: 'Latitude', required: true });
  const longitude = h('input', { type: 'number', step: 'any', placeholder: 'Longitude', required: true });
  const message = h('span', { className: 'err' });
  const read = () => ({ latitude: Number(latitude.value), longitude: Number(longitude.value) });
  const hasValue = () => latitude.value !== '' && longitude.value !== '';
  const set = (lat, lng) => {
    latitude.value = Number(lat).toFixed(COORDINATE_DECIMALS);
    longitude.value = Number(lng).toFixed(COORDINATE_DECIMALS);
    message.textContent = '';
    onChange();
  };
  latitude.oninput = onChange;
  longitude.oninput = onChange;
  const locate = h('button', {
    type: 'button',
    textContent: 'Use my current location',
    onclick: () => navigator.geolocation.getCurrentPosition(
      (position) => set(position.coords.latitude, position.coords.longitude),
      () => { message.textContent = 'Could not read your location. Pick on the map or type the coordinates.'; },
    ),
  });
  const el = h('div', {}, h('label', { textContent: label }), h('div', { className: 'row' }, latitude, longitude), locate, message);
  return { el, read, set, hasValue };
}

const NOMINATIM_URL = 'https://nominatim.openstreetmap.org';
const LABEL_LOOKUP_DELAY_MS = 900;
const END_LABEL_EXTRA_DELAY_MS = 1200;
const ROUTE_LABEL_MAX_LENGTH = 150;
const PLACE_NAME_KEYS = ['amenity', 'road', 'neighbourhood', 'suburb', 'village', 'town', 'city_district'];
const PLACE_AREA_KEYS = ['suburb', 'village', 'town', 'city', 'county'];

function shortPlaceName(address) {
  if (!address) return '';
  const first = PLACE_NAME_KEYS.map((key) => address[key]).find(Boolean) || '';
  const area = PLACE_AREA_KEYS.map((key) => address[key]).find((value) => value && value !== first) || '';
  return [first, area].filter(Boolean).join(', ').slice(0, ROUTE_LABEL_MAX_LENGTH);
}

function routePointText(label, point) {
  return `${label ? `${label} · ` : ''}${point.latitude}, ${point.longitude}`;
}

function placeLabelInput(pair, title, extraDelayMs) {
  const input = h('input', { type: 'text', maxLength: ROUTE_LABEL_MAX_LENGTH, placeholder: 'Place name (filled from the map, you can edit it)' });
  const hint = h('div', { className: 'hint' });
  let edited = false;
  let lastKey = '';
  let timer = null;
  let latest = 0;
  input.oninput = () => { edited = input.value.trim() !== ''; };
  const lookup = async () => {
    if (edited || !pair.hasValue()) return;
    const { latitude, longitude } = pair.read();
    const key = `${latitude},${longitude}`;
    if (key === lastKey) return;
    lastKey = key;
    const mine = ++latest;
    hint.textContent = 'Looking up the place name…';
    try {
      const response = await fetch(`${NOMINATIM_URL}/reverse?format=jsonv2&addressdetails=1&zoom=18&lat=${latitude}&lon=${longitude}`);
      const data = await response.json();
      if (mine !== latest || edited) return;
      input.value = shortPlaceName(data.address);
      hint.textContent = input.value ? 'Filled from OpenStreetMap. Edit it if you like.' : 'No place name found here. Type one.';
    } catch (error) {
      if (mine === latest) hint.textContent = 'Could not look up the place name. Type one.';
    }
  };
  const schedule = () => {
    clearTimeout(timer);
    timer = setTimeout(lookup, LABEL_LOOKUP_DELAY_MS + extraDelayMs);
  };
  return { el: h('div', {}, h('label', { textContent: title }), input, hint), schedule, value: () => input.value.trim() || null };
}

function routeMap(start, end, radiusInput) {
  const container = h('div', { style: `height:${MAP_HEIGHT_PX}px;margin:8px 0` });
  const map = L.map(container, { attributionControl: false }).setView([0, 0], 2);
  L.control.attribution({ prefix: false }).addTo(map);
  L.tileLayer(OSM_TILE_URL, { maxZoom: MAP_MAX_ZOOM, attribution: OSM_ATTRIBUTION }).addTo(map);
  const pairs = { start, end };
  const markers = {};
  const coverage = L.circle([0, 0], { radius: 0, color: '#1565c0', weight: 1 });
  let scheduleRoutes = () => {};
  let lastPoints = '';
  const sync = () => {
    Object.entries(pairs).forEach(([key, pair]) => {
      if (!pair.hasValue()) return;
      const { latitude, longitude } = pair.read();
      if (markers[key]) markers[key].setLatLng([latitude, longitude]);
      else {
        markers[key] = L.marker([latitude, longitude], { draggable: true, title: key }).addTo(map).bindTooltip(key, { permanent: true });
        markers[key].on('dragend', () => place(key, markers[key].getLatLng()));
      }
    });
    if (start.hasValue()) {
      const { latitude, longitude } = start.read();
      coverage.setLatLng([latitude, longitude]).setRadius(Number(radiusInput.value) || 0);
      if (!map.hasLayer(coverage)) coverage.addTo(map);
    }
    const points = `${start.hasValue() ? JSON.stringify(start.read()) : ''}${end.hasValue() ? JSON.stringify(end.read()) : ''}`;
    if (points !== lastPoints) {
      lastPoints = points;
      scheduleRoutes();
    }
  };
  const mode = { target: 'start' };
  const radios = ['start', 'end'].map((key) => {
    const input = h('input', { type: 'radio', name: 'route-pick', checked: key === 'start', onchange: () => { mode.target = key; } });
    return h('label', { style: 'margin-right:12px' }, input, ` Pick ${key} point`);
  });
  const snapToRoad = async (latlng) => {
    try {
      const response = await fetch(`${OSRM_URL}/nearest/v1/driving/${latlng.lng},${latlng.lat}?number=1`);
      const data = await response.json();
      const [lng, lat] = data.waypoints[0].location;
      return { lat, lng };
    } catch (error) {
      return latlng;
    }
  };
  const place = async (key, latlng) => {
    const snapped = await snapToRoad(latlng);
    pairs[key].set(snapped.lat, snapped.lng);
  };
  map.on('click', (event) => place(mode.target, event.latlng));
  radiusInput.addEventListener('input', sync);
  const status = h('div', { className: 'hint', textContent: 'Pick a start and an end point on the road.' });
  const options = h('div', { className: 'row wrap' });
  const el = h('div', {}, h('div', { className: 'row wrap' }, radios), status, container, options);
  let alternatives = [];
  let chosen = 0;
  const paths = L.layerGroup().addTo(map);
  const drawAlternatives = () => {
    paths.clearLayers();
    options.replaceChildren();
    alternatives.forEach((alternative, index) => {
      const selected = index === chosen;
      const line = L.polyline(alternative.latlngs, selected ? ROUTE_SELECTED_STYLE : ROUTE_OTHER_STYLE).addTo(paths);
      line.on('click', () => { chosen = index; drawAlternatives(); });
      if (selected) line.bringToFront();
      options.append(h('button', {
        type: 'button',
        className: selected ? 'primary' : '',
        textContent: `Route ${index + 1} · ${(alternative.distance / 1000).toFixed(1)} km · ${Math.round(alternative.duration / 60)} min`,
        onclick: () => { chosen = index; drawAlternatives(); },
      }));
    });
  };
  let requestId = 0;
  const loadAlternatives = async () => {
    requestId += 1;
    const current = requestId;
    if (!start.hasValue() || !end.hasValue()) return;
    const from = start.read();
    const to = end.read();
    const url = `${OSRM_URL}/route/v1/driving/${from.longitude},${from.latitude};${to.longitude},${to.latitude}?alternatives=${MAX_ROUTE_OPTIONS}&overview=full&geometries=geojson`;
    status.textContent = 'Finding routes…';
    try {
      const data = await (await fetch(url)).json();
      if (current !== requestId) return;
      if (data.code !== 'Ok') throw new Error(data.code);
      alternatives = data.routes.slice(0, MAX_ROUTE_OPTIONS).map((route) => ({
        distance: route.distance,
        duration: route.duration,
        latlngs: route.geometry.coordinates.map(([lng, lat]) => [lat, lng]),
      }));
      chosen = 0;
      drawAlternatives();
      map.fitBounds(L.latLngBounds(alternatives.flatMap((alternative) => alternative.latlngs)));
      status.textContent = `${alternatives.length} route option${alternatives.length === 1 ? '' : 's'} found. Click a route or a button to choose.`;
    } catch (error) {
      if (current !== requestId) return;
      alternatives = [];
      drawAlternatives();
      status.textContent = 'No road route found between these points.';
    }
  };
  let routeTimer = null;
  scheduleRoutes = () => {
    clearTimeout(routeTimer);
    routeTimer = setTimeout(loadAlternatives, ROUTE_LOOKUP_DELAY_MS);
  };
  const show = async () => {
    map.invalidateSize();
    const res = await api('GET', '/users/me/native-places/boundaries');
    const primary = res.ok ? res.data.find((item) => item.slot === 'primary') || res.data[0] : null;
    if (!primary) {
      map.setView([20.5937, 78.9629], 5);
      status.textContent = 'No native village boundary found.';
      return;
    }
    const layer = L.geoJSON(primary.boundary.feature, { style: BOUNDARY_STYLE }).addTo(map);
    map.fitBounds(layer.getBounds());
  };
  const chosenPath = () => {
    const latlngs = alternatives[chosen]?.latlngs;
    if (!latlngs) return null;
    const step = Math.ceil(latlngs.length / MAX_SAVED_PATH_POINTS);
    const kept = latlngs.filter((_, index) => index % step === 0 || index === latlngs.length - 1);
    return kept.map(([latitude, longitude]) => ({ latitude, longitude }));
  };
  return { el, sync, show, chosenPath };
}

function routePreviewScreen(route, onBack = myRoutesScreen, deliveryDate = '') {
  const container = h('div', { style: `height:${MAP_HEIGHT_PX}px;margin:8px 0` });
  const status = h('div', { className: 'hint', textContent: 'Loading road path…' });
  const dateInput = h('input', { type: 'date', value: deliveryDate || todayIso() });
  const stopsBox = h('div', {});
  screenOf(
    backBar(`Preview · ${route.name}`, () => onBack()),
    h('div', { className: 'meta', textContent: `${route.village.name} · radius ${route.coverage_radius_m} m · ${route.is_active ? 'active' : 'inactive'}` }),
    status,
    h('div', { className: 'row' }, h('label', { textContent: 'Delivery stops on' }), dateInput),
    container,
    stopsBox);
  const start = [route.start_point.latitude, route.start_point.longitude];
  const end = [route.end_point.latitude, route.end_point.longitude];
  const map = newMap(container);
  const coverage = L.circle(start, { radius: route.coverage_radius_m, color: '#1565c0', weight: 1 }).addTo(map);
  L.marker(start).addTo(map).bindTooltip(route.start_label || 'start', { permanent: true });
  L.marker(end).addTo(map).bindTooltip(route.end_label || 'end', { permanent: true });
  const coverageBounds = L.latLng(start).toBounds(route.coverage_radius_m * 2);
  map.fitBounds(coverageBounds.extend(end));
  api('GET', `/native-places/${route.village.id}/boundary`).then((res) => {
    if (res.ok) L.geoJSON(res.data.feature, { style: BOUNDARY_STYLE, interactive: false }).addTo(map).bringToBack();
  });
  const stopLayer = L.layerGroup().addTo(map);
  const loadStops = async () => {
    stopLayer.clearLayers();
    stopsBox.replaceChildren();
    const res = await api('GET', `/me/delivery-routes/${route.id}/stops?delivery_date=${dateInput.value}`);
    if (!res.ok) {
      stopsBox.append(h('div', { className: 'err', textContent: errorText(res) }));
      return;
    }
    if (!res.data.length) stopsBox.append(h('div', { className: 'hint', textContent: 'No accepted deliveries on this day.' }));
    res.data.forEach((stop, index) => {
      if (stop.destination) {
        const pending = stop.request_status === 'requested';
        L.circleMarker([stop.destination.latitude, stop.destination.longitude], pending ? PENDING_STOP_STYLE : STOP_STYLE).addTo(stopLayer)
          .bindTooltip(`${index + 1}. ${stop.customer_name}${pending ? ' (waiting for your answer)' : ''}`, { permanent: true, direction: 'top' });
      }
      stopsBox.append(h('div', { className: 'card' },
        h('strong', { textContent: `${index + 1}. ${stop.order_number} · ${stop.customer_name}` }),
        h('div', { className: 'meta', textContent: `${stop.request_status === 'requested' ? 'Waiting for your answer' : 'Accepted'} · order ${stop.order_status}${stop.customer_phone ? ` · ${stop.customer_phone}` : ''}` }),
        stop.shipping_address ? h('div', { className: 'meta', textContent: stop.shipping_address }) : ''));
    });
  };
  dateInput.onchange = loadStops;
  loadStops();
  if (route.path) {
    const line = L.polyline(route.path.map((point) => [point.latitude, point.longitude]), ROUTE_SELECTED_STYLE).addTo(map);
    map.fitBounds(line.getBounds().extend(coverageBounds));
    status.textContent = `Saved road path (${route.path.length} points). Red pins are accepted stops, orange pins are waiting for your answer.`;
    return;
  }
  const url = `${OSRM_URL}/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`;
  fetch(url).then((response) => response.json()).then((data) => {
    if (data.code !== 'Ok') throw new Error(data.code);
    const line = L.polyline(data.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]), ROUTE_SELECTED_STYLE).addTo(map);
    map.fitBounds(line.getBounds().extend(coverageBounds));
    status.textContent = `${(data.routes[0].distance / 1000).toFixed(1)} km · ${Math.round(data.routes[0].duration / 60)} min by road (no road path saved, so this is the fastest road). Red pins are accepted stops, orange pins are waiting for your answer.`;
  }).catch(() => { status.textContent = 'Could not load the road path. Showing start, end, coverage and stops.'; });
}

async function routeCreateScreen() {
  const name = h('input', { type: 'text', placeholder: 'e.g. Morning Kazhakkoottam run', required: true });
  const radius = h('input', { type: 'number', min: 100, max: 20000, value: DEFAULT_COVERAGE_RADIUS_M, required: true });
  const vehicle = h('select', {}, h('option', { value: '', textContent: 'No vehicle' }));
  const courier = h('select', {}, h('option', { value: '', textContent: 'No courier' }));
  let map = null;
  const labels = {};
  const syncMap = () => {
    map?.sync();
    labels.start?.schedule();
    labels.end?.schedule();
  };
  const start = coordinatePair('Start point *', syncMap);
  const end = coordinatePair('End point *', syncMap);
  map = routeMap(start, end, radius);
  labels.start = placeLabelInput(start, 'Start label (place name, optional)', 0);
  labels.end = placeLabelInput(end, 'End label (place name, optional)', END_LABEL_EXTRA_DELAY_MS);
  const error = h('div', { className: 'err' });
  const button = h('button', { className: 'primary', type: 'submit', textContent: 'Create route' });
  const el = h('form', {},
    h('div', {}, h('label', { textContent: 'Route name *' }), name),
    h('div', { className: 'hint', textContent: 'Click the map to place the point selected below, or drag a marker. Your native village boundary is outlined in red.' }),
    map.el,
    start.el,
    labels.start.el,
    end.el,
    labels.end.el,
    h('div', {}, h('label', { textContent: 'Coverage radius in metres * (100–20000)' }), radius),
    h('div', {}, h('label', { textContent: 'Courier from my team (optional)' }), courier),
    h('div', {}, h('label', { textContent: 'Vehicle from my team (optional, the courier\'s own)' }), vehicle),
    button,
    error);
  el.onsubmit = async (event) => {
    event.preventDefault();
    error.textContent = '';
    button.disabled = true;
    const res = await api('POST', '/me/delivery-routes', {
      json: {
        name: name.value,
        start_point: start.read(),
        end_point: end.read(),
        start_label: labels.start.value(),
        end_label: labels.end.value(),
        path: map.chosenPath(),
        coverage_radius_m: Number(radius.value),
        vehicle_id: vehicle.value || null,
        courier_id: courier.value || null,
      },
    });
    button.disabled = false;
    if (!res.ok) {
      error.textContent = errorText(res);
      return;
    }
    myRoutesScreen();
  };
  screenOf(backBar('Create route', myRoutesScreen), el);
  map.show();
  const vehicles = await api('GET', '/delivery-team/vehicles');
  const teamVehicles = vehicles.ok ? vehicles.data : [];
  fillVehicleSelect(vehicle, teamVehicles, '', null);
  courier.onchange = () => fillVehicleSelect(vehicle, teamVehicles, courier.value, null);
  const team = await api('GET', '/delivery-team');
  if (team.ok) team.data.forEach((member) => courier.append(h('option', { value: member.id, textContent: `${member.first_name} ${member.last_name}` })));
}

function showCourierMap(container, route, stops, openStops) {
  const map = newMap(container);
  const bounds = L.latLngBounds([]);
  if (route) {
    const start = [route.start_point.latitude, route.start_point.longitude];
    const end = [route.end_point.latitude, route.end_point.longitude];
    L.circle(start, { radius: route.coverage_radius_m, color: '#1565c0', weight: 1 }).addTo(map);
    bounds.extend(L.latLng(start).toBounds(route.coverage_radius_m * 2));
    const path = route.path ? route.path.map((point) => [point.latitude, point.longitude]) : [start, end];
    const line = L.polyline(path, ROUTE_SELECTED_STYLE).addTo(map);
    bounds.extend(line.getBounds());
    L.circleMarker(start, ROUTE_END_STYLE).addTo(map).bindTooltip(route.start_label || 'Start', { permanent: true, direction: 'top' });
    L.circleMarker(end, ROUTE_END_STYLE).addTo(map).bindTooltip(route.end_label || 'End', { permanent: true, direction: 'bottom' });
  }
  stops.forEach((stop) => {
    const latLng = [stop.destination.latitude, stop.destination.longitude];
    L.circleMarker(latLng, STOP_STYLE).addTo(map).bindTooltip(`${stop.order_number} · ${stop.customer_name}`, { permanent: openStops, direction: openStops ? 'right' : 'top' });
    bounds.extend(latLng);
  });
  map.invalidateSize();
  if (bounds.isValid()) map.fitBounds(bounds);
  else map.setView([0, 0], 2);
}
