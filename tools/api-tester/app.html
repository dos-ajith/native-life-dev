function timeLabel(value) {
  const [hours, minutes] = value.split(':').map(Number);
  const meridiem = hours >= 12 ? 'PM' : 'AM';
  return `${hours % 12 || 12}:${String(minutes).padStart(2, '0')} ${meridiem}`;
}

function expectedDeliveryText(order) {
  if (!order.expected_delivery_date) return order.delivery_option === 'self_pickup' ? 'Pick up from the seller' : 'To be confirmed';
  const date = new Date(`${order.expected_delivery_date}T00:00:00`);
  const sameDay = date.toDateString() === new Date().toDateString();
  const day = sameDay ? 'Today' : date.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
  const window = order.expected_delivery_from && order.expected_delivery_to ? `, ${timeLabel(order.expected_delivery_from)} – ${timeLabel(order.expected_delivery_to)}` : '';
  return `${day}${window}`;
}

function pinMap(onPick) {
  const container = h('div', { style: `height:${MAP_HEIGHT_PX}px;margin:8px 0` });
  const map = newMap(container).setView([0, 0], 2);
  let marker = null;
  const place = (lat, lng) => {
    if (marker) marker.setLatLng([lat, lng]);
    else {
      marker = L.marker([lat, lng], { draggable: true }).addTo(map);
      marker.on('dragend', () => { const point = marker.getLatLng(); onPick(point.lat, point.lng); });
    }
    onPick(lat, lng);
  };
  map.on('click', (event) => place(event.latlng.lat, event.latlng.lng));
  const show = async () => {
    map.invalidateSize();
    const res = await api('GET', '/users/me/native-places/boundaries');
    const primary = res.ok ? res.data.find((item) => item.slot === 'primary') || res.data[0] : null;
    if (!primary) {
      map.setView([20.5937, 78.9629], 5);
      return;
    }
    const layer = L.geoJSON(primary.boundary.feature, { style: BOUNDARY_STYLE, interactive: false }).addTo(map);
    map.fitBounds(layer.getBounds());
  };
  const focus = (lat, lng) => { map.setView([lat, lng], PIN_ZOOM); place(lat, lng); };
  return { el: container, show, focus };
}

function settingInput(field, value) {
  if (field.options) {
    const select = h('select', {}, field.options.map((option) => h('option', { value: option, textContent: option })));
    select.value = value;
    return { el: select, read: () => select.value };
  }
  if (field.text || field.number) {
    const input = h('input', { type: field.number ? 'number' : 'text', value: value ?? '' });
    return { el: input, read: () => (input.value === '' ? undefined : (field.number ? Number(input.value) : input.value)) };
  }
  const box = h('input', { type: 'checkbox', checked: Boolean(value) });
  return { el: box, read: () => box.checked };
}

async function checkoutScreen(group) {
  await refreshMe();
  const me = session.me;
  const content = h('div', {});
  const isProductOrder = !group.deal_id;
  screenOf(backBar('Place order', group.onBack || cartScreen), content);
  const name = h('input', { type: 'text', value: `${me.first_name} ${me.last_name}` });
  const phone = h('input', { type: 'text', value: verifiedPhone(me) || me.phone || '', placeholder: 'Contact number' });
  const notes = h('textarea', { placeholder: 'Notes for the seller or delivery (optional)', maxLength: 500 });
  const addressSelect = h('select', {});
  const addressBox = h('div', {});
  const optionsBox = h('div', {});
  const routeSelect = h('select', {}, h('option', { value: '', textContent: 'Any available promoter' }));
  const routeBox = h('div', { hidden: true }, h('label', { textContent: 'Delivery route' }), routeSelect);
  const paymentBox = h('div', {}, PAYMENT_METHODS.map((method) => h('label', { style: 'display:block;margin:4px 0' },
    h('input', { type: 'radio', name: 'payment-method', disabled: !method.available, checked: method.id === DEFAULT_PAYMENT_METHOD }),
    ` ${method.label}${method.available ? '' : ' — coming soon'}`)));
  const summary = h('div', { className: 'card stack' });
  const error = h('div', { className: 'err' });
  const state = { addresses: [], options: [], option: null, routes: [] };
  const subtotal = Number(group.subtotal);

  const deliveryFee = () => {
    if (!state.option || state.option === 'self_pickup') return 0;
    if (!isProductOrder) {
      const chosen = state.options.find((option) => option.option === state.option);
      return chosen ? Number(chosen.fee) : 0;
    }
    const picked = state.routes.find((route) => route.route_id === routeSelect.value);
    const pool = picked ? [picked] : state.routes;
    return pool.length ? Math.min(...pool.map((route) => Number(route.fee))) : 0;
  };

  const drawSummary = () => {
    const fee = deliveryFee();
    summary.replaceChildren(
      h('div', { className: 'row' }, h('span', { textContent: 'Items' }), h('span', { textContent: subtotal.toFixed(2) })),
      h('div', { className: 'row' }, h('span', { textContent: 'Delivery' }), h('span', { textContent: fee.toFixed(2) })),
      h('div', { className: 'row', style: 'font-weight:700' }, h('span', { textContent: 'Total' }), h('span', { textContent: (subtotal + fee).toFixed(2) })),
      h('div', { className: 'meta', textContent: `Payment: ${paymentLabel(DEFAULT_PAYMENT_METHOD)}` }));
  };

  const loadRoutes = async () => {
    const needsRoute = state.option === 'route' || state.option === 'instant';
    routeBox.hidden = !needsRoute || !addressSelect.value;
    routeSelect.replaceChildren(h('option', { value: '', textContent: state.option === 'route' ? 'Choose a route' : 'Any available promoter' }));
    state.routes = [];
    if (!needsRoute || !addressSelect.value) { drawSummary(); return; }
    const res = await api('GET', withQuery('/delivery/eligible-routes', { option: state.option, address_id: addressSelect.value, deal_id: group.deal_id }));
    state.routes = res.ok ? res.data : [];
    drawSummary();
    if (res.ok) res.data.forEach((route) => routeSelect.append(h('option', { value: route.route_id, textContent: `${route.route_name} · ${route.promoter_name} · fee ${route.fee} · ${route.delivery_date}` })));
  };

  routeSelect.onchange = drawSummary;

  const drawOptions = () => {
    const hasPromoterDelivery = isProductOrder || state.options.some((option) => option.option !== 'self_pickup');
    optionsBox.replaceChildren(...(hasPromoterDelivery ? [] : [h('div', { className: 'hint', textContent: "Delivery by a promoter is not offered for this deal yet. The deal's promoter needs to save delivery settings (fees and working days)." })]), ...state.options.map((option) => h('label', { style: 'display:block;margin:4px 0' },
      h('input', {
        type: 'radio',
        name: 'delivery-option',
        disabled: !option.available,
        checked: option.option === state.option,
        onchange: () => { state.option = option.option; drawSummary(); loadRoutes(); },
      }),
      ` ${DELIVERY_OPTION_LABELS[option.option] || option.option} — ${option.option === 'self_pickup' ? 'free' : option.fee ?? 'fee depends on the route'}${option.available ? '' : ' (not available now)'}`)));
  };

  const loadAddresses = async (selectId) => {
    const res = await api('GET', '/users/me/addresses');
    state.addresses = res.ok ? res.data : [];
    addressSelect.replaceChildren(...state.addresses.map((address) => h('option', { value: address.id, textContent: `${address.label} — ${address.address_line}, ${address.place.village_name}` })));
    const preferred = selectId || (state.addresses.find((address) => address.is_default) || state.addresses[0] || {}).id;
    if (preferred) addressSelect.value = preferred;
    loadRoutes();
  };

  const newAddress = h('button', {
    type: 'button',
    textContent: '+ Add new address',
    onclick: () => {
      const form = addressForm((saved) => { addressBox.replaceChildren(); loadAddresses(saved.id); });
      addressBox.replaceChildren(form.el);
      form.show();
    },
  });
  addressSelect.onchange = loadRoutes;

  const place = h('button', { className: 'primary', type: 'button', textContent: 'Place order' });
  place.onclick = async () => {
    error.textContent = '';
    if (!state.option) {
      error.textContent = 'Choose a delivery option.';
      return;
    }
    place.disabled = true;
    const orderPath = isProductOrder ? `/businesses/${group.business_id}/orders` : '/me/cart/checkout';
    const res = await api('POST', orderPath, {
      json: {
        ...(isProductOrder ? { items: group.items.map((item) => ({ product_id: item.product_id, quantity: item.quantity })) } : { deal_id: group.deal_id }),
        customer_name: name.value,
        customer_phone: phone.value || null,
        delivery_option: state.option,
        payment_method: DEFAULT_PAYMENT_METHOD,
        address_id: state.option === 'self_pickup' ? null : addressSelect.value || null,
        route_id: routeSelect.value || null,
        notes: notes.value || null,
      },
    });
    place.disabled = false;
    if (res.ok) orderPlacedScreen(res.data, group);
    else error.textContent = errorText(res);
  };

  content.append(
    h('div', { className: 'card' }, h('strong', { textContent: group.deal_name }),
      group.items.map((item) => h('div', { className: 'meta', textContent: `${item.name} × ${item.quantity} = ${item.line_total}` }))),
    h('label', { textContent: 'Your name' }), name,
    h('label', { textContent: 'Contact number' }), phone,
    h('label', { textContent: 'Delivery address' }), addressSelect, newAddress, addressBox,
    h('label', { textContent: 'Delivery option' }), optionsBox, routeBox,
    h('label', { textContent: 'Payment method' }), paymentBox,
    h('label', { textContent: 'Delivery instructions (optional)' }), notes,
    summary, place, error);
  drawSummary();
  if (isProductOrder) {
    state.options = [
      { option: 'instant', fee: null, available: true },
      { option: 'route', fee: null, available: true },
      { option: 'self_pickup', fee: 0, available: true },
    ];
  } else {
    const options = await api('GET', `/deals/${group.deal_id}/delivery-options`);
    state.options = options.ok ? options.data : [];
  }
  state.option = (state.options.find((option) => option.available) || {}).option || null;
  drawOptions();
  drawSummary();
  await loadAddresses();
}

async function orderDeliveryScreen(order, onBack = () => homeScreen('activity')) {
  const info = h('div', { className: 'card stack' });
  const container = h('div', { style: `height:${MAP_HEIGHT_PX}px;margin:8px 0` });
  screenOf(backBar(`Delivery · ${order.order_number}`, () => onBack()), info, container);
  const res = await api('GET', `/me/orders/${order.id}/delivery`);
  if (!res.ok) {
    info.append(h('div', { className: 'err', textContent: errorText(res) }));
    return;
  }
  const delivery = res.data;
  info.append(
    h('strong', { textContent: `Status: ${delivery.status}` }),
    h('div', { className: 'meta', textContent: `${DELIVERY_OPTION_LABELS[delivery.option] || delivery.option} · ${delivery.delivery_date} · fee ${delivery.fee}` }),
    delivery.promoter_name ? h('div', { className: 'meta', textContent: `Promoter: ${delivery.promoter_name}${delivery.route_name ? ` · ${delivery.route_name}` : ''}` }) : h('div', { className: 'meta', textContent: delivery.open_for_claim ? `Offered to the other promoters in your area. Any of them can accept until ${formatDate(delivery.expires_at)}` : `Waiting for your deal's promoter. They can answer until ${formatDate(delivery.expires_at)}` }),

const DEFAULT_COVERAGE_RADIUS_M = 3000;

const COORDINATE_DECIMALS = 6;
const MAP_HEIGHT_PX = 340;
const MAP_DEFAULT_ZOOM = 14;
const MAP_MAX_ZOOM = 19;
const OSM_TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const OSM_ATTRIBUTION = '&copy; OpenStreetMap contributors';
const BOUNDARY_STYLE = { color: '#d32f2f', weight: 3, fillOpacity: 0 };
const ROUTE_SELECTED_STYLE = { color: '#1565c0', weight: 7, opacity: 0.9 };
const ROUTE_OTHER_STYLE = { color: '#1565c0', weight: 4, opacity: 0.35 };
const OSRM_URL = 'https://router.project-osrm.org';
const MAX_ROUTE_OPTIONS = 3;
const MAX_SAVED_PATH_POINTS = 1500;
const ROUTE_LOOKUP_DELAY_MS = 500;

function coordinatePair(label, onChange) {
  const latitude = h('input', { type: 'number', step: 'any', placeholder: 'Latitude', required: true });
  const longitude = h('input', { type: 'number', step: 'any', placeholder: 'Longitude', required: true });
  const message = h('span', { className: 'err' });
  const read = () => ({ latitude: Number(latitude.value), longitude: Number(longitude.value) });
  const hasValue = () => latitude.value !== '' && longitude.value !== '';
  const set = (lat, lng) => {
    latitude.value = Number(lat).toFixed(COORDINATE_DECIMALS);
    longitude.value = Number(lng).toFixed(COORDINATE_DECIMALS);
    message.textContent = '';
    onChange();
  };
  latitude.oninput = onChange;
  longitude.oninput = onChange;
  const locate = h('button', {
    type: 'button',
    textContent: 'Use my current location',
    onclick: () => navigator.geolocation.getCurrentPosition(
      (position) => set(position.coords.latitude, position.coords.longitude),
      () => { message.textContent = 'Could not read your location. Pick on the map or type the coordinates.'; },
    ),
  });
  const el = h('div', {}, h('label', { textContent: label }), h('div', { className: 'row' }, latitude, longitude), locate, message);
  return { el, read, set, hasValue };
}

function routeMap(start, end, radiusInput) {
  const container = h('div', { style: `height:${MAP_HEIGHT_PX}px;margin:8px 0` });
  const map = L.map(container, { attributionControl: false }).setView([0, 0], 2);
  L.control.attribution({ prefix: false }).addTo(map);
  L.tileLayer(OSM_TILE_URL, { maxZoom: MAP_MAX_ZOOM, attribution: OSM_ATTRIBUTION }).addTo(map);
  const pairs = { start, end };
  const markers = {};
  const coverage = L.circle([0, 0], { radius: 0, color: '#1565c0', weight: 1 });
  let scheduleRoutes = () => {};
  let lastPoints = '';
  const sync = () => {
    Object.entries(pairs).forEach(([key, pair]) => {
      if (!pair.hasValue()) return;
      const { latitude, longitude } = pair.read();
      if (markers[key]) markers[key].setLatLng([latitude, longitude]);
      else {
        markers[key] = L.marker([latitude, longitude], { draggable: true, title: key }).addTo(map).bindTooltip(key, { permanent: true });
        markers[key].on('dragend', () => place(key, markers[key].getLatLng()));
      }
    });
    if (start.hasValue()) {
      const { latitude, longitude } = start.read();
      coverage.setLatLng([latitude, longitude]).setRadius(Number(radiusInput.value) || 0);
      if (!map.hasLayer(coverage)) coverage.addTo(map);
    }
    const points = `${start.hasValue() ? JSON.stringify(start.read()) : ''}${end.hasValue() ? JSON.stringify(end.read()) : ''}`;
    if (points !== lastPoints) {
      lastPoints = points;
      scheduleRoutes();
    }
  };
  const mode = { target: 'start' };
  const radios = ['start', 'end'].map((key) => {
    const input = h('input', { type: 'radio', name: 'route-pick', checked: key === 'start', onchange: () => { mode.target = key; } });
    return h('label', { style: 'margin-right:12px' }, input, ` Pick ${key} point`);
  });
  const snapToRoad = async (latlng) => {
    try {
      const response = await fetch(`${OSRM_URL}/nearest/v1/driving/${latlng.lng},${latlng.lat}?number=1`);
      const data = await response.json();
      const [lng, lat] = data.waypoints[0].location;
      return { lat, lng };
    } catch (error) {
      return latlng;
    }
  };
  const place = async (key, latlng) => {
    const snapped = await snapToRoad(latlng);
    pairs[key].set(snapped.lat, snapped.lng);
  };
  map.on('click', (event) => place(mode.target, event.latlng));
  radiusInput.addEventListener('input', sync);
  const status = h('div', { className: 'hint', textContent: 'Pick a start and an end point on the road.' });
  const options = h('div', { className: 'row wrap' });
  const el = h('div', {}, h('div', { className: 'row wrap' }, radios), status, container, options);
  let alternatives = [];
  let chosen = 0;
  const paths = L.layerGroup().addTo(map);
  const drawAlternatives = () => {
    paths.clearLayers();
    options.replaceChildren();
    alternatives.forEach((alternative, index) => {
      const selected = index === chosen;
      const line = L.polyline(alternative.latlngs, selected ? ROUTE_SELECTED_STYLE : ROUTE_OTHER_STYLE).addTo(paths);
      line.on('click', () => { chosen = index; drawAlternatives(); });
      if (selected) line.bringToFront();
      options.append(h('button', {
        type: 'button',
        className: selected ? 'primary' : '',
        textContent: `Route ${index + 1} · ${(alternative.distance / 1000).toFixed(1)} km · ${Math.round(alternative.duration / 60)} min`,
        onclick: () => { chosen = index; drawAlternatives(); },
      }));
    });
  };
  let requestId = 0;
  const loadAlternatives = async () => {
    requestId += 1;
    const current = requestId;
    if (!start.hasValue() || !end.hasValue()) return;
    const from = start.read();
    const to = end.read();
    const url = `${OSRM_URL}/route/v1/driving/${from.longitude},${from.latitude};${to.longitude},${to.latitude}?alternatives=${MAX_ROUTE_OPTIONS}&overview=full&geometries=geojson`;
    status.textContent = 'Finding routes…';
    try {
      const data = await (await fetch(url)).json();
      if (current !== requestId) return;
      if (data.code !== 'Ok') throw new Error(data.code);
      alternatives = data.routes.slice(0, MAX_ROUTE_OPTIONS).map((route) => ({
        distance: route.distance,
        duration: route.duration,
        latlngs: route.geometry.coordinates.map(([lng, lat]) => [lat, lng]),
      }));
      chosen = 0;
      drawAlternatives();
      map.fitBounds(L.latLngBounds(alternatives.flatMap((alternative) => alternative.latlngs)));
      status.textContent = `${alternatives.length} route option${alternatives.length === 1 ? '' : 's'} found. Click a route or a button to choose.`;
    } catch (error) {
      if (current !== requestId) return;
      alternatives = [];
      drawAlternatives();
      status.textContent = 'No road route found between these points.';
    }
  };
  let routeTimer = null;
  scheduleRoutes = () => {
    clearTimeout(routeTimer);
    routeTimer = setTimeout(loadAlternatives, ROUTE_LOOKUP_DELAY_MS);
  };
  const show = async () => {
    map.invalidateSize();
    const res = await api('GET', '/users/me/native-places/boundaries');
    const primary = res.ok ? res.data.find((item) => item.slot === 'primary') || res.data[0] : null;
    if (!primary) {
      map.setView([20.5937, 78.9629], 5);
      status.textContent = 'No native village boundary found.';
      return;
    }
    const layer = L.geoJSON(primary.boundary.feature, { style: BOUNDARY_STYLE }).addTo(map);
    map.fitBounds(layer.getBounds());
  };
  const chosenPath = () => {
    const latlngs = alternatives[chosen]?.latlngs;
    if (!latlngs) return null;
    const step = Math.ceil(latlngs.length / MAX_SAVED_PATH_POINTS);
    const kept = latlngs.filter((_, index) => index % step === 0 || index === latlngs.length - 1);
    return kept.map(([latitude, longitude]) => ({ latitude, longitude }));
  };
  return { el, sync, show, chosenPath };
}

function routePreviewScreen(route, onBack = myRoutesScreen, deliveryDate = '') {
  const container = h('div', { style: `height:${MAP_HEIGHT_PX}px;margin:8px 0` });
  const status = h('div', { className: 'hint', textContent: 'Loading road path…' });
  const dateInput = h('input', { type: 'date', value: deliveryDate || todayIso() });
  const stopsBox = h('div', {});
  screenOf(
    backBar(`Preview · ${route.name}`, () => onBack()),
    h('div', { className: 'meta', textContent: `${route.village.name} · radius ${route.coverage_radius_m} m · ${route.is_active ? 'active' : 'inactive'}` }),
    status,
    h('div', { className: 'row' }, h('label', { textContent: 'Delivery stops on' }), dateInput),
    container,
    stopsBox);
  const start = [route.start_point.latitude, route.start_point.longitude];
  const end = [route.end_point.latitude, route.end_point.longitude];
  const map = newMap(container);
  const coverage = L.circle(start, { radius: route.coverage_radius_m, color: '#1565c0', weight: 1 }).addTo(map);
  L.marker(start).addTo(map).bindTooltip('start', { permanent: true });
  L.marker(end).addTo(map).bindTooltip('end', { permanent: true });
  const coverageBounds = L.latLng(start).toBounds(route.coverage_radius_m * 2);
  map.fitBounds(coverageBounds.extend(end));
  api('GET', `/native-places/${route.village.id}/boundary`).then((res) => {
    if (res.ok) L.geoJSON(res.data.feature, { style: BOUNDARY_STYLE, interactive: false }).addTo(map).bringToBack();
  });
  const stopLayer = L.layerGroup().addTo(map);
  const loadStops = async () => {
    stopLayer.clearLayers();
    stopsBox.replaceChildren();
    const res = await api('GET', `/me/delivery-routes/${route.id}/stops?delivery_date=${dateInput.value}`);
    if (!res.ok) {
      stopsBox.append(h('div', { className: 'err', textContent: errorText(res) }));
      return;
    }
    if (!res.data.length) stopsBox.append(h('div', { className: 'hint', textContent: 'No accepted deliveries on this day.' }));
    res.data.forEach((stop, index) => {
      if (stop.destination) {
        const pending = stop.request_status === 'requested';
        L.circleMarker([stop.destination.latitude, stop.destination.longitude], pending ? PENDING_STOP_STYLE : STOP_STYLE).addTo(stopLayer)
          .bindTooltip(`${index + 1}. ${stop.customer_name}${pending ? ' (waiting for your answer)' : ''}`, { permanent: true, direction: 'top' });
      }
      stopsBox.append(h('div', { className: 'card' },
        h('strong', { textContent: `${index + 1}. ${stop.order_number} · ${stop.customer_name}` }),
        h('div', { className: 'meta', textContent: `${stop.request_status === 'requested' ? 'Waiting for your answer' : 'Accepted'} · order ${stop.order_status}${stop.customer_phone ? ` · ${stop.customer_phone}` : ''}` }),
        stop.shipping_address ? h('div', { className: 'meta', textContent: stop.shipping_address }) : ''));
    });
  };
  dateInput.onchange = loadStops;
  loadStops();
  if (route.path) {
    const line = L.polyline(route.path.map((point) => [point.latitude, point.longitude]), ROUTE_SELECTED_STYLE).addTo(map);
    map.fitBounds(line.getBounds().extend(coverageBounds));
    status.textContent = `Saved road path (${route.path.length} points). Red pins are accepted stops, orange pins are waiting for your answer.`;
    return;
  }
  const url = `${OSRM_URL}/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`;
  fetch(url).then((response) => response.json()).then((data) => {
    if (data.code !== 'Ok') throw new Error(data.code);
    const line = L.polyline(data.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]), ROUTE_SELECTED_STYLE).addTo(map);
    map.fitBounds(line.getBounds().extend(coverageBounds));
    status.textContent = `${(data.routes[0].distance / 1000).toFixed(1)} km · ${Math.round(data.routes[0].duration / 60)} min by road (no road path saved, so this is the fastest road). Red pins are accepted stops, orange pins are waiting for your answer.`;
  }).catch(() => { status.textContent = 'Could not load the road path. Showing start, end, coverage and stops.'; });
}

async function routeCreateScreen() {
  const name = h('input', { type: 'text', placeholder: 'e.g. Morning Kazhakkoottam run', required: true });
  const radius = h('input', { type: 'number', min: 100, max: 20000, value: DEFAULT_COVERAGE_RADIUS_M, required: true });
  const vehicle = h('select', {}, h('option', { value: '', textContent: 'No vehicle' }));
  let map = null;
  const syncMap = () => map?.sync();
  const start = coordinatePair('Start point *', syncMap);
  const end = coordinatePair('End point *', syncMap);
  map = routeMap(start, end, radius);
  const error = h('div', { className: 'err' });
  const button = h('button', { className: 'primary', type: 'submit', textContent: 'Create route' });
  const el = h('form', {},
    h('div', {}, h('label', { textContent: 'Route name *' }), name),
    h('div', { className: 'hint', textContent: 'Click the map to place the point selected below, or drag a marker. Your native village boundary is outlined in red.' }),
    map.el,
    start.el,
    end.el,
    h('div', {}, h('label', { textContent: 'Coverage radius in metres * (100–20000)' }), radius),
    h('div', {}, h('label', { textContent: 'Vehicle (optional)' }), vehicle),
    button,
    error);
  el.onsubmit = async (event) => {
    event.preventDefault();
    error.textContent = '';
    button.disabled = true;
    const res = await api('POST', '/me/delivery-routes', {
      json: {
        name: name.value,
        start_point: start.read(),
        end_point: end.read(),
        path: map.chosenPath(),
        coverage_radius_m: Number(radius.value),
        vehicle_id: vehicle.value || null,
      },
    });
    button.disabled = false;
    if (!res.ok) {
      error.textContent = errorText(res);
      return;
    }
    myRoutesScreen();
  };
  screenOf(backBar('Create route', myRoutesScreen), el);
  map.show();
  const vehicles = await api('GET', '/me/delivery-vehicles');
  if (vehicles.ok) vehicles.data.filter((item) => item.is_active).forEach((item) => vehicle.append(h('option', { value: item.id, textContent: `${item.name} (${item.vehicle_type})` })));
}

  return '';
}

function dealCard(deal) {
  const card = h('div', {});
  const draw = (current) => {
    const message = h('div', { className: 'ok' });
    const items = current.items.map((item) => {
      const picker = quantityPicker(item);
      return h('div', { className: 'stack', style: 'margin-top:6px' },
        h('div', { textContent: `${item.name}${item.unit ? ` (${item.unit})` : ''} — ${item.deal_price ?? ''}${item.original_price ? ` (was ${item.original_price})` : ''}` }),
        h('div', { className: 'row wrap' }, picker.el,
          h('button', {
            className: 'fit',
            type: 'button',
            textContent: item.remaining_quantity === 0 ? 'Sold out' : 'Add to cart',
            disabled: item.remaining_quantity === 0,
            onclick: async () => {
              const quantity = picker.read();
              const res = await api('POST', '/me/cart/items', { json: { deal_item_id: item.id, quantity } });
              message.className = res.ok ? 'ok' : 'err';
              if (!res.ok) {
                message.textContent = errorText(res);
                return;
              }
              message.replaceChildren(
                h('div', { textContent: `${quantity} × ${item.name} added to cart.` }),
                h('button', { className: 'primary', type: 'button', textContent: 'Go to cart', onclick: cartScreen }));
            },
          })));
    });
    const refresh = async (request) => {
      const res = await request();
      if (!res.ok) {
        message.className = 'err';
        message.textContent = errorText(res);
        return;
      }
      const fresh = await api('GET', `/deals/${current.id}`);
      if (fresh.ok) draw(fresh.data);
    };
    const joinButton = current.is_mine
      ? ''
      : h('button', {
        type: 'button',
        textContent: current.has_joined ? 'Leave deal' : 'Join deal',
        onclick: () => refresh(() => api(current.has_joined ? 'DELETE' : 'POST', `/deals/${current.id}/join`)),
      });
    card.replaceChildren(h('div', { className: 'card' },
      current.thumbnail_url ? privateImage(current.thumbnail_url) : '',
      h('strong', { textContent: current.name }),
      h('div', { className: 'meta', textContent: `${current.category ? current.category.name : ''} · by ${current.business ? current.business.name : current.creator.name}` }),
      h('div', { className: 'meta', textContent: `${current.joined_count}${current.min_joiners ? ` / ${current.min_joiners}` : ''} joined${current.valid_until ? ` · until ${formatDate(current.valid_until)}` : ''}` }),
      current.description ? h('div', { textContent: current.description }) : '',
      current.pickup_location ? h('div', { className: 'meta', textContent: `Pickup: ${current.pickup_location}` }) : '',
      items,
      h('div', { className: 'row wrap', style: 'margin-top:8px' }, joinButton),
      message));
  };
  draw(deal);
  return card;
}

function chipRow(chips, onSelect) {
  const row = h('div', { className: 'row wrap', style: 'margin:8px 0' });
  const select = (id) => {
    [...row.children].forEach((button) => button.classList.toggle('active', button.dataset.id === String(id ?? '')));
    onSelect(id);
  };
  chips.forEach((chip) => {
    const button = h('button', { type: 'button', className: 'chip-btn', textContent: chip.label, onclick: () => select(chip.id) });
    button.dataset.id = String(chip.id ?? '');
    row.append(button);
  });
  return { row, select };
}

function withQuery(path, params) {
  const query = Object.entries(params).filter(([, v]) => v != null && v !== '').map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&');
  return query ? `${path}${path.includes('?') ? '&' : '?'}${query}` : path;
}

async function childCategoryChips(rootName, allLabel) {
  const roots = await api('GET', '/businesses/categories?page=1&page_size=100');
  const root = roots.ok ? listOf(roots.data).find((c) => c.name.toLowerCase() === rootName) : null;
  if (!root) return { root: null, chips: [{ id: null, label: allLabel }] };
  const children = await api('GET', `/businesses/categories?parent_id=${root.id}&page=1&page_size=100`);
  const chips = [{ id: root.id, label: allLabel }, ...(children.ok ? listOf(children.data) : []).map((c) => ({ id: c.id, label: c.name }))];
  return { root, chips };
}

function phoneChangeScreen(step = 'number', phone = '') {
  const back = () => homeScreen('profile');
  if (step === 'number') {
    const input = field('New phone number (+91…)', 'text', phone);
    const current = session.me.phone ? `Current: ${session.me.phone} (${session.me.phone_verified_at ? 'verified' : 'not verified'})` : 'No phone number on this account yet.';
    screenOf(
      backBar('Change phone number', back),
      h('div', { className: 'hint', textContent: `${current} A code is sent to the new number and it is saved only after you verify it.` }),
      form(
        [input],
        'Send code',
        async () => {
          const res = await api('POST', '/auth/phone/link/request-otp', { json: { phone: input.input.value } });
          if (!res.ok) return errorText(res);
          phoneChangeScreen('otp', input.input.value);
          return '';
        },
      ),
    );
    return;
  }
  const otp = field('Code');
  screenOf(
    backBar('Verify new number', () => phoneChangeScreen('number', phone)),
    h('div', { className: 'hint', textContent: `Enter the code sent to ${phone}. With SMS_PROVIDER=console, read it from the API log.` }),
    form(
      [otp],
      'Verify and change',
      async () => {
        const res = await api('POST', '/auth/phone/link/verify-otp', { json: { phone, otp: otp.input.value } });
        if (!res.ok) return errorText(res);
        session.me = { ...session.me, ...res.data };
        back();
        return '';
      },
    ),
  );
}

function currentPosition() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (position) => resolve({ latitude: position.coords.latitude, longitude: position.coords.longitude }),
      () => resolve(null),
      { timeout: 5000 },
    );
  });
}

function isAdmin(user) {
  return user.roles.some((role) => ADMIN_ROLE_SLUGS.includes(role.slug));
}

function permissionChecker(user) {
  const isSuper = user.roles.some((role) => role.slug === SUPER_ADMIN_SLUG);
  const granted = new Set(user.roles.flatMap((role) => role.permissions.map((p) => p.name)));
  return (needed) => isSuper || needed.some((name) => granted.has(name));
}

function adminRequest(action, item, note) {
  const path = action.path(item);
  if (action.body === 'note' && action.encoding === 'form') return api(action.method, path, { form: formOf({ [action.field]: note }) });
  if (action.body === 'note') return api(action.method, path, { json: { [action.field]: note } });
  if (action.body === 'form') return api(action.method, path, { form: new FormData() });
  return api(action.method, path);
}

async function fetchBlob(path) {
  const headers = store.access ? { Authorization: `Bearer ${store.access}` } : {};
  try {
    const res = await fetch(store.base + path, { headers });
    logCall('GET', path, res.status, res.ok ? '(file)' : await res.text());
    return res.ok ? await res.blob() : null;
  } catch (error) {
    logCall('GET', path, 0, error.message);
    return null;
  }
}

async function downloadFile(path, filename) {
  const blob = await fetchBlob(path);
  if (!blob) return false;
  const url = URL.createObjectURL(blob);
  if (filename) {
    const link = h('a', { href: url, download: filename });
    link.click();
  } else {
    window.open(url, '_blank');
  }
  return true;
}

function adminCard(entry, item, can, reload) {
  const title = entry.title ? entry.title(item) : item.name || item.title || item.key || item.slug || item.id;
  const subtitle = entry.subtitle ? entry.subtitle(item) : item.description || '';
  const message = h('div', { className: 'err' });
  const actions = h('div', { className: 'row wrap', style: 'margin-top:8px' });
  const noteBox = h('div', { className: 'stack' });
  const send = async (action, note) => {
    message.textContent = '';
    const res = await adminRequest(action, item, note);
    if (!res.ok) {
      message.textContent = errorText(res);
      return;
    }
    reload();
  };
  (entry.actions || []).filter((a) => can(a.perm) && (!a.when || a.when(item))).forEach((action) => {
    actions.append(h('button', {
      type: 'button',
      textContent: action.label,
      onclick: () => {
        if (action.form) {
          adminFormScreen(entry, can, action.form, item);
          return;
        }
        if (action.documents) {
          adminDocumentsScreen(entry, can, item);
          return;
        }
        if (action.body === 'note') {
          const input = h('textarea', { placeholder: 'Reason / note (required)' });
          const confirmButton = h('button', { type: 'button', textContent: `Confirm ${action.label}`, onclick: () => send(action, input.value) });
          noteBox.replaceChildren(input, confirmButton);
          return;
        }
        if (action.confirm && !window.confirm(`${action.label} "${title}"?`)) return;
        send(action);
      },
    }));
  });
  return h('div', { className: 'card' },
    h('strong', { textContent: title }),
    subtitle ? h('div', { className: 'meta', textContent: subtitle }) : '',
    h('details', {}, h('summary', { textContent: 'Raw' }), h('pre', { textContent: JSON.stringify(item, null, 2) })),
    actions, noteBox, message);
}

async function loadAllOptions(path) {
  const options = [];
  let page = 1;
  let pages = 1;
  while (page <= pages) {
    const res = await api('GET', `${path}${path.includes('?') ? '&' : '?'}page=${page}&page_size=${CHECKLIST_PAGE_SIZE}`);
    if (!res.ok) break;
    options.push(...listOf(res.data));
    pages = (res.data && res.data.pages) || 1;
    page += 1;
  }
  return options;
}

function villagePicker(field, given) {
  const chosen = h('input', { type: 'text', value: given ?? '', placeholder: 'Village ID (search below to fill)' });
  const search = h('input', { type: 'text', placeholder: 'Search village name' });
  const results = h('div', {});
  let timer = null;
  search.oninput = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const query = search.value.trim();
      if (!query) {
        results.replaceChildren();
        return;
      }
      const res = await api('GET', `/native-places/search?q=${encodeURIComponent(query)}&limit=${VILLAGE_SEARCH_LIMIT}`);
      if (!res.ok) return;
      results.replaceChildren(...res.data.places.map((place) => h('button', {
        className: 'option',
        type: 'button',
        textContent: `${place.village_name}, ${place.taluk_name}, ${place.district_name}`,
        onclick: () => { chosen.value = place.village_id; results.replaceChildren(); },
      })));
    }, SEARCH_DEBOUNCE_MS);
  };
  return { el: h('div', {}, h('label', { textContent: field.label }), chosen, search, results), read: () => chosen.value.trim() };
}

function fieldInput(field, item) {
  const given = item ? (field.initial ? field.initial(item) : item[field.name]) : undefined;
  const label = h('label', { textContent: field.label });
  if (field.type === 'checklist') {
    const selected = new Set(given || []);
    const list = h('div', { className: 'checklist' }, 'Loading…');
    const boxes = [];
    loadAllOptions(field.optionsPath).then((options) => {
      const locked = new Set(field.lockedSlugs || []);
      const visible = options.filter((option) => !locked.has(option.slug) || selected.has(option.id));
      list.replaceChildren(...visible.map((option) => {
        const box = h('input', { type: 'checkbox', checked: selected.has(option.id), disabled: locked.has(option.slug) });
        boxes.push({ id: option.id, box });
        return h('label', { className: 'check' }, box, ` ${option.name}`);
      }));
    });
    return { el: h('div', {}, label, list), read: () => boxes.filter((b) => b.box.checked).map((b) => b.id) };
  }
  if (field.type === 'file') {
    const input = h('input', { type: 'file', multiple: Boolean(field.multiple) });
    return { el: h('div', {}, label, input), read: () => [...input.files] };
  }
  if (field.type === 'village') return villagePicker(field, given);
  if (field.type === 'choice') {
    const select = h('select', {}, h('option', { value: '', textContent: 'Loading…' }));
    loadAllOptions(field.optionsPath).then((options) => {
      select.replaceChildren(h('option', { value: '', textContent: '—' }), ...options.map((o) => h('option', { value: o.id, textContent: o.name })));
      if (given) select.value = given;
    });
    return { el: h('div', {}, label, select), read: () => select.value };
  }
  const input = field.type === 'select'
    ? h('select', {}, field.options.map((o) => h('option', { value: o, textContent: o || '—' })))
    : field.type === 'textarea'
      ? h('textarea', {})
      : h('input', { type: field.type === 'repeat' ? 'text' : field.type || 'text', step: 'any' });
  if (given != null && given !== '') input.value = given;
  const read = field.type === 'repeat'
    ? () => input.value.split(',').map((part) => part.trim()).filter(Boolean)
    : () => input.value;
  return { el: h('div', {}, label, input), read };
}

function jsonValue(field, value) {
  if (field.type === 'number') return Number(value);
  if (field.bool) return value === 'true';
  return value;
}

function collectBody(spec, inputs) {
  const sendable = inputs.filter((i) => !i.field.pathOnly);
  if (spec.encoding === 'json') {
    const body = {};
    sendable.forEach(({ field, read }) => {
      const value = read();
      if (Array.isArray(value) ? value.length : value !== '') body[field.name] = Array.isArray(value) ? value : jsonValue(field, value);
    });
    return { json: body };
  }
  const form = new FormData();
  sendable.forEach(({ field, read }) => {
    const value = read();
    if (Array.isArray(value)) value.forEach((v) => form.append(field.name, v));
    else if (value !== '') form.append(field.name, value);
  });
  return { form };
}

function adminFormScreen(entry, can, spec, item) {
  const inputs = spec.fields.map((field) => ({ field, ...fieldInput(field, item) }));
  const error = h('div', { className: 'err' });
  const button = h('button', { className: 'primary', type: 'submit', textContent: 'Save' });
  const form = h('form', {}, inputs.map((i) => i.el), button, error);
  form.onsubmit = async (event) => {
    event.preventDefault();
    error.textContent = '';
    const values = Object.fromEntries(inputs.map((i) => [i.field.name, i.read()]));
    const missing = inputs.find((i) => i.field.pathOnly && !values[i.field.name]);
    if (missing) {
      error.textContent = `${missing.field.label} is required`;
      return;
    }
    button.disabled = true;
    const res = await api(spec.method, spec.path(item, values), collectBody(spec, inputs));
    button.disabled = false;
    if (!res.ok) {
      error.textContent = errorText(res);
      return;
    }
    adminEntryScreen(entry, can);
  };
  screenOf(backBar(spec.title, () => adminEntryScreen(entry, can)), form);
}

  const content = h('div', {});

    content.append(h('pre', { textContent: res.ok ? JSON.stringify(res.data, null, 2) : errorText(res) }));
  });
}

function adminDocumentsScreen(entry, can, business) {
  const content = h('div', {});
  screenOf(backBar(`Documents: ${business.name}`, () => adminEntryScreen(entry, can)), content);
  const load = async () => {
    content.replaceChildren();
    const res = await api('GET', `/admin/businesses/${business.id}`);
    if (!res.ok) {
      content.append(h('div', { className: 'err', textContent: errorText(res) }));
      return;
    }
    if (!res.data.documents.length) content.append(h('div', { className: 'hint', textContent: 'No documents.' }));
    res.data.documents.forEach((doc) => {
      const message = h('div', { className: 'err' });
      const statusButtons = DOCUMENT_STATUSES.filter((s) => s !== doc.status).map((status) => h('button', {
        type: 'button',
        textContent: `Mark ${status}`,
        onclick: async () => {
          const result = await api('PATCH', `/admin/businesses/${business.id}/documents/${doc.id}`, { json: { status } });
          if (result.ok) load();
          else message.textContent = errorText(result);
        },
      }));
      content.append(h('div', { className: 'card' },
        h('strong', { textContent: `${doc.document_type} — ${doc.file_name}` }),
        h('div', { className: 'meta', textContent: `${doc.status} · ${doc.content_type} · ${doc.file_size_bytes} bytes` }),
        h('div', { className: 'row wrap', style: 'margin-top:8px' },
          h('button', { type: 'button', textContent: 'Open file', onclick: async () => { if (!(await downloadFile(`/admin/businesses/${business.id}/documents/${doc.id}/file`))) message.textContent = 'Could not load the file'; } }),
          statusButtons),
        message));
    });
  };
  load();
}

function toolbarFor(entry, can) {
  return (entry.toolbar || []).filter((t) => can(t.perm)).map((tool) => h('button', {
    className: 'option',
    type: 'button',
    textContent: tool.label,
    onclick: async () => {
      if (tool.form) adminFormScreen(entry, can, tool.form, null);
      else if (tool.show) adminObjectScreen(entry, can, tool.label, tool.show);
      else if (tool.download) await downloadFile(tool.download.path, tool.download.filename);
    },
  }));
}

function adminEntryScreen(entry, can) {
  const content = h('div', {});
  screenOf(backBar(entry.label, adminScreen), ...toolbarFor(entry, can), content);
  if (!entry.path) return;
  const reload = () => {
    content.replaceChildren();
    pagedList(content, entry.path, (item) => adminCard(entry, item, can, reload), { empty: 'Nothing pending.' });
  };
  reload();
}

function adminScreen() {
  const me = session.me;
  const can = permissionChecker(me);
  const sections = ADMIN_SECTIONS.map((section) => h('div', {},
    h('h3', { textContent: section.title, style: 'margin:16px 0 4px' }),
    section.entries.map((entry) => {
      const allowed = can(entry.view);
      return h('button', {
        className: 'option',
        type: 'button',
        disabled: !allowed,
        textContent: allowed ? entry.label : `${entry.label} (no access)`,
        onclick: () => adminEntryScreen(entry, can),
      });
    })));
  const roles = me.roles.map((role) => role.name).join(', ');
  screenOf(
    h('div', { className: 'row' }, h('h2', { textContent: 'Admin panel', style: 'margin:0' }), h('span', { className: 'fit' }, h('button', { type: 'button', textContent: 'Log out', onclick: logout }))),
    h('div', { className: 'meta', textContent: `${me.first_name} ${me.last_name} · ${roles}` }),
    ...sections,
  );
}

const MY_POST_STATUS_OPTIONS = ['', 'draft', 'published'];
const MY_POST_FIELDS = POST_FIELDS.map((f) => (f.name === 'status' ? { ...f, options: MY_POST_STATUS_OPTIONS } : f));

function postEditScreen(post, onBack) {
  const inputs = MY_POST_FIELDS.map((field) => ({ field, ...fieldInput(field, post) }));
  const error = h('div', { className: 'err' });
  const button = h('button', { className: 'primary', type: 'submit', textContent: 'Save changes' });
  const el = h('form', {}, inputs.map((i) => i.el), button, error);
  el.onsubmit = async (event) => {
    event.preventDefault();
    error.textContent = '';
    button.disabled = true;
    const res = await api('PATCH', `/posts/${post.id}`, collectBody({ encoding: 'form' }, inputs));
    button.disabled = false;
    if (!res.ok) {
      error.textContent = errorText(res);
      return;
    }
    onBack();
  };
  screenOf(backBar('Edit post', onBack), h('div', { className: 'hint', textContent: 'Only fields you fill in are changed. New images are added to the existing ones.' }), el);
}

function ownPostCard(post, reload, onEditBack = myPostsScreen) {
  const message = h('div', { className: 'err' });
  const editable = post.status !== 'blocked';
  const run = async (request) => {
    message.textContent = '';
    const res = await request();
    if (res.ok) reload();
    else message.textContent = errorText(res);
  };
  const setStatus = (status) => run(() => api('PATCH', `/posts/${post.id}`, { form: formOf({ status }) }));
  const buttons = [];
  if (editable && post.status !== 'published') buttons.push(h('button', { type: 'button', textContent: 'Publish', onclick: () => setStatus('published') }));
  if (editable && post.status === 'published') buttons.push(h('button', { type: 'button', textContent: 'Move to draft', onclick: () => setStatus('draft') }));
  if (editable) buttons.push(h('button', { type: 'button', textContent: 'Edit', onclick: () => postEditScreen(post, onEditBack) }));
  buttons.push(h('button', {
    type: 'button',
    textContent: 'Delete',
    onclick: () => {
      if (window.confirm(`Delete "${post.title || (post.content || '').slice(0, 40) || 'this post'}"?`)) run(() => api('DELETE', `/posts/${post.id}`));
    },
  }));
  const badge = h('div', { className: 'meta', style: 'font-weight:600', textContent: `Status: ${post.status}${post.status === 'blocked' ? ' (blocked by a moderator, not editable)' : ''}${post.community ? ` · in ${post.community.name}` : ''}` });
  return h('div', {}, badge, postCard(post, reload), h('div', { className: 'row wrap', style: 'margin-top:6px' }, buttons), message);
}

function myPostsScreen() {
  const content = h('div', {});
  screenOf(backBar('My posts', () => homeScreen('profile')), content);
  const reload = () => {
    content.replaceChildren();
    pagedList(content, `/posts?user_id=${session.me.id}`, (post) => ownPostCard(post, reload), { empty: 'You have not created any posts yet.' });
  };
  reload();
}

async function route() {
  const res = await api('GET', '/auth/me');
  if (!res.ok) {
    clearSession();
    welcome();
    return;
  }
  const user = res.data;
  session.me = user;
  realtimeConnect();
  resumePush();
  if (isAdmin(user)) return adminScreen();
  if (!user.date_of_birth && !session.skipProfile) return profileScreen();
  if (user.account_role && !user.account_role.selection_completed) return roleScreen();
  if (!(user.native_places || []).length && !session.skipNative) return nativeScreen();
  return homeScreen();
}

const baseInput = document.getElementById('base');
baseInput.value = store.base;
baseInput.onchange = () => {
  store.base = baseInput.value.trim().replace(/\/$/, '');
  persist();
  realtimeDisconnect();
  realtimeConnect();
};
document.getElementById('ws-ping').onclick = () => {
  realtime.logPong = true;
  if (!sendSocket({ type: 'ping' })) {
    realtime.logPong = false;
    setWsStatus('not connected', true);
  }
};
document.getElementById('ws-toggle').onclick = () => {
  const socket = realtime.socket;
  const live = socket && (socket.readyState === WS_CONNECTING || socket.readyState === WS_OPEN);
  if (live) realtimeDisconnect();
  else realtimeConnect();
};
document.getElementById('restart').onclick = () => {
  clearSession();
  welcome();
};

const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/13.1.0';
const push = { messaging: null, registration: null, token: '' };

function setPushStatus(text, bad = false) {
  const el = document.getElementById('push-status');
  el.textContent = `Push: ${text}`;
  el.className = bad ? 'bad' : '';
  document.getElementById('push-toggle').textContent = push.token ? 'Disable' : 'Enable';
}

async function servedPushConfig() {
  const res = await api('GET', '/me/devices/web-config');
  if (!res.ok || !res.data.enabled) return null;
  return { config: res.data.firebase_config, vapid: res.data.vapid_key };
}

async function enablePush({ interactive }) {
  if (!store.access) return setPushStatus('log in first', true);
  if (!('serviceWorker' in navigator) || !('Notification' in window)) return setPushStatus('not supported in this browser', true);
  const served = await servedPushConfig();
  if (!served) return setPushStatus('not configured on the server (FCM_WEB_* in .env)', true);
  try {
    const { config, vapid } = served;
    const permission = interactive ? await Notification.requestPermission() : Notification.permission;
    if (permission !== 'granted') return setPushStatus(`permission ${permission}`, true);
    const { initializeApp, getApps } = await import(`${FIREBASE_SDK}/firebase-app.js`);
    const { getMessaging, getToken, onMessage } = await import(`${FIREBASE_SDK}/firebase-messaging.js`);
    push.registration = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
    await navigator.serviceWorker.ready;
    push.messaging = getMessaging(getApps()[0] || initializeApp(config));
    push.token = await getToken(push.messaging, { vapidKey: vapid, serviceWorkerRegistration: push.registration });
    if (!push.token) return setPushStatus('no token from Firebase', true);
    const res = await api('POST', '/me/devices', { json: { token: push.token, platform: 'web' } });
    if (!res.ok) {
      push.token = '';
      return setPushStatus(`API refused (${res.status})`, true);
    }
    store.pushOn = true;
    persist();
    navigator.serviceWorker.onmessage = (event) => {
      if (!event.data || event.data.type !== 'is-chat-open') return;
      event.ports[0].postMessage(event.data.senderId === realtime.openChatPartnerId);
    };
    onMessage(push.messaging, (payload) => {
      logEntry('PUSH (page in foreground)', payload);
      const data = payload.data || {};
      if (document.visibilityState === 'visible' && data.type === 'direct_message' && data.sender_id === realtime.openChatPartnerId) return;
      const note = payload.notification || {};
      push.registration.showNotification(note.title || 'Native Life', { body: note.body || '', data: payload.data });
    });
    setPushStatus('on - this browser is registered');
  } catch (error) {
    push.token = '';
    setPushStatus(error.message, true);
  }
}

async function disablePush() {
  if (push.token) await api('DELETE', '/me/devices', { json: { token: push.token } });
  if (push.messaging) {
    const { deleteToken } = await import(`${FIREBASE_SDK}/firebase-messaging.js`);
    await deleteToken(push.messaging).catch(() => {});
  }
  push.token = '';
  store.pushOn = false;
  persist();
  setPushStatus('off');
}

function resumePush() {
  if (store.pushOn && !push.token) enablePush({ interactive: false });
}

document.getElementById('push-toggle').onclick = () => (push.token ? disablePush() : enablePush({ interactive: true }));

if (store.access) route();
else welcome();
</script>
