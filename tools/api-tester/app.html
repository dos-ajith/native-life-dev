const HANDOVER_OTP_LENGTH = 6;
const PROOF_IMAGE_TYPES = 'image/jpeg,image/png,image/webp';

function courierHandoverPanel(request, reload) {
  const message = h('div', { className: 'err' });
  const run = async (call, notice = '') => {
    message.textContent = '';
    const res = await call();
    if (res.ok) reload(notice);
    else message.textContent = errorText(res);
  };
  if (request.status === 'delivered') {
    return h('div', { className: 'card' },
      h('strong', { textContent: `Delivered ${formatDate(request.delivered_at)}` }),
      request.proof_available ? privateImage(`/me/courier/requests/${request.id}/proof`) : '');
  }
  if (request.status !== 'accepted') {
    return h('div', { className: 'hint', textContent: `Nothing to hand over while the request is ${request.status}.` });
  }
  const start = h('button', {
    className: request.started_at ? '' : 'primary',
    type: 'button',
    textContent: request.started_at ? 'Resend OTP to customer' : 'Start delivery',
    onclick: () => run(
      () => api('POST', `/me/courier/requests/${request.id}/start`),
      request.started_at ? 'OTP sent to the customer again.' : 'Delivery started. The customer has been sent the OTP.',
    ),
  });
  if (!request.started_at) {
    return h('div', { className: 'card stack' },
      h('div', { className: 'hint', textContent: 'Start the delivery when you leave. The customer gets a 6-digit OTP on their order screen to read out at handover.' }),
      start,
      message);
  }
  const otp = h('input', { type: 'text', inputMode: 'numeric', maxLength: HANDOVER_OTP_LENGTH, placeholder: `${HANDOVER_OTP_LENGTH}-digit OTP from the customer`, required: true });
  const photo = h('input', { type: 'file', accept: PROOF_IMAGE_TYPES, required: true });
  photo.setAttribute('capture', 'environment');
  const submit = h('button', { className: 'primary', type: 'submit', textContent: 'Complete delivery' });
  const completeForm = h('form', { className: 'stack' },
    h('div', { className: 'hint', textContent: `Delivery started ${formatDate(request.started_at)}. Ask the customer for the OTP and take a photo of the parcel you hand over.` }),
    h('div', {}, h('label', { textContent: 'OTP *' }), otp),
    h('div', {}, h('label', { textContent: 'Photo of the handed-over parcel *' }), photo),
    submit);
  completeForm.onsubmit = async (event) => {
    event.preventDefault();
    if (!photo.files.length) {
      message.textContent = 'Take or choose a photo of the parcel.';
      return;
    }
    const body = new FormData();
    body.append('otp', otp.value.trim());
    body.append('proof_image', photo.files[0]);
    submit.disabled = true;
    await run(() => api('POST', `/me/courier/requests/${request.id}/complete`, { form: body }));
    submit.disabled = false;
  };
  return h('div', { className: 'card stack' }, completeForm, start, message);
}

async function addProductToCart(product, quantity, message, openCart = false) {
  message.replaceChildren();
  const res = await api('POST', '/me/cart/products', {
    json: { business_id: product.business.id, product_id: product.id, quantity },
  });
  if (!res.ok) {
    message.append(h('div', { className: 'err', textContent: errorText(res) }));
    return;
  }
  if (openCart) {
    cartScreen();
    return;
  }
  message.append(
    h('div', { textContent: `${quantity} × ${product.name} added to cart.` }),
    h('button', { className: 'primary', type: 'button', textContent: 'Go to cart', onclick: cartScreen }));
}

function dealCard(deal) {
  const card = h('div', {});
  const draw = (current) => {
    const message = h('div', { className: 'ok' });
    const items = current.items.map((item) => {
      const picker = quantityPicker(item);
      return h('div', { className: 'stack', style: 'margin-top:6px' },
        h('div', { textContent: `${item.name}${item.unit ? ` (${item.unit})` : ''} — ${item.deal_price ?? ''}${item.original_price ? ` (was ${item.original_price})` : ''}` }),
        h('div', { className: 'row wrap' }, picker.el,
          h('button', {
            className: 'fit',
            type: 'button',
            textContent: item.remaining_quantity === 0 ? 'Sold out' : 'Add to cart',
            disabled: item.remaining_quantity === 0,
            onclick: async () => {
              const quantity = picker.read();
              const res = await api('POST', '/me/cart/items', { json: { deal_item_id: item.id, quantity } });
              message.className = res.ok ? 'ok' : 'err';
              if (!res.ok) {
                message.textContent = errorText(res);
                return;
              }
              message.replaceChildren(
                h('div', { textContent: `${quantity} × ${item.name} added to cart.` }),
                h('button', { className: 'primary', type: 'button', textContent: 'Go to cart', onclick: cartScreen }));
            },
          })));
    });
    const refresh = async (request) => {
      const res = await request();
      if (!res.ok) {
        message.className = 'err';
        message.textContent = errorText(res);
        return;
      }
      const fresh = await api('GET', `/deals/${current.id}`);
      if (fresh.ok) draw(fresh.data);
    };
    const joinButton = current.is_mine
      ? ''
      : h('button', {
        type: 'button',
        textContent: current.has_joined ? 'Leave deal' : 'Join deal',
        onclick: () => refresh(() => api(current.has_joined ? 'DELETE' : 'POST', `/deals/${current.id}/join`)),
      });
    card.replaceChildren(h('div', { className: 'card' },
      current.thumbnail_url ? privateImage(current.thumbnail_url) : '',
      h('strong', { textContent: current.name }),
      h('div', { className: 'meta', textContent: `${current.category ? current.category.name : ''} · by ${current.business ? current.business.name : current.creator.name}` }),
      h('div', { className: 'meta', textContent: `${current.joined_count}${current.min_joiners ? ` / ${current.min_joiners}` : ''} joined${current.valid_until ? ` · until ${formatDate(current.valid_until)}` : ''}` }),
      current.description ? h('div', { textContent: current.description }) : '',
      current.pickup_location ? h('div', { className: 'meta', textContent: `Pickup: ${current.pickup_location}` }) : '',
      items,
      h('div', { className: 'row wrap', style: 'margin-top:8px' }, joinButton),
      message));
  };
  draw(deal);
  return card;
}

function chipRow(chips, onSelect) {
  const row = h('div', { className: 'row wrap', style: 'margin:8px 0' });
  const select = (id) => {
    [...row.children].forEach((button) => button.classList.toggle('active', button.dataset.id === String(id ?? '')));
    onSelect(id);
  };
  chips.forEach((chip) => {
    const button = h('button', { type: 'button', className: 'chip-btn', textContent: chip.label, onclick: () => select(chip.id) });
    button.dataset.id = String(chip.id ?? '');
    row.append(button);
  });
  return { row, select };
}

function withQuery(path, params) {
  const query = Object.entries(params).filter(([, v]) => v != null && v !== '').map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&');
  return query ? `${path}${path.includes('?') ? '&' : '?'}${query}` : path;
}

async function childCategoryChips(rootName, allLabel) {
  const roots = await api('GET', '/businesses/categories?page=1&page_size=100');
  const root = roots.ok ? listOf(roots.data).find((c) => c.name.toLowerCase() === rootName) : null;
  if (!root) return { root: null, chips: [{ id: null, label: allLabel }] };
  const children = await api('GET', `/businesses/categories?parent_id=${root.id}&page=1&page_size=100`);
  const chips = [{ id: root.id, label: allLabel }, ...(children.ok ? listOf(children.data) : []).map((c) => ({ id: c.id, label: c.name }))];
  return { root, chips };
}

function packageMoney(value) {
  return value == null ? '—' : Number(value).toFixed(2);
}

function packagePriceLine(pkg) {
  if (pkg.package_price == null || pkg.direct_value == null) return 'Price not set yet';
  const discount = Number(pkg.discount_percent) > 0 ? ` · ${pkg.discount_percent}% off` : '';
  const tax = Number(pkg.tax_percent) > 0 ? ` + ${pkg.tax_percent}% tax` : '';
  return `${packageMoney(pkg.package_price)}${tax} (worth ${packageMoney(pkg.direct_value)})${discount}`;
}

function packageErrorText(res) {
  const reasons = res.errors.map((error) => error.message || JSON.stringify(error));
  return [`${res.status || ''} ${res.message}`.trim(), ...reasons].join('\n');
}

function packageCategoryLabel(category) {
  const found = PACKAGE_CATEGORIES.find((item) => item.id === category);
  return found ? found.label : category;
}

function packageMediaNode(item) {
  const url = mediaUrl(item.url);
  return item.kind === 'video'
    ? h('video', { src: url, controls: true, style: 'max-width:100%;max-height:220px;margin-top:6px' })
    : h('img', { src: url, alt: '' });
}

function packageCover(url) {
  if (!url) return '';
  return /\.mp4$/i.test(url) ? packageMediaNode({ kind: 'video', url }) : packageMediaNode({ kind: 'image', url });
}

function packageNumberedIcon(number, color) {
  return L.divIcon({
    className: '',
    iconSize: [26, 26],
    iconAnchor: [13, 13],
    html: `<div style="width:26px;height:26px;border-radius:50%;background:${color};color:#fff;font-weight:700;text-align:center;line-height:26px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)">${number}</div>`,
  });
}

function drawPackageRoute(map, layer, points, origin) {
  layer.clearLayers();
  const latLngs = points.map((point) => [Number(point.latitude), Number(point.longitude)]);
  const isTravel = points.length > 1;
  latLngs.forEach((latLng, index) => {
    L.marker(latLng, { icon: packageNumberedIcon(index + 1, PACKAGE_ROUTE_COLOR) }).addTo(layer).bindTooltip(`${index + 1}. ${points[index].name || ''}`);
  });
  if (isTravel) L.polyline(latLngs, { color: PACKAGE_ROUTE_COLOR, weight: 4, opacity: 0.9 }).addTo(layer);
  const bounds = [...latLngs];
  if (!isTravel && origin && latLngs.length) {
    const start = [Number(origin.latitude), Number(origin.longitude)];
    L.polyline([start, latLngs[0]], { color: PACKAGE_ORIGIN_COLOR, weight: 4, dashArray: '8 8' }).addTo(layer);
    L.circleMarker(start, { radius: 7, color: PACKAGE_ORIGIN_COLOR, fillColor: '#fff', fillOpacity: 1 }).addTo(layer).bindTooltip(`Start: ${origin.name}`);
    bounds.push(start);
  }
  if (bounds.length) map.fitBounds(bounds, { padding: [PACKAGE_MAP_PADDING_PX, PACKAGE_MAP_PADDING_PX], maxZoom: PIN_ZOOM, animate: false });
}

function packageRouteMap(pkg) {
  if (!pkg.route_points.length) return '';
  const container = h('div', { style: `height:${MAP_HEIGHT_PX}px;margin:8px 0` });
  setTimeout(() => {
    const map = newMap(container);
    map.invalidateSize();
    drawPackageRoute(map, L.layerGroup().addTo(map), pkg.route_points, pkg.origin);
  }, 0);
  return container;
}

function packageLocationSections(pkg) {
  const looseMedia = pkg.media.filter((item) => !item.route_point_id);
  return [
    ...pkg.route_points.map((point, index) => h('div', { className: 'card stack' },
      h('strong', { textContent: `${index + 1}. ${point.name}` }),
      point.media.length ? point.media.map(packageMediaNode) : h('div', { className: 'meta', textContent: 'No images for this location yet.' }))),
    looseMedia.length ? h('div', { className: 'card stack' }, h('strong', { textContent: 'Package media' }), looseMedia.map(packageMediaNode)) : '',
  ];
}

function packageDetailView(pkg) {
  const route = pkg.category === 'resort'
    ? (pkg.origin ? `Route from ${pkg.origin.name} to ${pkg.route_points[0] ? pkg.route_points[0].name : 'the resort'}` : 'Resort destination')
    : `Route: ${pkg.route_points.map((point) => point.name).join(' → ')}`;
  return h('div', { className: 'card stack' },
    h('strong', { textContent: pkg.title }),
    h('div', { className: 'meta', textContent: [packageCategoryLabel(pkg.category), pkg.business_name, pkg.primary_location && pkg.primary_location.name].filter(Boolean).join(' · ') }),
    h('div', { textContent: pkg.description }),

    packageRouteMap(pkg),
    packageLocationSections(pkg),
    pkg.youtube_url ? h('a', { href: pkg.youtube_url, target: '_blank', rel: 'noopener', textContent: 'Watch on YouTube' }) : '',
    pkg.extra_content ? h('div', { textContent: pkg.extra_content }) : '',
    pkg.inclusions.length ? h('strong', { textContent: 'What is included' }) : '',
    pkg.inclusions.map((item) => h('div', { className: 'meta', textContent: `${item.business_name} — ${item.provides}` })),
    h('div', {},
      h('strong', { textContent: packagePriceLine(pkg) }),
      pkg.saving != null ? h('span', { className: 'meta', textContent: `  you save ${packageMoney(pkg.saving)}` }) : ''),
    pkg.visibility_locations.length
      ? h('div', { className: 'meta', textContent: `Also shown in: ${pkg.visibility_locations.map((place) => place.name).join(', ')}` })
      : '');
}

      business.promoter ? '' : h('button', { type: 'button', textContent: 'Booking history', onclick: () => businessBookingsScreen(business, () => businessPackagesScreen(business), BOOKING_HISTORY) })),
    chips, message, list);
  const emptyText = { active: 'No published packages yet.', inactive: 'No drafts, rejected or unpublished packages.', pending: 'Nothing is waiting for approval.' };
  const show = (id) => {
    message.textContent = '';
    list.replaceChildren();
    pagedList(list, withQuery(`${base}/packages`, { tab: id }), (pkg) => packageRow(pkg, id), { empty: emptyText[id] });
  };
  const change = async (pkg, action, target) => {
    message.textContent = '';
    const res = await api('POST', `${base}/packages/${pkg.id}/${action}`);
    if (res.ok) businessPackagesScreen(business, target);
    else message.textContent = packageErrorText(res);
  };
  const createdByOthers = (pkg) => !business.promoter && pkg.promoter_id && pkg.promoter_id !== (session.me && session.me.id);
  const actions = (pkg, currentTab) => {
    const buttons = [
      h('button', { type: 'button', textContent: pkg.status === 'pending_approval' ? 'Review' : 'Preview', onclick: () => packageWizardScreen(business, pkg.id, PACKAGE_PREVIEW_STEP) }),
    ];
    if (pkg.status !== 'pending_approval') {
      const editable = !business.promoter || ['draft', 'rejected'].includes(pkg.status);
      if (editable) buttons.unshift(h('button', { type: 'button', textContent: 'Edit', onclick: () => packageWizardScreen(business, pkg.id, ['draft', 'rejected'].includes(pkg.status) ? Math.min(pkg.next_step, PACKAGE_PREVIEW_STEP) : 1) }));
    }
    if (pkg.status === 'published') buttons.push(h('button', { type: 'button', textContent: 'Unpublish', onclick: () => change(pkg, 'unpublish', 'inactive') }));
    else if (business.promoter && ['draft', 'rejected'].includes(pkg.status)) buttons.push(h('button', { className: 'primary', type: 'button', textContent: 'Submit for approval', onclick: () => change(pkg, 'submit', 'pending') }));
    else if (!business.promoter && pkg.status === 'unpublished') buttons.push(h('button', { className: 'primary', type: 'button', textContent: 'Publish', onclick: () => change(pkg, 'publish', 'active') }));
    else if (!business.promoter && pkg.status === 'draft' && !createdByOthers(pkg)) buttons.push(h('button', { className: 'primary', type: 'button', textContent: 'Publish', onclick: () => change(pkg, 'publish', 'active') }));
    return h('div', { className: 'row wrap' }, buttons);
  };
  const packageRow = (pkg, currentTab) => h('div', { className: 'card stack' },
    packageCover(pkg.cover_url),
    h('strong', { textContent: `${pkg.title} · ${PACKAGE_STATUS_LABELS[pkg.status] || pkg.status}` }),
    business.promoter && pkg.business_id ? h('div', { className: 'meta', textContent: `Business: ${names[pkg.business_id] || pkg.business_id}` }) : '',
    h('div', { className: 'meta', textContent: [packageCategoryLabel(pkg.category), pkg.destination_names.join(' → ')].filter(Boolean).join(' · ') }),
    h('div', { className: 'meta', textContent: packagePriceLine(pkg) }),
    pkg.status === 'draft' ? h('div', { className: 'meta', textContent: `Next step: ${pkg.next_step > PACKAGE_PREVIEW_STEP - 1 ? 'preview and submit' : PACKAGE_STEP_TITLES[pkg.next_step - 1]}` }) : '',
    actions(pkg, currentTab));
  const { row, select } = chipRow([{ id: 'active', label: 'Active' }, { id: 'inactive', label: 'Inactive' }, { id: 'pending', label: 'Pending approval' }], show);
  chips.append(row);
  select(tab);
}

function packageRouteEditor({ category, initial, origin }) {
  const isResort = category === 'resort';
  let points = initial.map((point) => ({ ...point, edited: true }));
  const container = h('div', { style: `height:${MAP_HEIGHT_PX}px;margin:8px 0` });
  const list = h('div', { className: 'stack' });
  const map = newMap(container).setView([20.5937, 78.9629], 5);
  const layer = L.layerGroup().addTo(map);
  const redraw = (fit = false) => {
    layer.clearLayers();
    const latLngs = points.map((point) => [Number(point.latitude), Number(point.longitude)]);
    points.forEach((point, index) => {
      const marker = L.marker(latLngs[index], { icon: packageNumberedIcon(index + 1, PACKAGE_ROUTE_COLOR), draggable: true }).addTo(layer);
      marker.bindTooltip(`${index + 1}. ${point.name || ''}`);
      marker.on('dragend', () => {
        const moved = marker.getLatLng();
        setCoordinates(point, moved.lat, moved.lng);
      });
    });
    if (points.length > 1) L.polyline(latLngs, { color: PACKAGE_ROUTE_COLOR, weight: 4, opacity: 0.9 }).addTo(layer);
    if (isResort && origin && points.length) L.polyline([[Number(origin.latitude), Number(origin.longitude)], latLngs[0]], { color: PACKAGE_ORIGIN_COLOR, weight: 4, dashArray: '8 8' }).addTo(layer);
    if (fit && latLngs.length) map.fitBounds(latLngs, { padding: [PACKAGE_MAP_PADDING_PX, PACKAGE_MAP_PADDING_PX], maxZoom: PIN_ZOOM, animate: false });
    drawList();
  };
  const setCoordinates = async (point, lat, lng) => {
    point.latitude = lat.toFixed(COORDINATE_DECIMALS);
    point.longitude = lng.toFixed(COORDINATE_DECIMALS);
    redraw();
    const found = await api('GET', `/geography/reverse/address?latitude=${lat}&longitude=${lng}`);
    if (found.ok && !point.edited) {
      point.name = found.data.location_name.slice(0, PACKAGE_LOCATION_NAME_LIMIT);
      redraw();
    }
  };
  const move = (index, offset) => {
    [points[index], points[index + offset]] = [points[index + offset], points[index]];
    redraw();
  };
  const drawList = () => {
    list.replaceChildren(...points.map((point, index) => h('div', { className: 'card stack' },
      h('div', { className: 'row' },
        h('strong', { textContent: `${index + 1}.` }),
        h('input', { type: 'text', maxLength: PACKAGE_LOCATION_NAME_LIMIT, value: point.name, placeholder: 'Location name (filled from the map, you can edit it)', oninput: (event) => { point.name = event.target.value; point.edited = true; } })),
      h('div', { className: 'meta', textContent: `${point.latitude}, ${point.longitude}` }),
      isResort ? '' : h('div', { className: 'row wrap' },
        h('button', { type: 'button', textContent: '↑ Earlier', disabled: index === 0, onclick: () => move(index, -1) }),
        h('button', { type: 'button', textContent: '↓ Later', disabled: index === points.length - 1, onclick: () => move(index, 1) }),
        h('button', { type: 'button', textContent: 'Remove', onclick: () => { points.splice(index, 1); redraw(); } })))));
  };
  map.on('click', (event) => {
    if (isResort) {
      const current = points[0] || { id: undefined, name: '', edited: false };
      current.edited = false;
      points = [current];
      setCoordinates(current, event.latlng.lat, event.latlng.lng);
      return;
    }
    if (points.length >= PACKAGE_MAX_ROUTE_POINTS) return;
    const fresh = { id: undefined, name: '', latitude: '0', longitude: '0', edited: false };
    points.push(fresh);
    setCoordinates(fresh, event.latlng.lat, event.latlng.lng);
  });
  const show = async () => {
    map.invalidateSize();
    if (points.length) return redraw(true);
    const res = await api('GET', '/users/me/native-places/boundaries');
    const primary = res.ok ? res.data.find((item) => item.slot === 'primary') || res.data[0] : null;
    if (primary) map.fitBounds(L.geoJSON(primary.boundary.feature, { style: BOUNDARY_STYLE, interactive: false }).addTo(map).getBounds(), { animate: false });
    return redraw();
  };
  const value = () => points.map((point) => ({ id: point.id, name: point.name.trim(), latitude: point.latitude, longitude: point.longitude }));
  return { el: container, list, show, value };
}

async function packageWizardScreen(business, packageId, step = 1) {
  const base = packagesBaseOf(business);
  const stepBar = h('div', { className: 'row wrap', style: 'margin:8px 0' });
  const message = h('div', {});
  const content = h('div', { className: 'stack' });
  screenOf(backBar(packageId ? 'Edit package' : 'New package', () => businessPackagesScreen(business, 'inactive')), stepBar, message, content);
  const say = (text, good = false) => {
    message.className = good ? 'ok' : 'err';
    message.textContent = text;
  };
  let pkg = null;
  if (packageId) {
    const loaded = await api('GET', `${base}/packages/${packageId}`);
    if (!loaded.ok) {
      say(packageErrorText(loaded));
      return;
    }
    pkg = loaded.data;
  }
  const locationsRes = await api('GET', `${base}/package-locations?page=1&page_size=${PACKAGE_LOCATION_PAGE_SIZE}`);
  const locations = locationsRes.ok ? listOf(locationsRes.data) : [];
  const go = (id, target = step) => packageWizardScreen(business, id, target);
  const locked = Boolean(pkg && pkg.status === 'pending_approval');
  PACKAGE_STEP_TITLES.forEach((title, index) => {
    const number = index + 1;
    const done = pkg && pkg.completed_steps.includes(number);
    stepBar.append(h('button', {
      type: 'button',
      className: `chip-btn${number === step ? ' active' : ''}`,
      disabled: !pkg && number > 1,
      textContent: `${number}. ${title}${done ? ' ✓' : ''}`,
      onclick: () => go(packageId, number),
    }));
  });
  if (pkg) content.before(...packageApprovalNotes(pkg).filter(Boolean));
  const nav = (target, label = 'Next →') => h('button', { type: 'button', textContent: label, disabled: !pkg, onclick: () => go(packageId, target) });
  const saveButton = (label, onclick) => h('button', { className: 'primary', type: 'button', textContent: label, disabled: locked, onclick });
  const locationOptions = (selected) => locations.map((place) => h('option', { value: place.id, textContent: place.name, selected: place.id === selected }));

  const informationStep = () => {
    const title = h('input', { type: 'text', maxLength: PACKAGE_TEXT_LIMIT, placeholder: `Title (max ${PACKAGE_TEXT_LIMIT})`, value: pkg ? pkg.title : '' });
    const description = h('textarea', { maxLength: PACKAGE_TEXT_LIMIT, placeholder: `Description (max ${PACKAGE_TEXT_LIMIT})`, value: pkg ? pkg.description : '' });
    const fixedCategory = pkg ? pkg.category : (business.promoter ? null : business.packageCategory);
    const categorySelect = h('select', { disabled: Boolean(fixedCategory) }, PACKAGE_CATEGORIES.map((item) => h('option', { value: item.id, textContent: item.label, selected: fixedCategory === item.id })));
    let editor = null;
    const mapBox = h('div', {});
    const mountEditor = () => {
      editor = packageRouteEditor({
        category: pkg ? pkg.category : categorySelect.value,
        initial: pkg ? pkg.route_points.map((point) => ({ id: point.id, name: point.name, latitude: point.latitude, longitude: point.longitude })) : [],
        origin: pkg ? pkg.origin : null,
      });
      mapBox.replaceChildren(
        h('div', { className: 'hint', textContent: (pkg ? pkg.category : categorySelect.value) === 'resort'
          ? 'Click the map once to pin the resort. The name is looked up from the map; you can edit it. The route from your native place is shown after saving.'
          : 'Click the map to add each destination in order (2 to 20 pins). Drag a pin to move it, reorder below. The line connects the pins in order.' }),
        editor.el, editor.list);
      editor.show();
    };
    categorySelect.onchange = mountEditor;
    const save = async () => {
      const json = { title: title.value.trim(), description: description.value.trim(), route_points: editor.value() };
      if (!pkg && business.promoter) json.category = categorySelect.value;
      const res = pkg ? await api('PUT', `${base}/packages/${pkg.id}/information`, { json }) : await api('POST', `${base}/packages`, { json });
      if (!res.ok) return say(packageErrorText(res));
      return pkg ? go(pkg.id, 1) : go(res.data.id, 2);
    };
    content.append(
      h('label', { textContent: 'Package category *' }), categorySelect,
      h('div', { className: 'hint', textContent: business.promoter ? (pkg ? 'The category cannot be changed after the draft is created.' : 'Choose Travel or Resort, then pick a matching business in step 3.') : 'This business creates ' + packageCategoryLabel(fixedCategory) + ' packages. The package is linked to this business automatically.' }),
      h('label', { textContent: 'Title *' }), title,
      h('label', { textContent: 'Description *' }), description,
      h('label', { textContent: 'Destinations *' }), mapBox,
      h('div', { className: 'row' }, saveButton(pkg ? 'Save' : 'Create draft', save), nav(2)));
    mountEditor();
  };

  const mediaStep = () => {
    const pending = [];
    const upload = async (point, input) => {
      const form = new FormData();
      [...input.files].forEach((file) => form.append('files', file));
      form.append('route_point_id', point.id);
      const res = await api('POST', `${base}/packages/${pkg.id}/media`, { form });
      if (!res.ok) say(packageErrorText(res));
      return res.ok;
    };
    const uploadFor = async (point, input) => {
      if (!input.files.length) return say('Choose at least one file.');
      if (await upload(point, input)) go(pkg.id, 2);
    };
    const uploadPendingAndNext = async () => {
      for (const { point, input } of pending.filter((entry) => entry.input.files.length)) {
        if (!(await upload(point, input))) return;
      }
      go(pkg.id, 3);
    };
    const remove = async (item) => {
      const res = await api('DELETE', `${base}/packages/${pkg.id}/media/${item.id}`);
      if (res.ok) go(pkg.id, 2);
      else say(packageErrorText(res));
    };
    const mediaRow = (item) => h('div', { className: 'card stack' },
      packageMediaNode(item),
      h('div', { className: 'meta', textContent: `${item.kind} · ${(item.size_bytes / BYTES_PER_MB).toFixed(2)} MB` }),
      h('button', { type: 'button', textContent: 'Delete', disabled: locked, onclick: () => remove(item) }));
    const section = (point, index) => {
      const input = h('input', { type: 'file', multiple: true, accept: PACKAGE_MEDIA_ACCEPT });
      pending.push({ point, input });
      return h('div', { className: 'card stack' },
        h('strong', { textContent: pkg.category === 'resort' ? `Resort: ${point.name}` : `${index + 1}. ${point.name}` }),
        point.media.length ? point.media.map(mediaRow) : h('div', { className: 'meta', textContent: 'No media for this location yet.' }),
        input, h('button', { className: 'primary', type: 'button', textContent: 'Upload for this location', disabled: locked, onclick: () => uploadFor(point, input) }));
    };
    const youtube = h('input', { type: 'text', placeholder: 'YouTube link (optional)', value: pkg.youtube_url || '' });
    const extra = h('textarea', { placeholder: 'Extra content (optional)', value: pkg.extra_content || '' });
    const saveLinks = async () => {
      const res = await api('PUT', `${base}/packages/${pkg.id}/extras`, { json: { youtube_url: youtube.value, extra_content: extra.value } });
      if (res.ok) say('Link and extra content saved.', true);
      else say(packageErrorText(res));
    };
    content.append(
      h('div', { className: 'hint', textContent: 'JPG, PNG or MP4, up to 50 MB each, up to 10 files per location. Every location needs at least one file.' }),
      ...pkg.route_points.map(section),
      h('label', { textContent: 'YouTube link' }), youtube,
      h('label', { textContent: 'Extra content' }), extra,
      saveButton('Save link and extra content', saveLinks),
      h('div', { className: 'row' }, nav(1, '← Back'), locked ? nav(3) : h('button', { type: 'button', textContent: 'Upload chosen files & next →', disabled: !pkg, onclick: uploadPendingAndNext })));
  };

  const inclusionsEditor = () => {
    const rows = h('div', { className: 'stack' });
    const addRow = (value = { business_name: '', provides: '' }) => rows.append(h('div', { className: 'card stack' },
      h('input', { type: 'text', maxLength: PACKAGE_TEXT_LIMIT, placeholder: `Business (max ${PACKAGE_TEXT_LIMIT})`, value: value.business_name }),
      h('input', { type: 'text', maxLength: PACKAGE_TEXT_LIMIT, placeholder: `What it provides (max ${PACKAGE_TEXT_LIMIT})`, value: value.provides }),
      h('button', { type: 'button', textContent: 'Remove', onclick: (event) => event.target.closest('.card').remove() })));
    (pkg.inclusions.length ? pkg.inclusions : [undefined]).forEach(addRow);
    const save = async () => {
      const inclusions = [...rows.children]
        .map((row) => ({ business_name: row.children[0].value.trim(), provides: row.children[1].value.trim() }))
        .filter((item) => item.business_name || item.provides);
      const res = await api('PUT', `${base}/packages/${pkg.id}/inclusions`, { json: { inclusions } });
      if (res.ok) say('Inclusions saved.', true);
      else say(packageErrorText(res));
    };
    return [h('label', { textContent: 'What the business provides (optional)' }), rows,
      h('div', { className: 'row' }, h('button', { type: 'button', textContent: '+ Add line', onclick: () => addRow() }), saveButton('Save inclusions', save))];
  };

  const businessStep = async () => {
    const preview = await api('GET', `${base}/packages/${pkg.id}/preview`);
    if (preview.ok) content.append(h('div', { className: 'hint', textContent: 'Package so far:' }), packageDetailView(preview.data));
    if (!business.promoter) {
      content.append(h('div', { className: 'meta', textContent: `Business: ${pkg.business_name || business.name}` }), ...inclusionsEditor(), h('div', { className: 'row' }, nav(2, '← Back'), nav(4)));
      return;
    }
    const choices = await api('GET', withQuery(`${base}/businesses`, { category: pkg.category }));
    const data = choices.ok ? choices.data : { has_native_place: true, businesses: [] };
    const select = h('select', {}, h('option', { value: '', textContent: 'Select business' }),
      data.businesses.map((item) => h('option', { value: item.id, selected: item.id === pkg.business_id, textContent: `${item.name} · ${packageCategoryLabel(item.category)} · ${item.distance_km} km${item.default_price != null ? ` · default ${packageMoney(item.default_price)}` : ''}` })));
    const profile = h('div', { className: 'stack' });
    const showProfile = () => {
      const item = data.businesses.find((entry) => entry.id === select.value);
      profile.replaceChildren(item ? h('div', { className: 'card stack' },
        h('strong', { textContent: item.name }),
        h('div', { className: 'meta', textContent: `${packageCategoryLabel(item.category)} · ${item.distance_km} km from your native place` }),
        item.description ? h('div', { textContent: item.description }) : '',
        item.default_price != null ? h('div', { className: 'meta', textContent: `Default price: ${packageMoney(item.default_price)}` }) : '') : '');
    };
    select.onchange = showProfile;
    showProfile();
    const hint = !data.has_native_place
      ? 'Add a native place first: businesses are listed near your native places.'
      : data.businesses.length ? `Only ${packageCategoryLabel(pkg.category)} businesses near you that have Packages enabled are listed.` : `No ${packageCategoryLabel(pkg.category)} business near you has Packages enabled yet.`;
    const choose = async () => {
      if (!select.value) return say('Select a business.');
      const res = await api('PUT', `${base}/packages/${pkg.id}/business`, { json: { business_id: select.value } });
      if (res.ok) return go(pkg.id, 3);
      return say(packageErrorText(res));
    };
    content.append(
      h('label', { textContent: 'Business *' }), select, profile, h('div', { className: 'hint', textContent: hint }),
      saveButton('Select this business', choose),
      ...inclusionsEditor(),
      h('div', { className: 'row' }, nav(2, '← Back'), nav(4)));
  };

  const pricingStep = () => {
    const defaultPrice = pkg.business_default_price;
    const source = h('select', {}, defaultPrice != null ? h('option', { value: 'business_default', textContent: `Offer against the business default price (${packageMoney(defaultPrice)})`, selected: pkg.pricing_source === 'business_default' }) : '',
      h('option', { value: 'manual', textContent: 'Set the prices manually', selected: pkg.pricing_source !== 'business_default' }));
    const direct = h('input', { type: 'number', step: '0.01', min: '0', placeholder: 'Original price', value: pkg.direct_value ?? '' });
    const price = h('input', { type: 'number', step: '0.01', min: '0', placeholder: 'Offer price', value: pkg.package_price ?? '' });
    const tax = h('input', { type: 'number', step: '0.01', min: '0', max: '100', placeholder: 'GST / tax %', value: pkg.tax_percent ?? '0' });
    const result = h('div', { className: 'meta', textContent: pkg.package_price == null ? '' : packagePriceLine(pkg) });
    const sync = () => {
      const fromDefault = source.value === 'business_default';
      direct.disabled = fromDefault;
      if (fromDefault) direct.value = defaultPrice;
    };
    source.onchange = sync;
    sync();
    const save = async () => {
      const json = { source: source.value, package_price: price.value, tax_percent: tax.value || '0' };
      if (source.value === 'manual') json.direct_value = direct.value;
      const res = await api('PUT', `${base}/packages/${pkg.id}/pricing`, { json });
      if (!res.ok) return say(packageErrorText(res));
      return go(pkg.id, 5);
    };
    const ownerDefault = business.promoter ? '' : (() => {
      const input = h('input', { type: 'number', step: '0.01', min: '0', placeholder: 'Default price of this business', value: defaultPrice ?? '' });
      const saveDefault = async () => {
        const res = await api('PUT', `${base}/package-default-price`, { json: { default_price: input.value } });
        if (res.ok) go(pkg.id, 4);
        else say(packageErrorText(res));
      };
      return h('div', { className: 'card stack' }, h('strong', { textContent: 'Default price for this business' }), input,
        h('button', { type: 'button', textContent: 'Save default price', onclick: saveDefault }));
    })();
    content.append(
      !defaultPrice && business.promoter ? h('div', { className: 'hint', textContent: 'This business has not set a default price, so enter the prices manually.' }) : '',
      ownerDefault,
      h('div', { className: 'hint', textContent: 'The offer price must be less than or equal to the original price.' }),
      h('label', { textContent: 'Pricing source' }), source,
      h('label', { textContent: 'Original price *' }), direct,
      h('label', { textContent: 'Offer price *' }), price,
      h('label', { textContent: 'GST / tax % (added on top of the offer price when the customer pays)' }), tax, result,
      h('div', { className: 'row' }, nav(3, '← Back'), saveButton('Save & next →', save)));
  };

  const visibilityStep = async () => {
    const nativeRes = await api('GET', '/users/me/native-places/boundaries');
    const savedNames = new Set(locations.map((entry) => entry.name.trim().toLowerCase()));
    const nativePlaces = (nativeRes.ok ? nativeRes.data : [])
      .filter((entry) => entry.boundary && !savedNames.has(entry.boundary.place.village_name.trim().toLowerCase()))
      .map((entry) => ({
        value: `${NATIVE_PLACE_OPTION_PREFIX}${entry.slot}`,
        name: entry.boundary.place.village_name,
        label: `${entry.boundary.place.village_name} (your ${entry.slot} native place)`,
        latitude: entry.boundary.center_latitude.toFixed(COORDINATE_DECIMALS),
        longitude: entry.boundary.center_longitude.toFixed(COORDINATE_DECIMALS),
      }));
    const preselectNative = !pkg.primary_location && nativePlaces.length ? nativePlaces[0].value : null;
    const place = h('select', {}, h('option', { value: '', textContent: 'Select the primary listing location' }),
      locationOptions(pkg.primary_location && pkg.primary_location.id),
      nativePlaces.map((entry) => h('option', { value: entry.value, textContent: entry.label, selected: entry.value === preselectNative })));
    const primaryLocationId = async () => {
      const native = nativePlaces.find((entry) => entry.value === place.value);
      if (!native) return place.value;
      const created = await api('POST', `${base}/package-locations`, { json: { name: native.name, latitude: native.latitude, longitude: native.longitude } });
      if (!created.ok) {
        say(packageErrorText(created));
        return null;
      }
      return created.data.id;
    };
    const checked = new Set(pkg.visibility_locations.map((entry) => entry.id));
    const boxes = h('div', { className: 'stack' });
    const drawBoxes = () => {
      boxes.replaceChildren(...locations.filter((entry) => entry.id !== place.value).map((entry) => h('label', { style: 'display:block' },
        h('input', { type: 'checkbox', checked: checked.has(entry.id), onchange: (event) => (event.target.checked ? checked.add(entry.id) : checked.delete(entry.id)) }),
        ` ${entry.name}`)));
    };
    place.onchange = () => { checked.delete(place.value); drawBoxes(); };
    drawBoxes();
    const newName = h('input', { type: 'text', maxLength: PACKAGE_LOCATION_NAME_LIMIT, placeholder: 'New listing location name' });
    const pinLat = h('input', { type: 'number', step: 'any', placeholder: 'Latitude', readOnly: true });
    const pinLng = h('input', { type: 'number', step: 'any', placeholder: 'Longitude', readOnly: true });
    let named = false;
    newName.oninput = () => { named = true; };
    const pin = pinMap(async (lat, lng) => {
      pinLat.value = lat.toFixed(COORDINATE_DECIMALS);
      pinLng.value = lng.toFixed(COORDINATE_DECIMALS);
      if (named && newName.value) return;
      const found = await api('GET', `/geography/reverse/address?latitude=${lat}&longitude=${lng}`);
      if (found.ok && !(named && newName.value)) newName.value = found.data.location_name;
    });
    const addLocation = async () => {
      if (!pinLat.value) return say('Click the map to drop a pin on the place first.');
      if (!newName.value.trim()) return say('Give the location a name.');
      const res = await api('POST', `${base}/package-locations`, { json: { name: newName.value.trim(), latitude: pinLat.value, longitude: pinLng.value } });
      if (res.ok) go(pkg.id, 5);
      else say(packageErrorText(res));
    };
    const save = async () => {
      checked.delete(place.value);
      const primaryId = await primaryLocationId();
      if (primaryId === null) return;
      const res = await api('PUT', `${base}/packages/${pkg.id}/visibility`, { json: { primary_location_id: primaryId, location_ids: [...checked] } });
      if (res.ok) go(pkg.id, 6);
      else say(packageErrorText(res));
    };
    content.append(
      h('div', { className: 'hint', textContent: 'Controls where the package is listed in Explore. It is separate from the destinations you pinned in step 1.' }),
      h('label', { textContent: 'Primary listing location *' }), place,
      h('label', { textContent: 'Also show in' }), boxes,
      h('div', { className: 'hint', textContent: 'Need another listing location? Click the map, name it and add it.' }),
      pin.el, h('div', { className: 'row' }, pinLat, pinLng), newName,
      h('button', { type: 'button', textContent: 'Add listing location', onclick: addLocation }),
      h('div', { className: 'row' }, nav(4, '← Back'), saveButton('Save & preview →', save)));
    pin.show();
  };

  const previewStep = async () => {
    const res = await api('GET', `${base}/packages/${pkg.id}/preview`);
    if (!res.ok) return say(packageErrorText(res));
    const act = async (action, target, json) => {
      const result = await api('POST', `${base}/packages/${pkg.id}/${action}`, json ? { json } : undefined);
      if (result.ok) businessPackagesScreen(business, target);
      else say(packageErrorText(result));
    };
    const reject = () => {
      const note = prompt('Why are you not approving this package? The promoter will see it.');
      if (note && note.trim()) act('reject', 'inactive', { note: note.trim() });
    };
    const buttons = [nav(5, '← Back')];
    if (business.promoter) {
      if (['draft', 'rejected'].includes(pkg.status)) {
        buttons.push(h('button', { className: 'primary', type: 'button', textContent: 'Submit for approval', disabled: !pkg.business_id, onclick: () => act('submit', 'pending') }));
        if (!pkg.business_id) buttons.push(h('div', { className: 'err', textContent: 'Select a business in step 3 before submitting.' }));
      }
    } else if (pkg.status === 'pending_approval') {
      buttons.push(h('button', { className: 'primary', type: 'button', textContent: 'Approve and publish', onclick: () => act('approve', 'active') }),
        h('button', { type: 'button', textContent: 'Reject', onclick: reject }));
    } else if (pkg.status === 'published') buttons.push(h('button', { type: 'button', textContent: 'Unpublish', onclick: () => act('unpublish', 'inactive') }));
    else if (pkg.status === 'unpublished' || (pkg.status === 'draft' && (!pkg.promoter_id || pkg.promoter_id === (session.me && session.me.id)))) buttons.push(h('button', { className: 'primary', type: 'button', textContent: 'Publish', onclick: () => act('publish', 'active') }));
    return content.append(
      h('div', { className: 'hint', textContent: `This is what customers see. Status: ${PACKAGE_STATUS_LABELS[pkg.status] || pkg.status}.` }),
      packageDetailView(res.data),
      h('div', { className: 'row wrap' }, buttons));
  };

  const steps = [informationStep, mediaStep, businessStep, pricingStep, visibilityStep, previewStep];
  await steps[pkg ? step - 1 : 0]();
}

function bookingPaymentBlock(booking, { owner, reload, message }) {
  const payment = booking.payment;
  if (!payment) return '';
  const sync = async () => {
    message.textContent = '';
    const res = await api('POST', `/me/bookings/${booking.id}/payment/sync`);
    if (res.ok) reload();
    else message.textContent = packageErrorText(res);
  };
  const buttons = !owner && payment.status === 'pending' ? h('div', { className: 'row wrap' },
    h('button', { className: 'primary', type: 'button', textContent: 'Pay now', onclick: () => window.open(payment.payment_url, '_blank', 'noopener') }),
    h('button', { type: 'button', textContent: 'Check payment', onclick: sync })) : '';
  const when = payment.status === 'paid' ? `Paid ${payment.paid_at}` : payment.status === 'pending' ? `Link expires ${payment.expires_at}` : '';
  return h('div', { className: 'card stack' },
    h('strong', { className: payment.status === 'paid' ? 'ok' : payment.status === 'pending' ? '' : 'err', textContent: PAYMENT_STATUS_LABELS[payment.status] || payment.status }),
    h('div', { className: 'meta', textContent: `${packageMoney(payment.unit_price)} × ${payment.party_size} = ${packageMoney(payment.subtotal)}` }),
    h('div', { className: 'meta', textContent: `Tax ${payment.tax_percent}% = ${packageMoney(payment.tax_amount)}` }),
    h('strong', { textContent: `Total ${packageMoney(payment.total_amount)} ${payment.currency}` }),
    when ? h('div', { className: 'meta', textContent: when }) : '',
    buttons);
}

function bookingDates(booking) {
  return booking.end_date && booking.end_date !== booking.start_date ? `${booking.start_date} → ${booking.end_date}` : booking.start_date;
}

function bookingCard(booking, { owner, reload, message }) {
  const post = async (path, json) => {
    message.textContent = '';
    const res = await api('POST', path, json ? { json } : undefined);
    if (res.ok) reload();
    else message.textContent = packageErrorText(res);
  };
  const base = owner ? `/me/businesses/${booking.business_id}/bookings/${booking.id}` : `/me/bookings/${booking.id}`;
  const ask = (text, required) => {
    const note = prompt(text);
    if (note === null) return null;
    if (required && !note.trim()) return null;
    return note.trim();
  };
  const buttons = [];
  if (owner) {
    if (booking.status === 'requested') {
      buttons.push(h('button', { className: 'primary', type: 'button', textContent: 'Confirm', onclick: () => post(`${base}/confirm`) }));
      buttons.push(h('button', { type: 'button', textContent: 'Reject', onclick: () => { const note = ask('Why can you not accept this booking? The customer will see it.', true); if (note) post(`${base}/reject`, { note }); } }));
    }
    if (booking.status === 'confirmed') {
      buttons.push(h('button', { className: 'primary', type: 'button', textContent: 'Mark completed', onclick: () => post(`${base}/complete`) }));
      buttons.push(h('button', { type: 'button', textContent: 'Cancel', onclick: () => { const reason = ask('Reason for cancelling (optional)', false); if (reason !== null) post(`${base}/cancel`, reason ? { reason } : {}); } }));
    }
  } else if (CUSTOMER_CANCELLABLE_BOOKING_STATUSES.includes(booking.status)) {
    buttons.push(h('button', { type: 'button', textContent: 'Cancel booking', onclick: () => { const reason = ask('Reason for cancelling (optional)', false); if (reason !== null) post(`${base}/cancel`, reason ? { reason } : {}); } }));
  }
  return h('div', { className: 'card stack' },
    h('strong', { textContent: `${booking.item_name} · ${BOOKING_STATUS_LABELS[booking.status] || booking.status}` }),
    h('div', { className: 'meta', textContent: `#${booking.booking_number} · ${bookingDates(booking)} · ${booking.party_size} ${booking.party_size === 1 ? 'person' : 'people'}` }),
    h('div', { className: 'meta', textContent: `${packageMoney(booking.unit_price)} ${booking.currency}${booking.original_price != null ? ` (worth ${packageMoney(booking.original_price)})` : ''}` }),
    owner ? h('div', { className: 'meta', textContent: `${booking.customer_name} · ${booking.customer_phone}` }) : '',
    booking.note ? h('div', { textContent: `Note: ${booking.note}` }) : '',
    booking.response_note ? h('div', { className: booking.status === 'rejected' ? 'err' : 'meta', textContent: `Business note: ${booking.response_note}` }) : '',
    bookingPaymentBlock(booking, { owner, reload, message }),
    buttons.length ? h('div', { className: 'row wrap' }, buttons) : '');
}

function readPaymentReturn() {
  const params = new URLSearchParams(location.search);
  const subject = params.get('payment_subject');
  if (!subject) return null;
  const result = { subject, id: params.get('payment_subject_id') || '', status: params.get('payment_status') || '' };
  ['payment_subject', 'payment_subject_id', 'payment_status'].forEach((key) => params.delete(key));
  const query = params.toString();
  history.replaceState(null, '', `${location.pathname}${query ? `?${query}` : ''}${location.hash}`);
  return result;
}

async function paymentResultScreen(result) {
  const content = h('div', { className: 'stack' });
  const message = h('div', { className: 'err' });
  const paid = result.status === 'paid';
  const isOrder = result.subject === 'order';
  const redraw = () => paymentResultScreen({ ...result, status: '' });
  screenOf(
    backBar(paid ? 'Payment received' : 'Payment not completed', () => homeScreen('home')),
    h('div', { className: 'card stack', style: 'text-align:center' },
      h('div', { style: 'font-size:40px', textContent: paid ? '✅' : '⚠️' }),
      h('h2', { style: 'margin:0', textContent: paid ? 'Payment received' : 'Payment not completed' }),
      h('div', { className: 'meta', textContent: `Razorpay status: ${result.status || 'unknown'}` })),
    content,
    message,
    h('div', { className: 'row wrap' },
      h('button', { className: 'primary', type: 'button', textContent: isOrder ? 'My orders' : 'My bookings', onclick: isOrder ? myOrdersScreen : myBookingsScreen }),
      h('button', { type: 'button', textContent: 'Home', onclick: () => homeScreen('home') })));
  if (!result.id) return;
  if (isOrder) {
    const res = await api('GET', `/me/orders/${result.id}`);
    if (!res.ok || res.data.status === 'cancelled') {
      content.append(
        h('div', { className: 'card stack' },
          h('strong', { textContent: 'The order was not created' }),
          h('div', { className: 'meta', textContent: 'The payment did not complete, so no order was placed. Your items are still in the cart.' }),
          h('button', { type: 'button', textContent: 'Back to cart', onclick: cartScreen })));
      return;
    }
    content.append(orderCard(res.data, redraw));
    return;
  }
  const res = await api('GET', `/me/bookings/${result.id}`);
  if (!res.ok) {
    message.textContent = errorText(res);
    return;
  }
  content.append(bookingCard(res.data, { owner: false, reload: redraw, message }));
}

function currentPosition() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (position) => resolve({ latitude: position.coords.latitude, longitude: position.coords.longitude }),
      () => resolve(null),
      { timeout: 5000 },
    );
  });
}

function isAdmin(user) {
  return user.roles.some((role) => ADMIN_ROLE_SLUGS.includes(role.slug));
}

function permissionChecker(user) {
  const isSuper = user.roles.some((role) => role.slug === SUPER_ADMIN_SLUG);
  const granted = new Set(user.roles.flatMap((role) => role.permissions.map((p) => p.name)));
  return (needed) => isSuper || needed.some((name) => granted.has(name));
}

function adminRequest(action, item, note) {
  const path = action.path(item);
  if (action.body === 'note' && action.encoding === 'form') return api(action.method, path, { form: formOf({ [action.field]: note }) });
  if (action.body === 'note') return api(action.method, path, { json: { [action.field]: note } });
  if (action.body === 'form') return api(action.method, path, { form: new FormData() });
  if (action.body === 'json') return api(action.method, path, { json: action.json(item) });
  return api(action.method, path);
}

async function fetchBlob(path) {
  const headers = store.access ? { Authorization: `Bearer ${store.access}` } : {};
  try {
    const res = await fetch(store.base + path, { headers });
    logCall('GET', path, res.status, res.ok ? '(file)' : await res.text());
    return res.ok ? await res.blob() : null;
  } catch (error) {
    logCall('GET', path, 0, error.message);
    return null;
  }
}

async function downloadFile(path, filename) {
  const blob = await fetchBlob(path);
  if (!blob) return false;
  const url = URL.createObjectURL(blob);
  if (filename) {
    const link = h('a', { href: url, download: filename });
    link.click();
  } else {
    window.open(url, '_blank');
  }
  return true;
}

function adminCard(entry, item, can, reload) {
  const title = entry.title ? entry.title(item) : item.name || item.title || item.key || item.slug || item.id;
  const subtitle = entry.subtitle ? entry.subtitle(item) : item.description || '';
  const message = h('div', { className: 'err' });
  const actions = h('div', { className: 'row wrap', style: 'margin-top:8px' });
  const noteBox = h('div', { className: 'stack' });
  const send = async (action, note) => {
    message.textContent = '';
    const res = await adminRequest(action, item, note);
    if (!res.ok) {
      message.textContent = errorText(res);
      return;
    }
    reload();
  };
  (entry.actions || []).filter((a) => can(a.perm) && (!a.when || a.when(item))).forEach((action) => {
    actions.append(h('button', {
      type: 'button',
      textContent: action.label,
      onclick: () => {
        if (action.form) {
          adminFormScreen(entry, can, action.form, item);
          return;
        }
        if (action.documents) {
          adminDocumentsScreen(entry, can, item);
          return;
        }
        if (action.body === 'note') {
          const input = h('textarea', { placeholder: 'Reason / note (required)' });
          const confirmButton = h('button', { type: 'button', textContent: `Confirm ${action.label}`, onclick: () => send(action, input.value) });
          noteBox.replaceChildren(input, confirmButton);
          return;
        }
        if (action.confirm && !window.confirm(`${action.label} "${title}"?`)) return;
        send(action);
      },
    }));
  });
  return h('div', { className: 'card' },
    h('strong', { textContent: title }),
    subtitle ? h('div', { className: 'meta', textContent: subtitle }) : '',
    h('details', {}, h('summary', { textContent: 'Raw' }), h('pre', { textContent: JSON.stringify(item, null, 2) })),
    actions, noteBox, message);
}

async function loadAllOptions(path) {
  const options = [];
  let page = 1;
  let pages = 1;
  while (page <= pages) {
    const res = await api('GET', `${path}${path.includes('?') ? '&' : '?'}page=${page}&page_size=${CHECKLIST_PAGE_SIZE}`);
    if (!res.ok) break;
    options.push(...listOf(res.data));
    pages = (res.data && res.data.pages) || 1;
    page += 1;
  }
  return options;
}

function villagePicker(field, given) {
  const chosen = h('input', { type: 'text', value: given ?? '', placeholder: 'Village ID (search below to fill)' });
  const search = h('input', { type: 'text', placeholder: 'Search village name' });
  const results = h('div', {});
  let timer = null;
  search.oninput = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const query = search.value.trim();
      if (!query) {
        results.replaceChildren();
        return;
      }
      const res = await api('GET', `/native-places/search?q=${encodeURIComponent(query)}&limit=${VILLAGE_SEARCH_LIMIT}`);
      if (!res.ok) return;
      results.replaceChildren(...res.data.places.map((place) => h('button', {
        className: 'option',
        type: 'button',
        textContent: `${place.village_name}, ${place.taluk_name}, ${place.district_name}`,
        onclick: () => { chosen.value = place.village_id; results.replaceChildren(); },
      })));
    }, SEARCH_DEBOUNCE_MS);
  };
  return { el: h('div', {}, h('label', { textContent: field.label }), chosen, search, results), read: () => chosen.value.trim() };
}

function fieldInput(field, item) {
  const given = item ? (field.initial ? field.initial(item) : item[field.name]) : undefined;
  const label = h('label', { textContent: field.label });
  if (field.type === 'checklist') {
    const selected = new Set(given || []);
    const list = h('div', { className: 'checklist' }, 'Loading…');
    const boxes = [];
    loadAllOptions(field.optionsPath).then((options) => {
      const locked = new Set(field.lockedSlugs || []);
      const visible = options.filter((option) => !locked.has(option.slug) || selected.has(option.id));
      list.replaceChildren(...visible.map((option) => {
        const box = h('input', { type: 'checkbox', checked: selected.has(option.id), disabled: locked.has(option.slug) });
        boxes.push({ id: option.id, box });
        return h('label', { className: 'check' }, box, ` ${option.name}`);
      }));
    });
    return { el: h('div', {}, label, list), read: () => boxes.filter((b) => b.box.checked).map((b) => b.id) };
  }
  if (field.type === 'file') {
    const input = h('input', { type: 'file', multiple: Boolean(field.multiple) });
    return { el: h('div', {}, label, input), read: () => [...input.files] };
  }
  if (field.type === 'village') return villagePicker(field, given);
  if (field.type === 'choice') {
    const select = h('select', {}, h('option', { value: '', textContent: 'Loading…' }));
    loadAllOptions(field.optionsPath).then((options) => {
      select.replaceChildren(h('option', { value: '', textContent: '—' }), ...options.map((o) => h('option', { value: o.id, textContent: o.name })));
      if (given) select.value = given;
    });
    return { el: h('div', {}, label, select), read: () => select.value };
  }
  const input = field.type === 'select'
    ? h('select', {}, field.options.map((o) => h('option', { value: o, textContent: o || '—' })))
    : field.type === 'textarea'
      ? h('textarea', {})
      : h('input', { type: field.type === 'repeat' ? 'text' : field.type || 'text', step: 'any' });
  if (given != null && given !== '') input.value = given;
  const read = field.type === 'repeat'
    ? () => input.value.split(',').map((part) => part.trim()).filter(Boolean)
    : () => input.value;
  return { el: h('div', {}, label, input), read };
}

function jsonValue(field, value) {
  if (field.type === 'number') return Number(value);
  if (field.bool) return value === 'true';
  return value;
}

function collectBody(spec, inputs) {
  const sendable = inputs.filter((i) => !i.field.pathOnly);
  if (spec.encoding === 'json') {
    const body = {};
    sendable.forEach(({ field, read }) => {
      const value = read();
      if (Array.isArray(value) ? value.length : value !== '') body[field.name] = Array.isArray(value) ? value : jsonValue(field, value);
    });
    return { json: body };
  }
  const form = new FormData();
  sendable.forEach(({ field, read }) => {
    const value = read();
    if (Array.isArray(value)) value.forEach((v) => form.append(field.name, v));
    else if (value !== '') form.append(field.name, value);
  });
  return { form };
}

function adminFormScreen(entry, can, spec, item) {
  const inputs = spec.fields.map((field) => ({ field, ...fieldInput(field, item) }));
  const error = h('div', { className: 'err' });
  const button = h('button', { className: 'primary', type: 'submit', textContent: 'Save' });
  const form = h('form', {}, inputs.map((i) => i.el), button, error);
  form.onsubmit = async (event) => {
    event.preventDefault();
    error.textContent = '';
    const values = Object.fromEntries(inputs.map((i) => [i.field.name, i.read()]));
    const missing = inputs.find((i) => i.field.pathOnly && !values[i.field.name]);
    if (missing) {
      error.textContent = `${missing.field.label} is required`;
      return;
    }
    button.disabled = true;
    const res = await api(spec.method, spec.path(item, values), collectBody(spec, inputs));
    button.disabled = false;
    if (!res.ok) {
      error.textContent = errorText(res);
      return;
    }
    adminEntryScreen(entry, can);
  };
  screenOf(backBar(spec.title, () => adminEntryScreen(entry, can)), form);
}

function adminObjectScreen(entry, can, title, path) {
  const content = h('div', {});
  screenOf(backBar(title, () => adminEntryScreen(entry, can)), content);
  api('GET', path).then((res) => {
    content.append(h('pre', { textContent: res.ok ? JSON.stringify(res.data, null, 2) : errorText(res) }));
  });
}

function adminDocumentsScreen(entry, can, business) {
  const content = h('div', {});
  screenOf(backBar(`Documents: ${business.name}`, () => adminEntryScreen(entry, can)), content);
  const load = async () => {
    content.replaceChildren();
    const res = await api('GET', `/admin/businesses/${business.id}`);
    if (!res.ok) {
      content.append(h('div', { className: 'err', textContent: errorText(res) }));
      return;
    }
    if (!res.data.documents.length) content.append(h('div', { className: 'hint', textContent: 'No documents.' }));
    res.data.documents.forEach((doc) => {
      const message = h('div', { className: 'err' });
      const statusButtons = DOCUMENT_STATUSES.filter((s) => s !== doc.status).map((status) => h('button', {
        type: 'button',
        textContent: `Mark ${status}`,
        onclick: async () => {
          const result = await api('PATCH', `/admin/businesses/${business.id}/documents/${doc.id}`, { json: { status } });
          if (result.ok) load();
          else message.textContent = errorText(result);
        },
      }));
      content.append(h('div', { className: 'card' },
        h('strong', { textContent: `${doc.document_type} — ${doc.file_name}` }),
        h('div', { className: 'meta', textContent: `${doc.status} · ${doc.content_type} · ${doc.file_size_bytes} bytes` }),
        h('div', { className: 'row wrap', style: 'margin-top:8px' },
          h('button', { type: 'button', textContent: 'Open file', onclick: async () => { if (!(await downloadFile(`/admin/businesses/${business.id}/documents/${doc.id}/file`))) message.textContent = 'Could not load the file'; } }),
          statusButtons),
        message));
    });
  };
  load();
}

function toolbarFor(entry, can) {
  return (entry.toolbar || []).filter((t) => can(t.perm)).map((tool) => h('button', {
    className: 'option',
    type: 'button',
    textContent: tool.label,
    onclick: async () => {
      if (tool.form) adminFormScreen(entry, can, tool.form, null);
      else if (tool.show) adminObjectScreen(entry, can, tool.label, tool.show);
      else if (tool.download) await downloadFile(tool.download.path, tool.download.filename);
    },
  }));
}

function adminEntryScreen(entry, can) {
  const content = h('div', {});
  screenOf(backBar(entry.label, adminScreen), ...toolbarFor(entry, can), content);
  if (!entry.path) return;
  const reload = () => {
    content.replaceChildren();
    pagedList(content, entry.path, (item) => adminCard(entry, item, can, reload), { empty: 'Nothing pending.' });
  };
  reload();
}

function adminScreen() {
  const me = session.me;
  const can = permissionChecker(me);
  const sections = ADMIN_SECTIONS.map((section) => h('div', {},
    h('h3', { textContent: section.title, style: 'margin:16px 0 4px' }),
    section.entries.map((entry) => {
      const allowed = can(entry.view);
      return h('button', {
        className: 'option',
        type: 'button',
        disabled: !allowed,
        textContent: allowed ? entry.label : `${entry.label} (no access)`,
        onclick: () => adminEntryScreen(entry, can),
      });
    })));
  const roles = me.roles.map((role) => role.name).join(', ');
  screenOf(
    h('div', { className: 'row' }, h('h2', { textContent: 'Admin panel', style: 'margin:0' }), h('span', { className: 'fit' }, h('button', { type: 'button', textContent: 'Log out', onclick: logout }))),
    h('div', { className: 'meta', textContent: `${me.first_name} ${me.last_name} · ${roles}` }),
    ...sections,
    h('h3', { textContent: 'Delivery', style: 'margin:16px 0 4px' }),
    h('button', {
      className: 'option',
      type: 'button',
      disabled: !can([DELIVERY_TEAM_CREATE_PERMISSION]),
      textContent: can([DELIVERY_TEAM_CREATE_PERMISSION]) ? 'Delivery team' : 'Delivery team (no access)',
      onclick: deliveryTeamScreen,
    }),
  );
}

const MY_POST_STATUS_OPTIONS = ['', 'draft', 'published'];
const MY_POST_FIELDS = POST_FIELDS.map((f) => (f.name === 'status' ? { ...f, options: MY_POST_STATUS_OPTIONS } : f));

function postEditScreen(post, onBack) {
  const inputs = MY_POST_FIELDS.map((field) => ({ field, ...fieldInput(field, post) }));
  const error = h('div', { className: 'err' });
  const button = h('button', { className: 'primary', type: 'submit', textContent: 'Save changes' });
  const el = h('form', {}, inputs.map((i) => i.el), button, error);
  el.onsubmit = async (event) => {
    event.preventDefault();
    error.textContent = '';
    button.disabled = true;
    const res = await api('PATCH', `/posts/${post.id}`, collectBody({ encoding: 'form' }, inputs));
    button.disabled = false;
    if (!res.ok) {
      error.textContent = errorText(res);
      return;
    }
    onBack();
  };
  screenOf(backBar('Edit post', onBack), h('div', { className: 'hint', textContent: 'Only fields you fill in are changed. New images are added to the existing ones.' }), el);
}

function ownPostCard(post, reload, onEditBack = myPostsScreen) {
  const message = h('div', { className: 'err' });
  const editable = post.status !== 'blocked';
  const run = async (request) => {
    message.textContent = '';
    const res = await request();
    if (res.ok) reload();
    else message.textContent = errorText(res);
  };
  const setStatus = (status) => run(() => api('PATCH', `/posts/${post.id}`, { form: formOf({ status }) }));
  const buttons = [];
  if (editable && post.status !== 'published') buttons.push(h('button', { type: 'button', textContent: 'Publish', onclick: () => setStatus('published') }));
  if (editable && post.status === 'published') buttons.push(h('button', { type: 'button', textContent: 'Move to draft', onclick: () => setStatus('draft') }));
  if (editable) buttons.push(h('button', { type: 'button', textContent: 'Edit', onclick: () => postEditScreen(post, onEditBack) }));
  buttons.push(h('button', {
    type: 'button',
    textContent: 'Delete',
    onclick: () => {
      if (window.confirm(`Delete "${post.title || (post.content || '').slice(0, 40) || 'this post'}"?`)) run(() => api('DELETE', `/posts/${post.id}`));
    },
  }));
  const badge = h('div', { className: 'meta', style: 'font-weight:600', textContent: `Status: ${post.status}${post.status === 'blocked' ? ' (blocked by a moderator, not editable)' : ''}${post.community ? ` · in ${post.community.name}` : ''}` });
  return h('div', {}, badge, postCard(post, reload), h('div', { className: 'row wrap', style: 'margin-top:6px' }, buttons), message);
}

function myPostsScreen() {
  const content = h('div', {});
  screenOf(backBar('My posts', () => homeScreen('profile')), content);
  const reload = () => {
    content.replaceChildren();
    pagedList(content, `/posts?user_id=${session.me.id}`, (post) => ownPostCard(post, reload), { empty: 'You have not created any posts yet.' });
  };
  reload();
}

async function route() {
  const res = await api('GET', '/auth/me');
  if (!res.ok) {
    clearSession();
    welcome();
    return;
  }
  const user = res.data;
  session.me = user;
  realtimeConnect();
  resumePush();
  if (isAdmin(user)) return adminScreen();
  if (isDeliveryTeamMember(user)) return courierScreen();
  if (!user.date_of_birth && !session.skipProfile) return profileScreen();
  if (user.account_role && !user.account_role.selection_completed) return roleScreen();
  if (!(user.native_places || []).length && !session.skipNative) return nativeScreen();
  return homeScreen();
}

const baseInput = document.getElementById('base');
baseInput.value = store.base;
baseInput.onchange = () => {
  store.base = baseInput.value.trim().replace(/\/$/, '');
  persist();
  realtimeDisconnect();
  realtimeConnect();
};
document.getElementById('ws-ping').onclick = () => {
  realtime.logPong = true;
  if (!sendSocket({ type: 'ping' })) {
    realtime.logPong = false;
    setWsStatus('not connected', true);
  }
};
document.getElementById('ws-toggle').onclick = () => {
  const socket = realtime.socket;
  const live = socket && (socket.readyState === WS_CONNECTING || socket.readyState === WS_OPEN);
  if (live) realtimeDisconnect();
  else realtimeConnect();
};
document.getElementById('restart').onclick = () => {
  clearSession();
  welcome();
};

const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/13.1.0';
const push = { messaging: null, registration: null, token: '' };

function setPushStatus(text, bad = false) {
  const el = document.getElementById('push-status');
  el.textContent = `Push: ${text}`;
  el.className = bad ? 'bad' : '';
  document.getElementById('push-toggle').textContent = push.token ? 'Disable' : 'Enable';
}

async function servedPushConfig() {
  const res = await api('GET', '/me/devices/web-config');
  if (!res.ok || !res.data.enabled) return null;
  return { config: res.data.firebase_config, vapid: res.data.vapid_key };
}

async function enablePush({ interactive }) {
  if (!store.access) return setPushStatus('log in first', true);
  if (!('serviceWorker' in navigator) || !('Notification' in window)) return setPushStatus('not supported in this browser', true);
  const served = await servedPushConfig();
  if (!served) return setPushStatus('not configured on the server (FCM_WEB_* in .env)', true);
  try {
    const { config, vapid } = served;
    const permission = interactive ? await Notification.requestPermission() : Notification.permission;
    if (permission !== 'granted') return setPushStatus(`permission ${permission}`, true);
    const { initializeApp, getApps } = await import(`${FIREBASE_SDK}/firebase-app.js`);
    const { getMessaging, getToken, onMessage } = await import(`${FIREBASE_SDK}/firebase-messaging.js`);
    push.registration = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
    await navigator.serviceWorker.ready;
    push.messaging = getMessaging(getApps()[0] || initializeApp(config));
    push.token = await getToken(push.messaging, { vapidKey: vapid, serviceWorkerRegistration: push.registration });
    if (!push.token) return setPushStatus('no token from Firebase', true);
    const res = await api('POST', '/me/devices', { json: { token: push.token, platform: 'web' } });
    if (!res.ok) {
      push.token = '';
      return setPushStatus(`API refused (${res.status})`, true);
    }
    store.pushOn = true;
    persist();
    navigator.serviceWorker.onmessage = (event) => {
      if (!event.data || event.data.type !== 'is-chat-open') return;
      event.ports[0].postMessage(event.data.senderId === realtime.openChatPartnerId);
    };
    onMessage(push.messaging, (payload) => {
      logEntry('PUSH (page in foreground)', payload);
      const data = payload.data || {};
      if (document.visibilityState === 'visible' && data.type === 'direct_message' && data.sender_id === realtime.openChatPartnerId) return;
      const note = payload.notification || {};
      push.registration.showNotification(note.title || 'Native Life', { body: note.body || '', data: payload.data });
    });
    setPushStatus('on - this browser is registered');
  } catch (error) {
    push.token = '';
    setPushStatus(error.message, true);
  }
}

async function disablePush() {
  if (push.token) await api('DELETE', '/me/devices', { json: { token: push.token } });
  if (push.messaging) {
    const { deleteToken } = await import(`${FIREBASE_SDK}/firebase-messaging.js`);
    await deleteToken(push.messaging).catch(() => {});
  }
  push.token = '';
  store.pushOn = false;
  persist();
  setPushStatus('off');
}

function resumePush() {
  if (store.pushOn && !push.token) enablePush({ interactive: false });
}

document.getElementById('push-toggle').onclick = () => (push.token ? disablePush() : enablePush({ interactive: true }));

const paymentReturn = readPaymentReturn();
if (store.access) route().then(() => { if (paymentReturn) paymentResultScreen(paymentReturn); });
else welcome();
</script>
