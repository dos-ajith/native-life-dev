<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Native Life — Flow Tester</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px system-ui, sans-serif; display: grid; grid-template-columns: 420px 1fr; height: 100vh; }
  #phone { border-right: 1px solid #ccc; display: flex; flex-direction: column; min-height: 0; }
  #topbar { padding: 8px 12px; border-bottom: 1px solid #ccc; display: flex; gap: 6px; align-items: center; }
  #topbar input { flex: 1; }
  #wsbar { padding: 6px 12px; border-bottom: 1px solid #ccc; display: flex; gap: 6px; align-items: center; font-size: 12px; }
  #ws-status { flex: 1; font-family: ui-monospace, Consolas, monospace; }
  #ws-status.bad { color: #b00020; }
  #pushbar { padding: 6px 12px; border-bottom: 1px solid #ccc; display: flex; gap: 6px; align-items: center; font-size: 12px; }
  #push-status { flex: 1; font-family: ui-monospace, Consolas, monospace; }
  #push-status.bad { color: #b00020; }
  details.entry.ws { background: #f1f6ff; }
  #screen { flex: 1; overflow: auto; padding: 16px; }
  #log { overflow: auto; padding: 12px; min-height: 0; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  label { display: block; margin: 8px 0 2px; font-size: 12px; color: #555; }
  input[type=text], input[type=password], input[type=email], input[type=date], textarea, select { width: 100%; padding: 8px; border: 1px solid #bbb; font: inherit; }
  textarea { min-height: 70px; }
  button { padding: 8px 12px; font: inherit; cursor: pointer; }
  button.primary { width: 100%; margin-top: 12px; }
  button.link { background: none; border: 0; text-decoration: underline; padding: 4px 0; }
  .stack > * + * { margin-top: 8px; }
  .err { color: #b00020; margin-top: 8px; white-space: pre-wrap; }
  .ok { color: #1b6e2d; margin-top: 8px; }
  .hint { color: #666; font-size: 12px; margin-top: 8px; }
  .card { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
  .card .meta { color: #666; font-size: 12px; }
  .card img { max-width: 100%; max-height: 220px; display: block; margin-top: 6px; }
  .assistant-fab { position: fixed; left: 270px; bottom: 90px; z-index: 5; background: #1f4d2b; color: #fff; border: 0; border-radius: 20px; padding: 10px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .chip-btn { padding: 4px 12px; }
  .tab-btn { padding: 10px; }
  .tab-btn.active { background: #1f4d2b; color: #fff; font-weight: 700; }
  .card img.thumb { width: 84px; height: 84px; object-fit: cover; margin-top: 0; }
  .chip-btn.active { background: #ddd; font-weight: 700; border-color: #555; }
  .react { padding: 4px 10px; }
  .react.active { background: #ddd; font-weight: 700; border-color: #555; }
  .slider-wrap { position: relative; margin-top: 6px; }
  .slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-top: 6px; }
  .slider-wrap .slider { margin-top: 0; }
  .slider::-webkit-scrollbar { display: none; }
  .slider img { flex: 0 0 100%; width: 100%; height: 220px; object-fit: cover; scroll-snap-align: start; margin-top: 0; }
  .slide-btn { position: absolute; top: 50%; transform: translateY(-50%); padding: 4px 10px; font-size: 18px; }
  .slide-btn.prev { left: 6px; }
  .slide-btn.next { right: 6px; }
  .counter { position: absolute; top: 6px; right: 6px; padding: 2px 8px; background: #fff; border: 1px solid #ccc; font-size: 12px; }
  .checklist { max-height: 220px; overflow: auto; border: 1px solid #bbb; padding: 6px; }
  .check { display: block; margin: 0; font-size: 13px; color: #000; }
  .option { display: block; width: 100%; text-align: left; margin-top: 6px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  .row > .fit { flex: none; }
  .row.wrap { flex-wrap: wrap; }
  .row.wrap > * { flex: none; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; display: block; }
  .chip { text-align: left; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tile { padding: 12px 2px; font-size: 12px; }
  .nav { position: sticky; bottom: -16px; margin: 16px -16px -16px; padding: 8px; display: flex; gap: 4px; background: #fff; border-top: 1px solid #ccc; }
  .nav > * { flex: 1; }
  .nav .active { font-weight: 700; background: #ddd; }
  .nav .fab { flex: none; width: 44px; font-size: 20px; }
  details.entry { border-bottom: 1px solid #ddd; padding: 4px 0; }
  details.entry summary { cursor: pointer; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  details.entry.bad summary { color: #b00020; }
  pre { margin: 4px 0; padding: 8px; background: #f4f4f4; overflow: auto; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<section id="phone">
  <div id="topbar">
    <input id="base" type="text" aria-label="Base URL">
    <button id="restart" type="button">Restart</button>
  </div>
  <div id="wsbar">
    <span id="ws-status">WS: disconnected</span>
    <button id="ws-ping" type="button">Ping</button>
    <button id="ws-toggle" type="button">Connect / Disconnect</button>
  </div>
  <div id="pushbar">
    <span id="push-status">Push: off</span>
    <button id="push-toggle" type="button">Enable</button>
  </div>
  <div id="screen"></div>
</section>
<section id="log"></section>
<script>
const DEFAULT_BASE = 'http://127.0.0.1:8000/api/v1';
const STORE = 'flow-tester';
const LOG_LIMIT = 40;
const PAGE_SIZE = 10;
const SEARCH_DEBOUNCE_MS = 300;
const GENDERS = ['', 'male', 'female', 'other'];

const store = { base: DEFAULT_BASE, access: '', refresh: '', email: '', pushOn: false, ...JSON.parse(localStorage.getItem(STORE) || '{}') };
const session = { me: null, skipProfile: false, skipNative: false };

function persist() {
  localStorage.setItem(STORE, JSON.stringify(store));
}

function h(tag, props = {}, ...children) {
  const el = document.createElement(tag);
  Object.assign(el, props);
  children.flat().forEach((c) => c != null && el.append(c));
  return el;
}

function mediaUrl(path) {
  return /^https?:\/\//.test(path) ? path : new URL(path, store.base).origin + path;
}

function privateImage(path) {
  const image = h('img', { alt: '' });
  const headers = store.access ? { Authorization: `Bearer ${store.access}` } : {};
  fetch(store.base + path.replace(/^\/api\/v1/, ''), { headers })
    .then((res) => (res.ok ? res.blob() : null))
    .then((blob) => {
      if (blob) image.src = URL.createObjectURL(blob);
    })
    .catch(() => {});
  return image;
}

function logEntry(summary, body, { bad = false, socket = false } = {}) {
  const log = document.getElementById('log');
  const entry = h('details', { className: `entry${bad ? ' bad' : ''}${socket ? ' ws' : ''}`, open: true },
    h('summary', { textContent: summary }),
    h('pre', { textContent: typeof body === 'string' ? body : JSON.stringify(body, null, 2) }));
  log.prepend(entry);
  [...log.children].slice(LOG_LIMIT).forEach((el) => el.remove());
  [...log.children].slice(1).forEach((el) => { el.open = false; });
}

function logCall(method, path, status, body) {
  const bad = !(status >= 200 && status < 300);
  logEntry(`${method} ${path} → ${status || 'network error'}`, body, { bad });
}

const WS_PING_INTERVAL_MS = 20000;
const WS_RETRY_DELAY_MS = 3000;
const WS_NO_RETRY_CODES = [4403, 4429];
const WS_UNAUTHENTICATED_CODE = 4401;
const WS_NORMAL_CLOSE_CODE = 1000;
const WS_CONNECTING = 0;
const WS_OPEN = 1;
const realtime = { openChatPartnerId: null, socket: null, pingTimer: null, retryTimer: null, manual: false, logPong: false, refreshers: [], onEvent: null };

function wsUrl() {
  return `${store.base.replace(/^http/, 'ws')}/ws`;
}

function setWsStatus(text, bad = false) {
  const el = document.getElementById('ws-status');
  el.textContent = `WS: ${text}`;
  el.className = bad ? 'bad' : '';
}

function logSocket(direction, label, body, bad = false) {
  logEntry(`WS ${direction} ${label}`, body, { bad, socket: true });
}

function stopPing() {
  clearInterval(realtime.pingTimer);
  realtime.pingTimer = null;
}

function sendSocket(message, { quiet = false } = {}) {
  const socket = realtime.socket;
  if (!socket || socket.readyState !== WS_OPEN) return false;
  socket.send(JSON.stringify(message));
  if (!quiet) logSocket('→', message.type, message);
  return true;
}

function handleSocketMessage(data) {
  if (data.type === 'auth.ok') {
    setWsStatus('connected');
    stopPing();
    realtime.pingTimer = setInterval(() => sendSocket({ type: 'ping' }, { quiet: true }), WS_PING_INTERVAL_MS);
    return;
  }
  if (data.type === 'pong') {
    if (realtime.logPong) logSocket('←', 'pong', data);
    realtime.logPong = false;
    return;
  }
  logSocket('←', data.type || 'message', data);
  setWsStatus(`connected · last: ${data.type}`);
  if (/^(notification|follow_request)\./.test(String(data.type))) realtime.refreshers.forEach((refresh) => refresh());
  if (realtime.onEvent) realtime.onEvent(data);
}

async function handleSocketClose(event) {
  stopPing();
  setWsStatus(`closed ${event.code}${event.reason ? ` ${event.reason}` : ''}`, true);
  logSocket('✕', `closed ${event.code}`, event.reason || '(no reason)', true);
  if (realtime.manual || !store.access) return;
  if (event.code === WS_UNAUTHENTICATED_CODE) {
    if (await refreshTokens()) realtimeConnect();
    return;
  }
  if (WS_NO_RETRY_CODES.includes(event.code)) return;
  realtime.retryTimer = setTimeout(realtimeConnect, WS_RETRY_DELAY_MS);
}

function realtimeConnect() {
  clearTimeout(realtime.retryTimer);
  if (!store.access) return;
  const current = realtime.socket;
  if (current && (current.readyState === WS_CONNECTING || current.readyState === WS_OPEN)) return;
  realtime.manual = false;
  setWsStatus('connecting…');
  const socket = new WebSocket(wsUrl());
  realtime.socket = socket;
  socket.onopen = () => {
    socket.send(JSON.stringify({ type: 'auth', token: store.access }));
    logSocket('→', 'auth', { type: 'auth', token: '(hidden)' });
  };
  socket.onmessage = (event) => {
    let data;
    try {
      data = JSON.parse(event.data);
    } catch (error) {
      data = { type: 'raw', data: event.data };
    }
    handleSocketMessage(data);
  };
  socket.onerror = () => logSocket('!', 'connection error', `Could not reach ${wsUrl()}`, true);
  socket.onclose = (event) => {
    if (socket === realtime.socket) handleSocketClose(event);
  };
}

function realtimeDisconnect() {
  realtime.manual = true;
  clearTimeout(realtime.retryTimer);
  stopPing();
  if (realtime.socket) realtime.socket.close(WS_NORMAL_CLOSE_CODE);
  realtime.socket = null;
  setWsStatus('disconnected');
}

async function api(method, path, { json, form, auth = true } = {}, retry = true) {
  const headers = {};
  if (auth && store.access) headers.Authorization = `Bearer ${store.access}`;
  let body;
  if (json !== undefined) {
    headers['Content-Type'] = 'application/json';
    body = JSON.stringify(json);
  } else if (form) {
    body = form;
  }
  let res;
  try {
    res = await fetch(store.base + path, { method, headers, body });
  } catch (error) {
    const message = `${error.message} — is the API running, and is ${location.origin} in CORS_ORIGINS?`;
    logCall(method, path, 0, message);
    return { ok: false, status: 0, message, data: null, errors: [] };
  }
  const text = await res.text();
  let parsed = null;
  try {
    parsed = JSON.parse(text);
  } catch (error) {
    parsed = null;
  }
  logCall(method, path, res.status, parsed ?? text);
  if (res.status === 401 && auth && retry && store.refresh && await refreshTokens()) {
    return api(method, path, { json, form, auth }, false);
  }
  return {
    ok: res.ok,
    status: res.status,
    message: parsed?.message || res.statusText,
    data: parsed?.data ?? null,
    errors: parsed?.errors || [],
  };
}

async function refreshTokens() {
  const res = await api('POST', '/auth/refresh', { json: { refresh_token: store.refresh }, auth: false }, false);
  if (!res.ok) return false;
  saveTokens(res.data);
  return true;
}

function saveTokens(data) {
  store.access = data.access_token;
  store.refresh = data.refresh_token;
  persist();
}

function clearSession() {
  realtimeDisconnect();
  store.access = '';
  store.refresh = '';
  persist();
  session.me = null;
  session.skipProfile = false;
  session.skipNative = false;
}

function errorText(res) {
  const detail = res.errors.length ? `\n${JSON.stringify(res.errors, null, 2)}` : '';
  return `${res.status || ''} ${res.message}${detail}`.trim();
}

function formOf(values) {
  const form = new FormData();
  Object.entries(values).forEach(([key, value]) => {
    if (value !== '' && value != null) form.append(key, value);
  });
  return form;
}

function field(label, type = 'text', value = '') {
  const input = type === 'select'
    ? h('select', {}, GENDERS.map((g) => h('option', { value: g, textContent: g || '—' })))
    : h('input', { type, value });
  return { input, el: h('div', {}, h('label', { textContent: label }), input) };
}

function screenOf(...nodes) {
  realtime.onEvent = null;
  realtime.openChatPartnerId = null;
  document.getElementById('screen').replaceChildren(...nodes);
}

function form(fields, label, onSubmit, extras = []) {
  const error = h('div', { className: 'err' });
  const button = h('button', { className: 'primary', type: 'submit', textContent: label });
  const el = h('form', {}, fields.map((f) => f.el), button, error, extras);
  el.onsubmit = async (event) => {
    event.preventDefault();
    error.textContent = '';
    button.disabled = true;
    const message = await onSubmit();
    button.disabled = false;
    if (message) error.textContent = message;
  };
  return el;
}

function linkButton(text, onClick) {
  return h('button', { className: 'link', type: 'button', textContent: text, onclick: onClick });
}

function welcome() {
  screenOf(
    h('h2', { textContent: 'Native Life' }),
    h('div', { className: 'stack' },
      h('button', { className: 'primary', textContent: 'Log in with email', onclick: loginScreen }),
      h('button', { className: 'primary', textContent: 'Register with email', onclick: registerScreen }),
      h('button', { className: 'primary', textContent: 'Continue with phone', onclick: () => phoneScreen('number') }),
    ),
  );
}

function registerScreen() {
  const first = field('First name');
  const last = field('Last name');
  const email = field('Email', 'email', store.email);
  const password = field('Password', 'password');
  const gender = field('Gender (optional)', 'select');
  const dob = field('Date of birth (optional)', 'date');
  screenOf(h('h2', { textContent: 'Create account' }), form(
    [first, last, email, password, gender, dob],
    'Register',
    async () => {
      const res = await api('POST', '/users/register', {
        auth: false,
        form: formOf({
          first_name: first.input.value,
          last_name: last.input.value,
          email: email.input.value,
          password: password.input.value,
          gender: gender.input.value,
          date_of_birth: dob.input.value,
        }),
      });
      if (!res.ok) return errorText(res);
      store.email = email.input.value;
      persist();
      verifyScreen(store.email);
      return '';
    },
    [linkButton('Back', welcome)],
  ));
}

function verifyScreen(emailValue) {
  const email = field('Email', 'email', emailValue);
  const otp = field('Verification code');
  const status = h('div', { className: 'ok' });
  const resend = linkButton('Resend code', async () => {
    const res = await api('POST', '/auth/resend-email-verification', { auth: false, json: { email: email.input.value } });
    status.className = res.ok ? 'ok' : 'err';
    status.textContent = res.ok ? res.message : errorText(res);
  });
  screenOf(h('h2', { textContent: 'Verify your email' }), h('div', { className: 'hint', textContent: 'Enter the code sent to your inbox.' }), form(
    [email, otp],
    'Verify',
    async () => {
      const res = await api('POST', '/auth/verify-email', { auth: false, json: { email: email.input.value, otp: otp.input.value } });
      if (!res.ok) return errorText(res);
      store.email = email.input.value;
      persist();
      loginScreen();
      return '';
    },
    [resend, status],
  ));
}

function loginScreen() {
  const email = field('Email', 'email', store.email);
  const password = field('Password', 'password');
  screenOf(h('h2', { textContent: 'Log in' }), form(
    [email, password],
    'Log in',
    async () => {
      const res = await api('POST', '/auth/login', { auth: false, json: { email: email.input.value, password: password.input.value } });
      if (!res.ok) return errorText(res);
      store.email = email.input.value;
      saveTokens(res.data);
      await route();
      return '';
    },
    [h('div', {}, linkButton('Verify email', () => verifyScreen(email.input.value))), linkButton('Back', welcome)],
  ));
}

function phoneScreen(step, context = {}) {
  if (step === 'number') {
    const phone = field('Phone number (+91…)', 'text', context.phone || '');
    screenOf(h('h2', { textContent: 'Continue with phone' }), form(
      [phone],
      'Send code',
      async () => {
        const res = await api('POST', '/auth/phone/request-otp', { auth: false, json: { phone: phone.input.value } });
        if (!res.ok) return errorText(res);
        phoneScreen('otp', { phone: phone.input.value });
        return '';
      },
      [linkButton('Back', welcome)],
    ));
    return;
  }
  if (step === 'otp') {
    const otp = field('Code');
    screenOf(h('h2', { textContent: 'Enter the code' }), h('div', { className: 'hint', textContent: `Sent to ${context.phone}. With SMS_PROVIDER=console, read it from the API log.` }), form(
      [otp],
      'Verify',
      async () => {
        const res = await api('POST', '/auth/phone/verify-otp', { auth: false, json: { phone: context.phone, otp: otp.input.value } });
        if (!res.ok) return errorText(res);
        if (res.data.access_token) {
          saveTokens(res.data);
          await route();
        } else {
          phoneScreen('register', { ...context, registrationToken: res.data.registration_token });
        }
        return '';
      },
      [linkButton('Change number', () => phoneScreen('number', context))],
    ));
    return;
  }
  const first = field('First name');
  const last = field('Last name');
  const gender = field('Gender (optional)', 'select');
  const dob = field('Date of birth (optional)', 'date');
  const terms = h('input', { type: 'checkbox' });
  const termsRow = { el: h('label', {}, terms, ' I accept the terms') };
  screenOf(h('h2', { textContent: 'New here? Tell us about you' }), form(
    [first, last, gender, dob, termsRow],
    'Create account',
    async () => {
      const json = {
        registration_token: context.registrationToken,
        first_name: first.input.value,
        last_name: last.input.value,
        accept_terms: terms.checked,
      };
      if (gender.input.value) json.gender = gender.input.value;
      if (dob.input.value) json.date_of_birth = dob.input.value;
      const res = await api('POST', '/auth/phone/register', { auth: false, json });
      if (!res.ok) return errorText(res);
      saveTokens(res.data);
      await route();
      return '';
    },
  ));
}

function profileScreen() {
  const me = session.me;
  const first = field('First name', 'text', me.first_name);
  const last = field('Last name', 'text', me.last_name);
  const gender = field('Gender', 'select');
  gender.input.value = me.gender || '';
  const dob = field('Date of birth', 'date', me.date_of_birth || '');
  screenOf(h('h2', { textContent: 'Set up your profile' }), form(
    [first, last, gender, dob],
    'Continue',
    async () => {
      const res = await api('PATCH', '/users/me', {
        form: formOf({
          first_name: first.input.value,
          last_name: last.input.value,
          gender: gender.input.value,
          date_of_birth: dob.input.value,
        }),
      });
      if (!res.ok) return errorText(res);
      await route();
      return '';
    },
    [linkButton('Skip', () => { session.skipProfile = true; route(); })],
  ));
}

async function finishRoleChange(fromProfile) {
  if (!fromProfile) {
    await route();
    return;
  }
  const res = await api('GET', '/auth/me');
  if (res.ok) session.me = res.data;
  homeScreen('profile');
}

function verificationScreen(role, fromProfile, requestId) {
  const input = h('input', { type: 'file', accept: 'image/*,application/pdf' });
  const fileField = { el: h('div', {}, h('label', { textContent: 'Verification document (JPEG, PNG, WebP or PDF, max 10MB)' }), input) };
  screenOf(
    h('h2', { textContent: `Verify your ${role.name} account` }),
    h('div', { className: 'hint', textContent: 'Your role is selected and waiting for review. Attach a document so a reviewer can approve it.' }),
    form(
      [fileField],
      'Submit for review',
      async () => {
        if (!input.files[0]) return 'Choose a file, or skip for now.';
        const path = requestId ? `/upgrade-requests/${requestId}/documents` : '/users/me/account-role/verification';
        const res = await api('POST', path, { form: formOf({ document: input.files[0] }) });
        if (!res.ok) return errorText(res);
        await finishRoleChange(fromProfile);
        return '';
      },
      [linkButton('Skip for now', () => finishRoleChange(fromProfile))],
    ),
  );
}

async function roleScreen(fromProfile = false) {
  const list = h('div', {}, 'Loading…');
  const error = h('div', { className: 'err' });
  const current = session.me && session.me.account_role;
  const status = current && current.selected_at
    ? h('div', { className: 'card' },
      h('strong', { textContent: `Current role: ${current.name}` }),
      h('div', { className: 'meta', textContent: `Verification: ${current.verification_status}` }),
      current.requires_verification && current.verification_status !== 'verified'
        ? h('button', {
          type: 'button',
          textContent: 'Submit verification document',
          onclick: () => verificationScreen(current, fromProfile, current.verification_status === 'pending' ? current.verification_request_id : null),
        })
        : '')
    : '';
  screenOf(
    h('h2', { textContent: fromProfile ? 'Change account role' : 'How will you use Native Life?' }),
    status,
    list,
    error,
    fromProfile ? linkButton('Back', () => homeScreen('profile')) : '',
  );
  const res = await api('GET', '/account-roles');
  if (!res.ok) {
    list.textContent = '';
    error.textContent = errorText(res);
    return;
  }
  list.replaceChildren(...res.data.map((role) => h('button', {
    className: 'option',
    type: 'button',

function nativeScreen(canCancel = false) {
  const query = field('Search your village');
  const results = h('div', {});
  const error = h('div', { className: 'err' });
  let timer = null;
  const search = async () => {
    const text = query.input.value.trim();
    if (!text) {
      results.replaceChildren();
      return;
    }
    const res = await api('GET', `/native-places/search?q=${encodeURIComponent(text)}&limit=10`);
    if (!res.ok) {
      error.textContent = errorText(res);
      return;
    }
    error.textContent = '';
    results.replaceChildren(...res.data.places.map((place) => h('button', {
      className: 'option',
      type: 'button',
      textContent: `${place.village_name}, ${place.taluk_name}, ${place.district_name}`,
      onclick: async () => {
        const result = await api('PUT', '/users/me/native-places/primary', { json: { village_id: place.village_id } });
        if (!result.ok) {
          error.textContent = errorText(result);
          return;
        }
        await route();
      },
    })));
  };
  query.input.oninput = () => {
    clearTimeout(timer);
    timer = setTimeout(search, SEARCH_DEBOUNCE_MS);
  };
  screenOf(
    h('h2', { textContent: 'Choose your native place' }),
    query.el,
    results,
    error,
    canCancel
      ? linkButton('Cancel', () => homeScreen(shell.tab))
      : linkButton('Skip', () => { session.skipNative = true; route(); }),
  );
}

function formatDate(value) {
  if (!value) return '';
  const parsed = new Date(value);
  return Number.isNaN(parsed.getTime()) ? value : parsed.toLocaleString();
}

function imageOf(images) {
  const first = (images || [])[0];
  const path = first && (first.file_url || first.url || first.image_url);
  return path ? h('img', { src: mediaUrl(path), alt: '' }) : '';
}

function listOf(data) {
  if (Array.isArray(data)) return data;
  return (data && (data.items || data.places)) || [];
}

async function pagedList(container, path, renderItem, { pageSize = PAGE_SIZE, paged = true, empty = 'Nothing here yet.' } = {}) {
  const items = h('div', {});
  const more = h('button', { type: 'button', textContent: 'Load more', hidden: true });
  container.append(items, more);
  let page = 1;
  const joiner = path.includes('?') ? '&' : '?';
  const load = async () => {
    const res = await api('GET', `${path}${joiner}page=${page}&page_size=${pageSize}`);
    if (!res.ok) {
      items.append(h('div', { className: 'err', textContent: errorText(res) }));
      return;
    }
    const list = listOf(res.data);
    list.forEach((item) => items.append(renderItem(item)));
    if (!list.length && page === 1) items.append(h('div', { className: 'hint', textContent: empty }));
    more.hidden = !(paged && res.data && res.data.page < res.data.pages);
  };
  more.onclick = () => { page += 1; load(); };
  await load();
}

function commentsBox(post) {
  const list = h('div', {});
  const input = h('input', { type: 'text', placeholder: 'Write a comment' });
  const error = h('div', { className: 'err' });
  const draw = (items, depth = 0) => items.forEach((c) => {
    const line = userLink(c.author.id, c.author.name, ` · ${c.created_at_relative}: ${c.content}`);
    line.style.margin = `4px 0 0 ${depth * 14}px`;
    list.append(line);
    draw(c.replies || [], depth + 1);
  });
  const load = async () => {
    const res = await api('GET', `/posts/${post.id}/comments?page=1&page_size=20`);
    list.replaceChildren();
    if (res.ok) draw(res.data.items);
  };
  const form = h('form', { className: 'row' }, input, h('button', { className: 'fit', type: 'submit', textContent: 'Send' }));
  form.onsubmit = async (event) => {
    event.preventDefault();
    if (!input.value.trim()) return;
    const res = await api('POST', `/posts/${post.id}/comments`, { json: { content: input.value } });
    if (!res.ok) {
      error.textContent = errorText(res);
      return;
    }
    input.value = '';
    error.textContent = '';
    load();
  };
  load();
  return h('div', { className: 'stack' }, list, form, error);
}

function mediaSlider(images) {
  if (!images.length) return '';
  const track = h('div', { className: 'slider' }, images.map((m) => h('img', { src: mediaUrl(m.file_url), alt: '' })));
  if (images.length === 1) return track;
  const counter = h('span', { className: 'counter', textContent: `1 / ${images.length}` });
  const go = (step) => track.scrollBy({ left: step * track.clientWidth, behavior: 'smooth' });
  track.onscroll = () => {
    counter.textContent = `${Math.round(track.scrollLeft / track.clientWidth) + 1} / ${images.length}`;
  };
  return h('div', { className: 'slider-wrap' }, track,
    h('button', { className: 'slide-btn prev', type: 'button', textContent: '‹', onclick: () => go(-1) }),
    h('button', { className: 'slide-btn next', type: 'button', textContent: '›', onclick: () => go(1) }),
    counter);
}

const REACTIONS = [['like', '👍'], ['love', '❤️'], ['laugh', '😂'], ['wow', '😮']];

function reactionRow(initialPost) {
  const row = h('div', { className: 'row wrap', style: 'margin-top:8px' });
  const message = h('span', { className: 'err' });
  const draw = (post) => {
    const buttons = REACTIONS.map(([type, emoji]) => {
      const active = post.my_reaction === type;
      return h('button', {
        type: 'button',
        className: `react${active ? ' active' : ''}`,
        title: active ? `Remove ${type}` : type,
        textContent: `${emoji} ${(post.reaction_counts || {})[type] || 0}`,
        onclick: async () => {
          message.textContent = '';
          const res = await (active
            ? api('DELETE', `/posts/${post.id}/reactions`)
            : api('PUT', `/posts/${post.id}/reactions`, { json: { reaction_type: type } }));
          if (!res.ok) {
            message.textContent = errorText(res);
            return;
          }
          const fresh = await api('GET', `/posts/${post.slug}`);
          if (fresh.ok) draw(fresh.data);
        },
      });
    });
    row.replaceChildren(...buttons, message);
  };
  draw(initialPost);
  return row;
}

function userLink(id, name, suffix = '') {

    suffix);

async function userProfileScreen(userId, onBack = () => homeScreen(shell.tab)) {
  const content = h('div', {});
  screenOf(backBar('Profile', onBack), content);
  const res = await api('GET', `/users/${userId}/profile`);
  if (!res.ok) {
    content.append(h('div', { className: 'err', textContent: errorText(res) }));
    return;
  }
  const profile = res.data;
  const isMe = session.me && session.me.id === profile.id;
  const message = h('div', { className: 'err' });
  const followLabel = profile.is_following ? 'Unfollow' : (profile.follow_status === 'pending' ? 'Requested (cancel)' : 'Follow');
  const follow = isMe ? '' : h('button', {
    className: 'primary',
    type: 'button',
    textContent: followLabel,
    onclick: async () => {
      const request = await api(profile.is_following || profile.follow_status === 'pending' ? 'DELETE' : 'POST', `/users/${profile.id}/follow`);
      if (request.ok) userProfileScreen(userId, onBack);
      else message.textContent = errorText(request);
    },
  });
  const blockedList = isMe ? null : await api('GET', '/me/blocked-users?page=1&page_size=100');
  const isBlocked = Boolean(blockedList && blockedList.ok && listOf(blockedList.data).some((user) => user.id === profile.id));
  const messageButton = isMe ? '' : h('button', {
    type: 'button',
    textContent: 'Message',
    onclick: () => directChatScreen({ id: profile.id, name: profile.name }, () => userProfileScreen(userId, onBack)),
  });
  const blockButton = isMe ? '' : h('button', {
    type: 'button',
    textContent: isBlocked ? 'Unblock' : 'Block',
    onclick: async () => {
      if (!isBlocked && !window.confirm(`Block ${profile.name}? Neither of you will be able to message the other.`)) return;
      const request = await api(isBlocked ? 'DELETE' : 'POST', `/users/${profile.id}/block`);
      if (request.ok) userProfileScreen(userId, onBack);
      else message.textContent = errorText(request);
    },
  });
  const people = (title, path) => h('button', {
    type: 'button',
    textContent: title,
    onclick: () => {
      const list = h('div', {});
      screenOf(backBar(title, () => userProfileScreen(userId, onBack)), list);
      pagedList(list, path, (person) => userLink(person.id, `${person.first_name} ${person.last_name}`), { empty: `No ${title.toLowerCase()} yet.` });
    },
  });
  const posts = h('div', {});
  content.append(
    h('div', { className: 'card stack' },
      profile.profile_image_url ? h('img', { src: mediaUrl(profile.profile_image_url), alt: '', style: 'max-width:96px;border-radius:50%' }) : '',
      h('strong', { textContent: profile.name }),
      profile.account_role ? h('div', { className: 'meta', textContent: profile.account_role.name }) : '',
      h('div', { className: 'meta', textContent: `${profile.posts_count} posts · ${profile.followers_count} followers · ${profile.following_count} following${profile.is_followed_by ? ' · follows you' : ''}` }),
      follow,
      h('div', { className: 'row wrap' }, messageButton, blockButton),
      h('div', { className: 'row' }, people('Followers', `/users/${profile.id}/followers`), people('Following', `/users/${profile.id}/following`)),
      message),
    h('strong', { textContent: 'Posts' }), posts);
  pagedList(posts, `/posts?user_id=${profile.id}`, (post) => postCard(post, () => userProfileScreen(userId, onBack)), { empty: 'No posts yet.' });
}

function connectCard(person) {
  const state = { status: person.follow_status };
  const message = h('div', { className: 'err' });
  const button = h('button', { className: 'primary', type: 'button' });
  const labels = { none: 'Follow', pending: 'Requested (cancel)', accepted: 'Following' };
  const draw = () => { button.textContent = labels[state.status]; };
  button.onclick = async () => {
    const undo = state.status !== 'none';
    const res = await api(undo ? 'DELETE' : 'POST', `/users/${person.id}/follow`);
    if (!res.ok) {
      message.textContent = errorText(res);
      return;
    }
    message.textContent = '';
    state.status = undo ? 'none' : (res.data.is_following ? 'accepted' : 'pending');
    draw();
  };
  draw();
  return h('div', { className: 'card stack' },
    h('div', { className: 'row' },
      person.profile_image_url ? h('img', { src: mediaUrl(person.profile_image_url), alt: '', className: 'avatar' }) : '',
      userLink(person.id, person.name, ` · ${person.followers_count} followers${person.shares_native_place ? ' · Native' : ''}`)),
    button,
    message);
}

const AVATAR_LOOKS = {

    background: '#bfe3d0', backgroundLight: '#effaf4', skin: '#c98d62', skinLight: '#dca47a', skinShade: '#a8704a',
    hair: '#1a1210', hairShine: '#6b5a50', lips: '#a85c4a', cheek: '#e8956e',
    outer: '#f08a24', outerLight: '#f7a84e', outerShade: '#c96d12', trim: '#f4efe6',
    tufts: true, ponytail: false, bindi: false, hoops: false, earbuds: true, lashes: false, browWidth: 3.4,
  },
  anjali: {

    hair: '#150e0d', hairShine: '#5c4a42', lips: '#c0505e', cheek: '#ee9a78',
    outer: '#1fa39a', outerLight: '#3cc2b8', outerShade: '#15796f', trim: '#f4efe6', scrunchie: '#ef5d9a',
    tufts: false, ponytail: true, bindi: true, hoops: true, earbuds: false, lashes: true, browWidth: 3,

const SVG_NS = 'http://www.w3.org/2000/svg';

function svgEl(name, attrs, children = []) {
  const node = document.createElementNS(SVG_NS, name);
  Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
  node.append(...children);
  return node;
}

function svgGradient(kind, id, attrs, stops) {
  return svgEl(kind, { id, ...attrs }, stops.map(([offset, color]) => svgEl('stop', { offset, 'stop-color': color })));
}

function mouthShape(open, width) {
  const { x, y } = MOUTH_CENTER;
  const half = MOUTH_HALF_WIDTH * width;
  const corner = y - MOUTH_SMILE * (1 - open);
  const upperLift = 2 + open * 3;
  const lowerDrop = 3 + open * MOUTH_MAX_DEPTH_FACTOR;
  const lens = `M${x - half} ${corner} Q${x} ${y - upperLift} ${x + half} ${corner} Q${x} ${y + lowerDrop} ${x - half} ${corner}Z`;
  const lowerLip = `M${x - half} ${corner} Q${x} ${y + lowerDrop} ${x + half} ${corner} Q${x} ${y + lowerDrop + LIP_THICKNESS * 2} ${x - half} ${corner}Z`;
  const teethTop = y - upperLift * 0.35;
  const teethBottom = y + Math.min(5, open * 9);
  const teeth = `M${x - half * 0.68} ${teethTop} L${x + half * 0.68} ${teethTop} L${x + half * 0.6} ${teethBottom} L${x - half * 0.6} ${teethBottom}Z`;
  const tongueHeight = Math.max(0, Math.min(3.2, (open - TONGUE_OPEN_THRESHOLD) * 6));
  return {
    lens,
    lowerLip,
    teeth,
    teethOpacity: open > 0.08 ? 1 : 0,
    tongue: { cx: x, cy: y + lowerDrop * 0.36, rx: half * 0.5, ry: tongueHeight },
    shine: { cx: x, cy: y + lowerDrop / 2 + LIP_THICKNESS / 2, rx: half * 0.3, ry: 0.7 },
  };
}

function avatarEye(center, avatarId) {
  const { x, y, side } = center;
  const clipId = `eye-clip-${avatarId}-${side}`;
  const iris = svgEl('g', {}, [
    svgEl('circle', { cx: x, cy: y, r: 6.4, fill: '#5a3320' }),
    svgEl('circle', { cx: x, cy: y, r: 4.8, fill: '#7a4a2c' }),
    svgEl('circle', { cx: x, cy: y, r: 3.2, fill: '#120a07' }),
    svgEl('circle', { cx: x + 2.2, cy: y - 2.4, r: 1.9, fill: '#ffffff' }),
    svgEl('circle', { cx: x - 2.2, cy: y + 2.2, r: 0.9, fill: '#ffffff', opacity: 0.8 }),
  ]);
  const group = svgEl('g', {}, [
    svgEl('clipPath', { id: clipId }, [svgEl('ellipse', { cx: x, cy: y, rx: 9.6, ry: 8.2 })]),
    svgEl('ellipse', { cx: x, cy: y, rx: 9.6, ry: 8.2, fill: '#fbf7f2' }),
    svgEl('g', { 'clip-path': `url(#${clipId})` }, [iris]),
    svgEl('path', {
      d: `M${x - 9.8} ${y - 1} Q${x} ${y - 12} ${x + 9.8} ${y - 1}`,
      stroke: '#150a07', 'stroke-width': 2.2, 'stroke-linecap': 'round', fill: 'none',
    }),
  ]);
  const setBlink = (scale) => group.setAttribute('transform', `translate(${x} ${y}) scale(1 ${scale}) translate(${-x} ${-y})`);
  const setGaze = (dx, dy) => iris.setAttribute('transform', `translate(${dx} ${dy})`);
  return { group, setBlink, setGaze };
}

function avatarLashes(center, look) {
  if (!look.lashes) return [];
  const { x, y, side } = center;
  return [[9, -5, 12.8, -8.4], [9.8, -2, 13.8, -3.6]].map(([x1, y1, x2, y2]) => svgEl('path', {
    d: `M${x + side * x1} ${y + y1} L${x + side * x2} ${y + y2}`,
    stroke: '#150a07', 'stroke-width': 1.5, 'stroke-linecap': 'round',
  }));
}

  return [
    svgEl('ellipse', { cx: 110, cy: 174, rx: 44, ry: 21, fill: look.outerShade }),

function avatarFace(look, avatarId) {

function avatarEarAccessories(look) {
  const earbuds = look.earbuds
    ? [67, 153].map((cx) => svgEl('g', {}, [
      svgEl('circle', { cx, cy: 113, r: 3.1, fill: '#ffffff', stroke: '#d6d6d6', 'stroke-width': 0.8 }),
      svgEl('path', { d: `M${cx} 115 L${cx} 124`, stroke: '#ffffff', 'stroke-width': 2, 'stroke-linecap': 'round' }),

    : [];

function avatarDefs(look, avatarId) {
  return svgEl('defs', {}, [
    svgGradient('radialGradient', `${avatarId}-skin`, { cx: 0.5, cy: 0.4, r: 0.75 },
      [[0, look.skinLight], [1, look.skin]]),
    svgGradient('radialGradient', `${avatarId}-bg`, { cx: 0.5, cy: 0.4, r: 0.75 },
      [[0, look.backgroundLight], [1, look.background]]),
    svgGradient('linearGradient', `${avatarId}-outer`, { x1: 0, y1: 0, x2: 0, y2: 1 },
      [[0, look.outerLight], [1, look.outer]]),
    svgEl('clipPath', { id: `${avatarId}-clip` }, [
      svgEl('circle', { cx: AVATAR_CENTER.x, cy: AVATAR_CENTER.y, r: AVATAR_CLIP_RADIUS }),
    ]),
  ]);
}

function randomBetween(min, spread) {
  return min + Math.random() * spread;
}

function buildAvatar(avatar) {
  const look = AVATAR_LOOKS[avatar.id] || AVATAR_LOOKS.arjun;
  const eyes = EYE_CENTERS.map((center) => avatarEye(center, avatar.id));
  const brows = EYE_CENTERS.map(() => svgEl('path', {
    d: '', stroke: look.hair, 'stroke-width': look.browWidth, 'stroke-linecap': 'round', fill: 'none',
  }));
  const browPath = (cx, lift) => `M${cx - 9} ${93 - lift * 0.4} Q${cx} ${87.5 - lift} ${cx + 9} ${93 - lift * 0.4}`;
  const lowerLip = svgEl('path', { fill: look.lips });
  const mouthInside = svgEl('path', { fill: '#4a1a1a', stroke: look.lips, 'stroke-width': 2.8, 'stroke-linejoin': 'round' });
  const mouthTeeth = svgEl('path', { fill: '#ffffff' });
  const tongue = svgEl('ellipse', { fill: '#c4505a' });
  const lipShine = svgEl('ellipse', { fill: '#ffffff', opacity: 0.3 });
  const mouth = svgEl('g', {}, [lowerLip, mouthInside, mouthTeeth, tongue, lipShine]);
  const hair = avatarHair(look);
  const ears = [65, 155].map((cx) => svgEl('ellipse', { cx, cy: 112, rx: 5.5, ry: 8.5, fill: look.skinShade }));
  const backHair = svgEl('g', {}, hair.back);
  const head = svgEl('g', {}, [
    svgEl('ellipse', { cx: 110, cy: 157, rx: 14, ry: 5, fill: '#3a2010', opacity: 0.25 }),
    ...ears, ...avatarEarAccessories(look), ...avatarFace(look, avatar.id),
    ...EYE_CENTERS.flatMap((center) => avatarLashes(center, look)),
    ...eyes.map((eye) => eye.group), mouth, ...hair.front, ...brows,
  ]);
  const outfit = svgEl('g', {}, avatarOutfit(look, avatar.id));
  const ring = svgEl('circle', {
    cx: AVATAR_CENTER.x, cy: AVATAR_CENTER.y, r: AVATAR_RING_RADIUS, fill: 'none', 'stroke-linecap': 'round',
  });
  const svg = svgEl('svg', { viewBox: '25 24 170 170', width: AVATAR_SIZE, height: AVATAR_SIZE }, [
    avatarDefs(look, avatar.id),
    svgEl('g', { 'clip-path': `url(#${avatar.id}-clip)` }, [
      svgEl('rect', { x: 0, y: 0, width: 220, height: 240, fill: `url(#${avatar.id}-bg)` }),
      svgEl('circle', {
        cx: AVATAR_CENTER.x, cy: 96, r: 70, fill: 'none', stroke: '#ffffff', 'stroke-width': 1.2,
        'stroke-dasharray': '1 5', 'stroke-linecap': 'round', opacity: 0.55,
      }),
      backHair, outfit, head,
    ]),
    ring,
  ]);

  let level = 0;
  let shown = 0;
  let state = 'idle';
  let microGaze = { x: 0, y: 0 };
  let nextGazeAt = 0;
  let nextBlinkAt = BLINK_MIN_MS;
  let blinkUntil = 0;
  const motion = { gazeX: 0, gazeY: 0, tilt: 0, brow: 0, browRight: 0 };
  const follow = (current, target, rate) => current + (target - current) * rate;

  const animate = (now) => {
    if (!svg.isConnected) return;
    const style = AVATAR_STATES[state];
    if (now >= nextBlinkAt) {
      blinkUntil = now + BLINK_DURATION_MS;
      nextBlinkAt = now + randomBetween(BLINK_MIN_MS, BLINK_SPREAD_MS);
    }
    if (now >= nextGazeAt) {
      microGaze = { x: (Math.random() * 2 - 1) * GAZE_RANGE, y: (Math.random() * 2 - 1) * GAZE_RANGE * 0.5 };
      nextGazeAt = now + randomBetween(GAZE_MIN_MS, GAZE_SPREAD_MS);
    }
    motion.gazeX = follow(motion.gazeX, style.gazeX + microGaze.x, GAZE_FOLLOW);
    motion.gazeY = follow(motion.gazeY, style.gazeY + microGaze.y, GAZE_FOLLOW);
    motion.tilt = follow(motion.tilt, style.tilt, STATE_FOLLOW);
    motion.brow = follow(motion.brow, style.brow, STATE_FOLLOW);
    motion.browRight = follow(motion.browRight, style.browRight, STATE_FOLLOW);
    shown = follow(shown, level, MOUTH_FOLLOW);

    const open = Math.min(1, shown) * MOUTH_MAX_OPEN;
    const shape = mouthShape(open, 1 - open * MOUTH_WIDTH_SHRINK);
    lowerLip.setAttribute('d', shape.lowerLip);
    mouthInside.setAttribute('d', shape.lens);
    mouthTeeth.setAttribute('d', shape.teeth);
    mouthTeeth.setAttribute('opacity', String(shape.teethOpacity));
    Object.entries(shape.tongue).forEach(([key, value]) => tongue.setAttribute(key, String(value)));
    Object.entries(shape.shine).forEach(([key, value]) => lipShine.setAttribute(key, String(value)));
    mouth.setAttribute('transform', `translate(0 ${open * MOUTH_JAW_DROP})`);

    const blinkScale = now < blinkUntil ? BLINK_CLOSED_SCALE : 1;
    eyes.forEach((eye) => {
      eye.setBlink(blinkScale);
      eye.setGaze(motion.gazeX, motion.gazeY);
    });
    brows.forEach((brow, index) => {
      const lift = open * BROW_LIFT + motion.brow + (index === 1 ? motion.browRight : 0);
      brow.setAttribute('d', browPath(EYE_CENTERS[index].x, lift));
    });

    const sway = Math.sin((now / SWAY_PERIOD_MS) * Math.PI * 2) * SWAY_DEGREES;
    const bob = Math.sin((now / BOB_PERIOD_MS) * Math.PI * 2) * BOB_PIXELS;
    const headTransform = `translate(0 ${bob + open * NOD_PIXELS}) rotate(${sway + motion.tilt} 110 170)`;
    head.setAttribute('transform', headTransform);
    backHair.setAttribute('transform', headTransform);
    outfit.setAttribute('transform', `translate(0 ${Math.sin((now / BREATH_PERIOD_MS) * Math.PI * 2) * BREATH_PIXELS})`);

    const pulse = 0.5 + 0.5 * Math.sin((now / RING_PULSE_PERIOD_MS) * Math.PI * 2);
    const energy = state === 'speaking' ? Math.min(1, shown) : 0;
    const baseOpacity = state === 'listening' ? style.ringOpacity * (0.55 + 0.45 * pulse) : style.ringOpacity;
    ring.setAttribute('stroke', style.ring);
    ring.setAttribute('stroke-opacity', String(Math.min(1, baseOpacity + energy * RING_ENERGY_OPACITY)));
    ring.setAttribute('stroke-width', String(style.ringWidth + energy * RING_ENERGY_WIDTH));
    ring.setAttribute('stroke-dasharray', style.dashed ? RING_DASH : 'none');
    ring.setAttribute('stroke-dashoffset', String(-now * RING_DASH_SPEED));
    requestAnimationFrame(animate);
  };
  requestAnimationFrame(animate);
  return {
    element: svg,
    setOpen: (value) => { level = value; },
    setState: (value) => { state = AVATAR_STATES[value] ? value : 'idle'; },
  };
}

function playWithLipSync(blob, setOpen) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    const context = new AudioContext();
    const analyser = context.createAnalyser();
    analyser.fftSize = LEVEL_FFT_SIZE;
    context.createMediaElementSource(audio).connect(analyser);
    analyser.connect(context.destination);
    const samples = new Uint8Array(analyser.fftSize);
    let frame = 0;
    let smoothed = 0;
    const tick = () => {
      analyser.getByteTimeDomainData(samples);
      const peak = samples.reduce((max, value) => Math.max(max, Math.abs(value - 128)), 0) / 128;
      const target = Math.min(1, Math.pow(peak * LEVEL_GAIN, LIP_CURVE));
      smoothed += (target - smoothed) * (target > smoothed ? LIP_ATTACK : LIP_RELEASE);
      setOpen(smoothed);
      frame = requestAnimationFrame(tick);
    };
    const finish = () => {
      cancelAnimationFrame(frame);
      setOpen(0);
      context.close();
      URL.revokeObjectURL(url);
      resolve();
    };
    audio.onended = finish;
    audio.onerror = finish;
    audio.play().then(tick, finish);
  });
}

async function fetchSpeech(text, avatarId) {
  try {
    const res = await fetch(`${store.base}/ai/voice/speak`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${store.access}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, avatar_id: avatarId }),
    });
    logCall('POST', '/ai/voice/speak', res.status, res.ok ? '(audio)' : await res.text());
    return res.ok ? await res.blob() : null;
  } catch (error) {
    logCall('POST', '/ai/voice/speak', 0, error.message);
    return null;
  }
}

async function recordClip() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const recorder = new MediaRecorder(stream);
  const chunks = [];
  recorder.ondataavailable = (event) => chunks.push(event.data);
  const stopped = new Promise((resolve) => {
    recorder.onstop = () => {
      stream.getTracks().forEach((track) => track.stop());
      resolve(new Blob(chunks, { type: recorder.mimeType }));
    };
  });
  recorder.start();
  return { stop: () => recorder.stop(), blob: stopped };
}

async function voicePanel(ask) {
  const avatarsRes = await api('GET', '/ai/avatars');
  if (!avatarsRes.ok) return { panel: h('div', { className: 'err', textContent: errorText(avatarsRes) }), speak: async () => {}, setState: () => {} };
  const avatars = avatarsRes.data;
  const picker = h('select', {}, avatars.map((a) => h('option', { value: a.id, textContent: `${a.name} (${a.gender})` })));
  const face = h('div', { style: 'text-align:center' });
  let current = { setOpen: () => {}, setState: () => {} };
  let avatarState = 'idle';
  let selection = 0;
  const setState = (value) => {
    avatarState = value;
    current.setState(value);
  };
  const showAvatar = async () => {
    selection += 1;
    const mine = selection;
    face.replaceChildren(h('div', { className: 'meta', textContent: 'Loading avatar…' }));
    const chosen = avatars.find((a) => a.id === picker.value);
    const built = buildAvatar(chosen);
    if (mine !== selection) return;
    current = built;
    built.setState(avatarState);
    face.replaceChildren(built.element);
  };
  picker.onchange = showAvatar;
  showAvatar();
  const status = h('div', { className: 'meta', textContent: 'Tap the mic and speak.' });
  const speakReplies = h('input', { type: 'checkbox', checked: true });
  const mic = h('button', { type: 'button', textContent: '🎤 Start talking' });
  let recording = null;
  mic.onclick = async () => {
    if (recording) {
      recording.stop();
      mic.disabled = true;
      setState('thinking');
      status.textContent = 'Transcribing…';
      const clip = await recording.blob;
      recording = null;
      const form = new FormData();
      form.append('audio', clip, 'clip.webm');
      const heard = await api('POST', '/ai/voice/transcribe', { form });
      mic.disabled = false;
      mic.textContent = '🎤 Start talking';
      if (!heard.ok) {
        setState('idle');
        status.textContent = errorText(heard);
        return;
      }
      status.textContent = `You said: ${heard.data.text}`;
      ask(heard.data.text);
      return;
    }
    try {
      recording = await recordClip();
    } catch (error) {
      status.textContent = `Microphone unavailable: ${error.message}`;
      return;
    }
    mic.textContent = '⏹ Stop';
    setState('listening');
    status.textContent = 'Listening…';
  };
  const speak = async (text) => {
    if (!speakReplies.checked) {
      setState('idle');
      return;
    }
    status.textContent = 'Speaking…';
    const audio = await fetchSpeech(text, picker.value);
    if (!audio) {
      setState('idle');
      status.textContent = 'Could not generate speech.';
      return;
    }
    setState('speaking');
    await playWithLipSync(audio, (value) => current.setOpen(value));
    setState('idle');
    status.textContent = 'Tap the mic and speak.';
  };
  const panel = h('div', { className: 'card' }, face, h('div', { className: 'row' }, picker, mic),
    h('label', { style: 'display:flex;gap:6px;align-items:center' }, speakReplies, 'Speak replies'), status);
  return { panel, speak, setState };
}

function assistantScreen() {
  subScreen('Native Assistant', async (content) => {
    const chat = h('div', {});
    const input = h('input', { type: 'text', placeholder: 'Ask about your village' });
    const useLocation = h('input', { type: 'checkbox' });
    const send = h('button', { className: 'fit', type: 'submit', textContent: 'Ask' });
    let voice = null;
    const ask = async (prompt) => {
      chat.append(h('div', { className: 'card', style: 'background:#eef5ee', textContent: `You: ${prompt}` }));
      const pending = h('div', { className: 'meta', textContent: 'Thinking…' });
      chat.append(pending);
      send.disabled = true;
      if (voice) voice.setState('thinking');
      const json = { prompt };
      if (useLocation.checked) Object.assign(json, (await currentPosition()) || {});
      const res = await api('POST', '/ai/ask', { json });
      send.disabled = false;
      if (!res.ok) {
        pending.className = 'err';
        pending.textContent = errorText(res);
        if (voice) voice.setState('idle');
        return;
      }
      pending.replaceWith(h('div', { className: 'card' },
        h('div', { style: 'white-space:pre-wrap', textContent: res.data.answer }),
        (res.data.posts || []).map(assistantPostCard)));
      if (voice) voice.speak(res.data.answer);
    };
    const form = h('form', {},
      h('div', { className: 'row' }, input, send),
      h('label', { style: 'display:flex;gap:6px;align-items:center' }, useLocation, 'Use my current location'));
    form.onsubmit = (event) => {
      event.preventDefault();
      if (!input.value.trim()) return;
      const prompt = input.value;
      input.value = '';

const CHAT_PAGE_LIMIT = 30;

const DIRECT_CHAT_EVENTS = ['direct_message.created', 'direct_message.read'];
const TYPING_REFRESH_MS = 3000;
const TYPING_EXPIRE_MS = 5000;

function presenceText(presence) {
  if (!presence || !presence.visible) return '';
  if (presence.is_online) return 'online';
  return presence.last_seen_at ? `last seen ${formatDate(presence.last_seen_at)}` : 'offline';
}

async function directChatScreen(partner, onBack) {
  const list = h('div', { className: 'stack' });
  const error = h('div', { className: 'err' });
  const input = h('input', { type: 'text', placeholder: `Message ${partner.name}`, maxLength: 2000 });
  const send = h('button', { className: 'fit', type: 'submit', textContent: 'Send' });
  const form = h('form', { className: 'row' }, input, send);
  const status = h('div', { className: 'meta', style: 'margin:-4px 0 8px' });
  screenOf(backBar(partner.name, onBack), status, form, error, list);
  realtime.openChatPartnerId = partner.id;
  const state = { presence: '', typingTimer: null, lastTypingSent: 0 };
  const drawStatus = () => { status.textContent = state.typingTimer ? 'typing…' : state.presence; };
  const loadPresence = async () => {
    const res = await api('GET', `/chats/${partner.id}/presence`);
    state.presence = res.ok ? presenceText(res.data) : '';
    drawStatus();
  };
  const sendTyping = (isTyping) => {
    state.lastTypingSent = isTyping ? Date.now() : 0;
    sendSocket({ type: 'typing', user_id: partner.id, is_typing: isTyping }, { quiet: true });
  };
  input.oninput = () => {
    if (!input.value) sendTyping(false);
    else if (Date.now() - state.lastTypingSent > TYPING_REFRESH_MS) sendTyping(true);
  };
  input.onblur = () => { if (state.lastTypingSent) sendTyping(false); };
  const load = async () => {
    const res = await api('GET', `/chats/${partner.id}/messages?limit=${CHAT_PAGE_LIMIT}`);
    if (!res.ok) {
      error.textContent = errorText(res);
      return;
    }
    list.replaceChildren(...listOf(res.data).map((message) => {
      const mine = message.sender_id === session.me.id;
      const receipt = mine ? (message.read_at ? ' · read' : ' · sent') : '';
      return h('div', { className: 'card', style: mine ? 'background:#eef5ee;margin-left:40px' : 'margin-right:40px' },
        h('div', { textContent: message.content }),
        h('div', { className: 'meta', textContent: `${mine ? 'You' : partner.name} · ${formatDate(message.created_at)}${receipt}` }));
    }));
    api('POST', `/chats/${partner.id}/read`);
  };
  form.onsubmit = async (event) => {
    event.preventDefault();
    if (!input.value.trim()) return;
    send.disabled = true;
    const res = await api('POST', `/chats/${partner.id}/messages`, { json: { content: input.value } });
    send.disabled = false;
    if (!res.ok) {
      error.textContent = errorText(res);
      return;
    }
    input.value = '';
    error.textContent = '';
    state.lastTypingSent = 0;
    load();
  };
  realtime.onEvent = (event) => {
    if (DIRECT_CHAT_EVENTS.includes(event.type)) {
      if (event.type === 'direct_message.created' && event.data.message.sender_id === partner.id) {
        clearTimeout(state.typingTimer);
        state.typingTimer = null;
        drawStatus();
      }
      load();
    }
    if (event.type === 'presence.changed' && event.data.user_id === partner.id) {
      state.presence = presenceText(event.data);
      drawStatus();
    }
    if (event.type === 'direct_message.typing' && event.data.user_id === partner.id) {
      clearTimeout(state.typingTimer);
      state.typingTimer = event.data.is_typing ? setTimeout(() => { state.typingTimer = null; drawStatus(); }, TYPING_EXPIRE_MS) : null;
      drawStatus();
    }
  };
  await Promise.all([loadPresence(), load()]);
}

    const mine = new Set(poll.my_option_ids);
    let ids = [optionId];
    if (poll.allows_multiple) {
      if (mine.has(optionId)) mine.delete(optionId);
      else mine.add(optionId);
      ids = [...mine];
    }
    const res = await api('PUT', `/communities/${community.id}/polls/${poll.id}/vote`, { json: { option_ids: ids } });
    if (res.ok) reload();
    else message.textContent = errorText(res);
  };
  const options = poll.options.map((option) => {
    const picked = poll.my_option_ids.includes(option.id);
    const votes = option.votes_count == null ? '' : ` (${option.votes_count})`;
    return h('button', { className: 'option', type: 'button', disabled: poll.is_closed, textContent: `${picked ? '● ' : '○ '}${option.text}${votes}`, onclick: () => vote(option.id) });
  });
  const removeVote = poll.my_option_ids.length
    ? h('button', { type: 'button', textContent: 'Remove my vote', onclick: async () => { const res = await api('DELETE', `/communities/${community.id}/polls/${poll.id}/vote`); if (res.ok) reload(); } })

  return h('div', { className: 'card' },
    h('strong', { textContent: poll.question }),
    h('div', { className: 'meta', textContent: `${poll.author.name} · ${poll.created_at_relative}${poll.is_closed ? ' · closed' : ''}${poll.total_votes != null ? ` · ${poll.total_votes} votes` : ''}` }),

const LOST_FOUND_CATEGORY_SLUG = 'lost-found';
const LOST_FOUND_ENTITY_TYPE = 'lost_found_item';
const NOT_FOUND_STATUS = 404;
const RESPONSE_NOTE_LIMIT = 300;
const LOST_FOUND_FILTERS = [
  { id: '', label: 'All' },
  { id: 'lost', label: 'Lost' },
  { id: 'found', label: 'Found' },
  { id: 'mine', label: 'My reports' },
];
const LOST_FOUND_EDIT_FIELDS = [
  { name: 'title', label: 'Title' },
  { name: 'description', label: 'Description', type: 'textarea' },
  { name: 'location_name', label: 'Place' },
  { name: 'occurred_on', label: 'Date', type: 'date' },
  { name: 'contact_info', label: 'Contact' },
];

function lostFoundCard(item, reload) {
  const message = h('div', { className: 'err' });
  const run = async (request) => {
    message.textContent = '';
    const res = await request();
    if (res.ok) reload();
    else message.textContent = errorText(res);
  };
  const respondBox = h('div', { className: 'stack', style: 'margin-top:8px' });
  const buttons = [];
  if (!item.is_mine && item.status === 'open') {
    buttons.push(h('button', {
      type: 'button',
      textContent: item.kind === 'lost' ? 'I found this item' : 'This is my item',
      onclick: () => respondForm(item, respondBox),
    }));
  }
  if (item.is_mine && item.status === 'open') {
    buttons.push(h('button', { type: 'button', textContent: 'Mark resolved', onclick: () => run(() => api('POST', `/lost-found/${item.id}/resolve`)) }));
    buttons.push(h('button', { type: 'button', textContent: 'Edit', onclick: () => lostFoundEditScreen(item) }));
    buttons.push(h('button', { type: 'button', textContent: 'Add images', onclick: () => lostFoundImagesScreen(item) }));
  }
  if (item.is_mine) {
    buttons.push(h('button', {
      type: 'button',
      textContent: 'Delete',
      onclick: () => {
        if (window.confirm(`Delete "${item.title}"?`)) run(() => api('DELETE', `/lost-found/${item.id}`));
      },
    }));
  }
  return h('div', { className: 'card' },
    h('strong', { textContent: `${item.kind.toUpperCase()}: ${item.title}` }),
    h('div', { className: 'meta', textContent: `${item.status} · ${item.category ? item.category.name : ''} · ${item.location_name} · ${item.occurred_on}${item.distance_km != null ? ` · ${item.distance_km} km` : ''}` }),
    h('div', { className: 'meta', textContent: `Reported by ${item.is_mine ? 'you' : item.author.name}` }),
    h('div', { textContent: item.description }),
    h('div', { className: 'meta', textContent: `Contact: ${item.contact_info}` }),
    mediaSlider((item.images || []).map((image) => ({ file_url: image.image_url }))),
    h('div', { className: 'row wrap', style: 'margin-top:8px' }, buttons),
    respondBox,
    message);
}

function respondForm(item, box) {
  const note = h('textarea', { placeholder: 'How can they reach you, or where did you see it? (optional)', maxLength: RESPONSE_NOTE_LIMIT });
  const status = h('div', { className: 'err' });
  const send = h('button', {
    type: 'button',
    textContent: 'Notify the author',
    onclick: async () => {
      send.disabled = true;
      const json = note.value.trim() ? { note: note.value.trim() } : {};
      const res = await api('POST', `/lost-found/${item.id}/respond`, { json });
      if (res.ok) {
        box.replaceChildren(h('div', { className: 'ok', textContent: res.message }));
        return;
      }
      send.disabled = false;
      status.textContent = errorText(res);
    },
  });
  box.replaceChildren(note, send, status);
}

const LOST_FOUND_STATUS_CHIPS = [
  { id: 'open', label: 'Open' },
  { id: 'resolved', label: 'Resolved' },
];
const LOST_FOUND_TABS = [
  { id: 'lost', label: 'Lost Items' },
  { id: 'found', label: 'Found Items' },
];

function lostFoundTile(item, onOpen) {
  const image = (item.images || [])[0];
  return h('div', { className: 'card row' },
    image ? h('img', { className: 'thumb fit', src: mediaUrl(image.image_url), alt: '' }) : '',
    h('div', {},
      h('strong', { textContent: item.title }),
      h('div', { className: 'meta', textContent: item.location_name }),
      h('div', { className: 'meta', textContent: `${formatDay(item.occurred_on)}${item.distance_km != null ? ` · ${item.distance_km} km` : ''}${item.status === 'resolved' ? ' · resolved' : ''}` }),
      h('button', { type: 'button', textContent: 'View Details', onclick: () => onOpen(item) })));
}

function formatDay(value) {
  return new Date(`${value}T00:00:00`).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}

function lostFoundScreen(kind = 'lost') {
  const state = { category: '', mine: false, status: 'open' };
  const list = h('div', {});
  const chipBox = h('div', {});
  const search = h('input', { type: 'text', placeholder: `Search ${kind} items…` });
  const searchForm = h('form', {}, search);
  const mineButton = h('button', { className: 'link', type: 'button', textContent: 'Show only my reports' });
  const openDetail = (item) => lostFoundDetailScreen(item.id, () => lostFoundScreen(kind));
  const load = () => {
    list.replaceChildren();
    const path = withQuery('/lost-found', { kind, status: state.status, q: search.value.trim(), category_id: state.category });
    pagedList(
      list,
      path,
      (item) => (state.mine && !item.is_mine ? '' : lostFoundTile(item, openDetail)),
      { empty: `No ${kind} items in your area.` },
    );
  };
  searchForm.onsubmit = (event) => {
    event.preventDefault();
    load();
  };
  mineButton.onclick = () => {
    state.mine = !state.mine;
    mineButton.textContent = state.mine ? 'Showing only my reports — show all' : 'Show only my reports';
    load();
  };
  const tabs = h('div', { className: 'row' }, LOST_FOUND_TABS.map((tab) => h('button', {
    type: 'button',
    className: `tab-btn${tab.id === kind ? ' active' : ''}`,
    textContent: tab.label,
    onclick: () => lostFoundScreen(tab.id),
  })));
  const { row: statusRow } = chipRow(LOST_FOUND_STATUS_CHIPS, (status) => {
    state.status = status;
    load();
  });
  statusRow.firstChild.classList.add('active');
  const postLabel = kind === 'lost' ? 'Post Lost Property' : 'Post Found Property';
  screenOf(
    backBar('Lost & Found', () => homeScreen(shell.tab)),
    h('div', { className: 'hint', style: 'margin:0 0 8px', textContent: 'Help reunite people with their belongings' }),
    tabs,
    statusRow,
    searchForm,
    chipBox,
    mineButton,
    list,
    h('button', { className: 'primary', type: 'button', textContent: postLabel, onclick: () => lostFoundCreateScreen(kind) }),
  );
  loadAllOptions(`/categories?parent_slug=${LOST_FOUND_CATEGORY_SLUG}`).then((categories) => {
    const chips = [{ id: '', label: 'All' }, ...categories.map((c) => ({ id: c.id, label: c.name }))];
    const { row } = chipRow(chips, (id) => {
      state.category = id;
      load();
    });
    row.firstChild.classList.add('active');
    chipBox.append(row);
  });
  load();
}

function lostFoundDetailScreen(itemId, onBack = () => homeScreen('activity')) {
  const content = h('div', {});
  screenOf(backBar('Report', onBack), content);
  const load = async () => {
    content.replaceChildren();
    const res = await api('GET', `/lost-found/${itemId}`);
    if (res.status === NOT_FOUND_STATUS) {
      onBack();
      return;
    }
    content.append(res.ok ? lostFoundCard(res.data, load) : h('div', { className: 'err', textContent: errorText(res) }));
  };
  load();
}

function lostFoundEditScreen(item) {
  const inputs = LOST_FOUND_EDIT_FIELDS.map((field) => ({ field, ...fieldInput(field, item) }));
  const error = h('div', { className: 'err' });
  const button = h('button', { className: 'primary', type: 'submit', textContent: 'Save changes' });
  const el = h('form', {}, inputs.map((i) => i.el), button, error);
  el.onsubmit = async (event) => {
    event.preventDefault();
    error.textContent = '';
    button.disabled = true;
    const res = await api('PATCH', `/lost-found/${item.id}`, collectBody({ encoding: 'json' }, inputs));
    button.disabled = false;
    if (!res.ok) {
      error.textContent = errorText(res);
      return;
    }
    lostFoundScreen(item.kind);
  };
  screenOf(backBar('Edit report', () => lostFoundScreen(item.kind)), el);
}

function lostFoundImagesScreen(item) {
  const input = h('input', { type: 'file', multiple: true, accept: 'image/*' });
  const fileField = { el: h('div', {}, h('label', { textContent: 'Images (max 4 per report)' }), input) };
  screenOf(backBar('Add images', () => lostFoundScreen(item.kind)), form(
    [fileField],
    'Upload',
    async () => {
      if (!input.files.length) return 'Choose at least one image.';
      const body = new FormData();
      [...input.files].forEach((file) => body.append('images', file));
      const res = await api('POST', `/lost-found/${item.id}/images`, { form: body });
      if (!res.ok) return errorText(res);
      lostFoundScreen(item.kind);
      return '';
    },
  ));
}

function locationFields(prefix = '') {
  const name = h('input', { type: 'text', placeholder: 'Place name (optional)' });
  const latitude = h('input', { type: 'number', step: 'any', placeholder: 'Latitude' });
  const longitude = h('input', { type: 'number', step: 'any', placeholder: 'Longitude' });
  const message = h('span', { className: 'err' });
  const locate = h('button', {
    type: 'button',
    textContent: 'Use my current location',
    onclick: () => navigator.geolocation.getCurrentPosition((position) => {
      latitude.value = position.coords.latitude.toFixed(6);
      longitude.value = position.coords.longitude.toFixed(6);
      message.textContent = '';
    }, () => { message.textContent = 'Could not read your location. Type the coordinates instead.'; }),
  });
  const el = h('div', {}, h('label', { textContent: `${prefix}Location` }), name, h('div', { className: 'row' }, latitude, longitude), locate, message);
  return { el, name, latitude, longitude };
}

function postComposer(onDone = () => homeScreen('home'), communityId = null) {
  const content = h('textarea', { placeholder: 'Write here…', maxLength: POST_TEXT_LIMIT });
  const counter = h('div', { className: 'meta', textContent: `0/${POST_TEXT_LIMIT}` });
  content.oninput = () => { counter.textContent = `${content.value.length}/${POST_TEXT_LIMIT}`; };
  const images = h('input', { type: 'file', multiple: true, accept: 'image/*' });
  const video = h('input', { type: 'file', accept: 'video/*' });
  const thumbnail = h('input', { type: 'file', accept: 'image/*' });
  const place = locationFields();
  const audience = h('select', {}, [['everyone', 'Everyone'], ['adults_only', 'Adults only (18+)']].map(([value, label]) => h('option', { value, textContent: label })));
  const error = h('div', { className: 'err' });
  const button = h('button', { className: 'primary', type: 'submit', textContent: 'Post' });
  const el = h('form', { className: 'stack' },
    h('label', { textContent: "What's on your mind?" }), content, counter,
    h('label', { textContent: `Add photos (up to ${POST_MAX_IMAGES}) or one video` }), images,
    h('label', { textContent: 'Video (optional, max 100MB)' }), video,
    h('label', { textContent: 'Video cover image (required with a video)' }), thumbnail,
    place.el,
    h('label', { textContent: 'Audience' }), audience,
    button, error);
  el.onsubmit = async (event) => {
    event.preventDefault();
    error.textContent = '';
    if (images.files.length > POST_MAX_IMAGES) {
      error.textContent = `You can add up to ${POST_MAX_IMAGES} photos.`;
      return;
    }
    if (video.files[0] && images.files.length) {
      error.textContent = 'Choose photos or one video, not both.';
      return;
    }
    if (video.files[0] && !thumbnail.files[0]) {
      error.textContent = 'A video needs a cover image.';
      return;
    }
    button.disabled = true;
    const body = formOf({
      content: content.value,
      status: 'published',
      audience: audience.value,
      visibility: communityId ? 'private' : 'public',
      community_id: communityId,
      location_name: place.name.value,
      latitude: place.latitude.value,
      longitude: place.longitude.value,
    });
    [...images.files].forEach((file) => body.append('images', file));
    if (video.files[0]) {
      body.append('videos', video.files[0]);
      body.append('video_thumbnails', thumbnail.files[0]);
    }
    const res = await api('POST', '/posts', { form: body });
    button.disabled = false;
    if (!res.ok) {
      error.textContent = errorText(res);
      return;
    }
    onDone();
  };
  return el;
}

function createPostScreen() {
  screenOf(backBar('Create Post', createMenuScreen), postComposer());
}

function dealItemRow(state, onRemove) {
  const productMode = Boolean(state.businessId);
  const nameInput = h('input', { type: 'text', placeholder: 'Item name' });
  const unitInput = h('input', { type: 'text', placeholder: 'Unit (kg, pack…)' });
  const quantityInput = h('input', { type: 'number', min: '1', placeholder: 'Quantity' });
  const originalInput = h('input', { type: 'number', step: 'any', min: '0', placeholder: 'Original price (optional)' });
  const dealInput = h('input', { type: 'number', step: 'any', min: '0', placeholder: 'Deal price' });
  const discount = h('span', { className: 'meta', textContent: 'Discount 0%' });
  const productSelect = h('select', {}, h('option', { value: '', textContent: 'Loading products…' }));
  if (productMode) {
    loadAllOptions(`/plugins/ecommerce/businesses/${state.businessId}/products`).then((products) => {
      productSelect.replaceChildren(h('option', { value: '', textContent: 'Choose a product' }), ...products.map((p) => h('option', { value: p.id, textContent: `${p.name} (${p.selling_price})` })));
    });
  }
  const updateDiscount = () => {
    const original = Number(originalInput.value);
    const price = Number(dealInput.value);
    discount.textContent = original > 0 && price >= 0 ? `Discount ${Math.max(0, Math.round(((original - price) / original) * PERCENT))}%` : 'Discount 0%';
  };
  originalInput.oninput = updateDiscount;
  dealInput.oninput = updateDiscount;
  const remove = h('button', { type: 'button', textContent: 'Remove item', onclick: onRemove });
  const layout = productMode
    ? [productSelect, h('div', { className: 'row' }, quantityInput, dealInput)]
    : [nameInput, h('div', { className: 'row' }, unitInput, quantityInput), h('div', { className: 'row' }, originalInput, dealInput), discount];
  const el = h('div', { className: 'card stack' }, ...layout, remove);
  const read = () => {
    const item = { quantity: Number(quantityInput.value), deal_price: dealInput.value };
    if (productMode) return { ...item, product_id: productSelect.value };
    const manualItem = { ...item, name: nameInput.value, unit: unitInput.value };
    if (originalInput.value !== '') manualItem.original_price = originalInput.value;
    return manualItem;
  };
  return { el, read };
}

function dealCreateScreen() {
  const state = { businessId: '' };
  const images = h('input', { type: 'file', multiple: true, accept: 'image/*' });
  const title = h('input', { type: 'text', placeholder: 'eg. fresh vegetable bulk deal' });
  const category = h('select', {}, h('option', { value: '', textContent: 'Loading…' }));
  loadAllOptions(`/categories?parent_slug=${DEAL_CATEGORY_SLUG}`).then(async (children) => {
    const options = children.length
      ? children
      : (await loadAllOptions('/categories')).filter((c) => c.slug === DEAL_CATEGORY_SLUG);
    category.replaceChildren(h('option', { value: '', textContent: 'Select category' }), ...options.map((o) => h('option', { value: o.id, textContent: o.name })));
  });
  const description = h('textarea', { placeholder: "Describe the deal, what's included, quality, brand, etc.", maxLength: POST_TEXT_LIMIT });
  const sellerType = h('select', {},
    h('option', { value: 'individual', textContent: 'Individual — I sell these items myself' }),
    h('option', { value: 'business', textContent: 'Business — sell my business products' }));
  const business = h('select', {}, h('option', { value: '', textContent: 'Choose a business' }));
  api('GET', '/me/businesses?page=1&page_size=100').then((res) => {
    if (res.ok) business.append(...listOf(res.data).map((b) => h('option', { value: b.id, textContent: b.name })));
  });
  const itemsBox = h('div', {});
  let rows = [];
  const addRow = () => {
    const row = dealItemRow(state, () => {
      rows = rows.filter((r) => r !== row);
      row.el.remove();
    });
    rows.push(row);
    itemsBox.append(row.el);
  };
  const resetItems = () => {
    state.businessId = business.value;
    rows = [];
    itemsBox.replaceChildren();
    addRow();
  };
  business.onchange = resetItems;
  const businessBox = h('div', { hidden: true }, h('label', { textContent: 'Business *' }), business);
  sellerType.onchange = () => {
    const isBusiness = sellerType.value === 'business';
    businessBox.hidden = !isBusiness;
    if (!isBusiness) business.value = '';
    resetItems();
  };
  const minJoiners = h('input', { type: 'number', min: '1', placeholder: 'Minimum joiners (optional)' });
  const startsAt = h('input', { type: 'datetime-local' });
  const validUntil = h('input', { type: 'datetime-local' });
  const pickup = h('input', { type: 'text', placeholder: 'Pickup location — address or landmark' });
  const delivery = h('input', { type: 'text', placeholder: 'Delivery details — areas covered' });
  const error = h('div', { className: 'err' });
  const button = h('button', { className: 'primary', type: 'submit', textContent: 'Publish Deal' });
  const el = h('form', { className: 'stack' },
    h('label', { textContent: `Cover images (up to ${DEAL_MAX_IMAGES}) — the first one is the thumbnail` }), images,
    h('label', { textContent: 'Deal title *' }), title,
    h('label', { textContent: 'Category *' }), category,
    h('label', { textContent: 'Description' }), description,
    h('label', { textContent: 'Sell as *' }), sellerType, businessBox,
    h('label', { textContent: 'Items & prices *' }), itemsBox,
    h('button', { type: 'button', textContent: '+ Add item', onclick: addRow }),
    h('label', { textContent: 'Target & progress' }), minJoiners,
    h('label', { textContent: 'Start date & time *' }), startsAt,
    h('label', { textContent: 'End date & time *' }), validUntil,
    h('label', { textContent: 'Pickup / delivery details * (at least one)' }), pickup, delivery,
    button, error);
  addRow();
  el.onsubmit = async (event) => {
    event.preventDefault();
    error.textContent = '';
    if (images.files.length > DEAL_MAX_IMAGES) {
      error.textContent = `You can add up to ${DEAL_MAX_IMAGES} photos.`;
      return;
    }
    if (!startsAt.value || !validUntil.value) {
      error.textContent = 'Choose a start and an end date.';
      return;
    }
    if (sellerType.value === 'business' && !business.value) {
      error.textContent = 'Choose the business that sells these products.';
      return;
    }
    button.disabled = true;
    const body = formOf({
      name: title.value,
      category_id: category.value,
      description: description.value,
      business_id: business.value,
      min_joiners: minJoiners.value,
      starts_at: new Date(startsAt.value).toISOString(),
      valid_until: new Date(validUntil.value).toISOString(),
      pickup_location: pickup.value,
      delivery_details: delivery.value,
      items: JSON.stringify(rows.map((r) => r.read())),
    });
    [...images.files].forEach((file) => body.append('images', file));
    const created = await api('POST', '/deals', { form: body });
    if (!created.ok) {
      button.disabled = false;
      error.textContent = errorText(created);
      return;
    }
    const submitted = await api('POST', `/deals/${created.data.id}/submit`);
    button.disabled = false;
    dealCreatedScreen(created.data, submitted);
  };
  screenOf(backBar('Create Deal', createMenuScreen), el);
}

    h('button', { className: 'primary', type: 'button', textContent: 'Open My deals', onclick: myDealsScreen }),

  );
}

const APP_DATE_PATTERN = /^(\d{2})-(\d{2})-(\d{4}) (\d{1,2}):(\d{2}) (AM|PM)$/;
const HOURS_ON_CLOCK = 12;

function dateTimeLocalValue(text) {
  if (!text) return '';
  const match = APP_DATE_PATTERN.exec(text);
  if (!match) return '';
  const [, day, month, year, hour, minute, meridiem] = match;
  const hours24 = (Number(hour) % HOURS_ON_CLOCK) + (meridiem === 'PM' ? HOURS_ON_CLOCK : 0);
  return `${year}-${month}-${day}T${String(hours24).padStart(2, '0')}:${minute}`;
}

async function dealPreviewScreen(dealId) {
  const content = h('div', {});
  screenOf(backBar('Deal preview', myDealsScreen), content);
  const res = await api('GET', `/deals/${dealId}`);
  if (!res.ok) {
    content.append(h('div', { className: 'err', textContent: errorText(res) }));
    return;
  }
  const deal = res.data;
  const line = (text) => h('div', { className: 'meta', textContent: text });
  content.append(h('div', { className: 'card' },
    deal.images.map((image) => privateImage(image.file_url)),
    h('strong', { textContent: deal.name }),
    line(`Status: ${deal.status} · ${deal.category.name}`),

function dealItemEditor(deal, item, reload) {
  const message = h('div', { className: 'err' });
  const name = h('input', { type: 'text', value: item.name, disabled: Boolean(item.product_id) });
  const unit = h('input', { type: 'text', placeholder: 'Unit', value: item.unit ?? '' });
  const quantity = h('input', { type: 'number', min: '1', placeholder: 'Quantity', value: item.quantity ?? '' });
  const original = h('input', { type: 'number', step: 'any', min: '0', placeholder: 'Original price', value: item.original_price ?? '' });
  const price = h('input', { type: 'number', step: 'any', min: '0', placeholder: 'Deal price', value: item.deal_price ?? '' });
  const run = async (request) => {
    message.textContent = '';
    const res = await request();
    if (res.ok) reload(res.data);
    else message.textContent = errorText(res);
  };
  const save = () => {
    const json = { quantity: Number(quantity.value) || null, deal_price: price.value };
    if (!item.product_id) Object.assign(json, { name: name.value, unit: unit.value || null, original_price: original.value || null });
    return run(() => api('PATCH', `/deals/${deal.id}/items/${item.id}`, { json }));
  };
  return h('div', { className: 'card stack' },
    name,
    item.product_id ? '' : h('div', { className: 'row' }, unit, quantity),
    item.product_id ? quantity : '',
    item.product_id ? '' : h('div', { className: 'row' }, original, price),
    item.product_id ? price : '',
    h('div', { className: 'row wrap' },
      h('button', { type: 'button', textContent: 'Save item', onclick: save }),
      h('button', { type: 'button', textContent: 'Remove item', onclick: () => run(() => api('DELETE', `/deals/${deal.id}/items/${item.id}`)) })),
    message);
}
